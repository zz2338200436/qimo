<!-- 页面功能脚本 -->
<script>
    // 高亮当前导航项 - 已在sidebar-nav.html中定义，这里不再重复定义
    
    // 侧边栏折叠/展开功能
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        
        if (sidebar) {
            sidebar.classList.toggle('collapsed');
            
            // 保存状态到localStorage
            const isCollapsed = sidebar.classList.contains('collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);
            
            // 同时调整主内容区的margin-left
            if (mainContent) {
                if (isCollapsed) {
                    mainContent.classList.add('collapsed');
                } else {
                    mainContent.classList.remove('collapsed');
                }
            }
        }
    }
    
    // 初始化侧边栏状态
    function initializeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        
        // 从localStorage获取侧边栏状态
        const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        
        if (sidebar && mainContent) {
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('collapsed');
            } else {
                sidebar.classList.remove('collapsed');
                mainContent.classList.remove('collapsed');
            }
        }
    }
    
    // 绑定选项卡事件
    function bindTabEvents() {
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        const loadedTabs = new Set(['assignments']);
        
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除所有激活状态
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));
                
                // 添加当前激活状态
                this.classList.add('active');
                const tabId = this.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');

                if (!loadedTabs.has(tabId)) {
                    if (tabId === 'exams') {
                        fetchExams();
                    } else if (tabId === 'scores') {
                        fetchScores();
                    }
                    loadedTabs.add(tabId);
                }
            });
        });
    }
    
    // 存储从API获取的数据
    let assignments = [];
    let exams = [];
    let scores = [];

    function showMessage(text, type = 'info') {
        const existing = document.getElementById('studentAssignmentsMessage');
        if (existing) {
            existing.remove();
        }
        const alertClass = type === 'success'
            ? 'alert-success'
            : type === 'error'
                ? 'alert-danger'
                : type === 'warning'
                    ? 'alert-warning'
                    : 'alert-info';
        const message = document.createElement('div');
        message.id = 'studentAssignmentsMessage';
        message.className = `alert ${alertClass} alert-dismissible fade show mx-3 mt-3`;
        message.innerHTML = `
            ${text}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
        `;
        const contentContainer = document.querySelector('.content-container');
        if (contentContainer) {
            contentContainer.insertBefore(message, contentContainer.firstChild);
        }
    }

    function parseStructuredSubmissionContent(rawContent) {
        if (!rawContent || typeof rawContent !== 'string') {
            return {
                displayText: '',
                extractedContent: '',
                parsed: null
            };
        }

        try {
            const parsed = JSON.parse(rawContent);
            if (parsed && typeof parsed === 'object') {
                const extractedContent = typeof parsed.content === 'string' ? parsed.content : '';
                const lines = [];
                if (extractedContent) {
                    lines.push(extractedContent);
                }
                Object.entries(parsed).forEach(([key, value]) => {
                    if (key === 'content' || value == null || value === '') {
                        return;
                    }
                    lines.push(`${key}: ${typeof value === 'string' ? value : JSON.stringify(value)}`);
                });
                return {
                    displayText: lines.join('\n') || rawContent,
                    extractedContent,
                    parsed
                };
            }
        } catch (error) {
            // Keep raw content for non-JSON submissions.
        }

        return {
            displayText: rawContent,
            extractedContent: rawContent,
            parsed: null
        };
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderStructuredSubmissionHtml(parsedSubmission) {
        if (!parsedSubmission) {
            return '<p>暂无内容</p>';
        }

        const blocks = [];
        if (parsedSubmission.extractedContent) {
            blocks.push(`
                <div class="mb-3">
                    <div class="fw-semibold mb-2">正文</div>
                    <div class="border rounded p-3 bg-light" style="white-space: pre-wrap;">${escapeHtml(parsedSubmission.extractedContent)}</div>
                </div>
            `);
        }

        const parsed = parsedSubmission.parsed;
        if (parsed && typeof parsed === 'object') {
            const attachmentEntries = Object.entries(parsed).filter(([key, value]) => key !== 'content' && value != null && value !== '');
            if (attachmentEntries.length > 0) {
                const attachmentItems = attachmentEntries.map(([key, value]) => {
                    let normalizedValue = value;
                    if (typeof normalizedValue === 'string') {
                        try {
                            const nested = JSON.parse(normalizedValue);
                            if (nested && typeof nested === 'object') {
                                normalizedValue = nested;
                            }
                        } catch (error) {
                            // Keep original string when nested JSON parsing is not applicable.
                        }
                    }

                    if (normalizedValue && typeof normalizedValue === 'object') {
                        const name = normalizedValue.name ? `<div><strong>名称：</strong>${escapeHtml(normalizedValue.name)}</div>` : '';
                        const type = normalizedValue.type ? `<div><strong>类型：</strong>${escapeHtml(normalizedValue.type)}</div>` : '';
                        const size = normalizedValue.size != null ? `<div><strong>大小：</strong>${escapeHtml(normalizedValue.size)} bytes</div>` : '';
                        const note = normalizedValue.note ? `<div><strong>说明：</strong>${escapeHtml(normalizedValue.note)}</div>` : '';
                        const error = normalizedValue.error ? `<div><strong>错误：</strong>${escapeHtml(normalizedValue.error)}</div>` : '';
                        const imagePreview = normalizedValue.data && String(normalizedValue.data).startsWith('data:image/')
                            ? `<img src="${escapeHtml(normalizedValue.data)}" alt="${escapeHtml(normalizedValue.name || key)}" class="img-fluid rounded border mb-2" style="max-height: 240px;">`
                            : '';
                        return `
                            <div class="border rounded p-3 mb-2">
                                <div class="fw-semibold mb-2">${escapeHtml(key)}</div>
                                ${imagePreview}
                                ${name}
                                ${type}
                                ${size}
                                ${note}
                                ${error}
                            </div>
                        `;
                    }
                    return `
                        <div class="border rounded p-3 mb-2">
                            <div class="fw-semibold mb-2">${escapeHtml(key)}</div>
                            <div>${escapeHtml(normalizedValue)}</div>
                        </div>
                    `;
                }).join('');

                blocks.push(`
                    <div class="mb-3">
                        <div class="fw-semibold mb-2">附件/补充信息</div>
                        ${attachmentItems}
                    </div>
                `);
            }
        }

        if (blocks.length === 0) {
            blocks.push(`<div style="white-space: pre-wrap;">${escapeHtml(parsedSubmission.displayText || '暂无内容')}</div>`);
        }

        return blocks.join('');
    }
    
    // 渲染作业列表
    function renderAssignments(assignments) {
        const container = document.getElementById('assignment-list');
        container.innerHTML = '';

        // 如果没有任何作业，显示空状态提示，避免列表区域完全空白
        if (!assignments || assignments.length === 0) {
            const emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            emptyState.innerHTML = `
                <div class="empty-icon">
                    <i class="fa fa-inbox"></i>
                </div>
                <div class="empty-text">
                    <p>当前没有可以显示的作业。</p>
                    <p class="text-muted">请稍后再来查看，或联系任课教师确认是否已经发布作业。</p>
                </div>
            `;
            container.appendChild(emptyState);
            return;
        }
        
        assignments.forEach(assignment => {
            const assignmentItem = document.createElement('div');
            assignmentItem.className = `assignment-item ${assignment.status}`;
            
            // 按钮内容
            let buttonsHTML = '';
            if (assignment.status === 'pending' || assignment.status === 'submitted') {
                buttonsHTML = `
                    <div class="item-actions">
                        <button class="btn btn-primary btn-sm" onclick="viewAssignment(${assignment.id})">
                            <i class="fa fa-eye"></i> 查看
                        </button>
                        <button class="btn btn-success btn-sm" onclick="showSubmitAssignmentModal(${assignment.id})">
                            <i class="fa fa-upload"></i> ${assignment.status === 'pending' ? '提交' : '重新提交'}
                        </button>
                    </div>
                `;
            } else {
                buttonsHTML = `
                    <div class="item-actions">
                        <button class="btn btn-primary btn-sm" onclick="viewAssignment(${assignment.id})">
                            <i class="fa fa-eye"></i> 查看
                        </button>
                    </div>
                `;
            }
            
            assignmentItem.innerHTML = `
                <div class="item-info">
                    <h5 class="item-title">${assignment.title}</h5>
                    <div class="item-meta">
                        <span><i class="fa fa-book"></i> ${assignment.course}</span>
                        <span><i class="fa fa-calendar"></i> ${assignment.dueDate}</span>
                    </div>
                </div>
                <div class="item-status">
                    <span class="status-badge ${assignment.status}">
                        ${assignment.status === 'pending' ? '待完成' : assignment.status === 'submitted' ? '已提交' : '已批改'}
                    </span>
                    ${assignment.score ? `<span class="score">${assignment.score}分</span>` : ''}
                </div>
                ${buttonsHTML}
            `;
            container.appendChild(assignmentItem);
        });
    }
    
    // 渲染考试列表
    function renderExams(exams) {
        const container = document.getElementById('exam-list');
        container.innerHTML = '';

        if (!exams || exams.length === 0) {
            const emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            emptyState.innerHTML = `
                <div class="empty-icon">
                    <i class="fa fa-inbox"></i>
                </div>
                <div class="empty-text">
                    <p>当前没有可以显示的考试。</p>
                    <p class="text-muted">考试列表为空时，页面仍保留作业与成绩等其他可用功能。</p>
                </div>
            `;
            container.appendChild(emptyState);
            return;
        }
        
        exams.forEach(exam => {
            const examItem = document.createElement('div');
            examItem.className = `exam-item ${exam.status}`;
            
            // 按钮内容
            let buttonsHTML = '';
            if (exam.status === 'upcoming' || exam.status === 'ongoing') {
                buttonsHTML = `
                    <div class="item-actions">
                        <button class="btn btn-primary btn-sm" onclick="viewExam(${exam.id})">
                            <i class="fa fa-eye"></i> 查看
                        </button>
                        <button class="btn btn-success btn-sm" onclick="startExam(${exam.id})">
                            <i class="fa fa-play"></i> ${exam.status === 'upcoming' ? '准备' : '进入'}
                        </button>
                    </div>
                `;
            } else {
                buttonsHTML = `
                    <div class="item-actions">
                        <button class="btn btn-primary btn-sm" onclick="viewExam(${exam.id})">
                            <i class="fa fa-eye"></i> 查看
                        </button>
                    </div>
                `;
            }
            
            examItem.innerHTML = `
                <div class="item-info">
                    <h5 class="item-title">${exam.title}</h5>
                    <div class="item-meta">
                        <span><i class="fa fa-book"></i> ${exam.course}</span>
                        <span><i class="fa fa-calendar"></i> ${exam.examDate}</span>
                    </div>
                </div>
                <div class="item-status">
                    <span class="status-badge ${exam.status}">
                        ${exam.status === 'upcoming' ? '即将到来' : exam.status === 'ongoing' ? '进行中' : exam.status === 'submitted' ? '已提交' : exam.status === 'completed' ? '已完成' : '已批改'}
                    </span>
                    ${exam.score ? `<span class="score">${exam.score}分</span>` : ''}
                </div>
                ${buttonsHTML}
            `;
            container.appendChild(examItem);
        });
    }

    function syncExamDetailToCache(examDetail) {
        if (!examDetail || examDetail.id == null || !Array.isArray(exams)) {
            return;
        }

        const examId = Number(examDetail.id);
        const index = exams.findIndex(item => Number(item.id) === examId);
        const existingExam = index === -1 ? { id: examId } : exams[index];
        let status = existingExam?.status || 'upcoming';
        const now = new Date();
        const startTime = examDetail.startTime ? new Date(examDetail.startTime) : null;
        const endTime = examDetail.endTime ? new Date(examDetail.endTime) : null;

        if (examDetail.submission) {
            status = examDetail.submission.graded ? 'graded' : 'submitted';
        } else if (endTime && endTime < now) {
            status = 'completed';
        } else if (startTime && endTime && startTime <= now && endTime >= now) {
            status = 'ongoing';
        }

        const normalizedExam = {
            ...existingExam,
            title: examDetail.title ?? existingExam.title,
            description: examDetail.description ?? existingExam.description,
            course: examDetail.courseName || existingExam.course || '未知课程',
            examDate: examDetail.startTime ? new Date(examDetail.startTime).toLocaleString() : existingExam.examDate,
            status,
            score: examDetail.submission ? examDetail.submission.score : existingExam.score,
            teacherComment: examDetail.submission ? examDetail.submission.teacherComment : existingExam.teacherComment,
            submission: examDetail.submission || null
        };

        if (index === -1) {
            exams.push(normalizedExam);
            return;
        }

        exams[index] = normalizedExam;
    }
    
    // 渲染成绩列表
    function formatScoreTypeLabel(type, fallbackLabel = '') {
        const normalized = String(type || '').toLowerCase();
        if (normalized === 'assignment') {
            return '作业';
        }
        if (normalized === 'exam') {
            return '考试';
        }
        return fallbackLabel || '成绩';
    }

    function renderScores(scores) {
        const container = document.getElementById('score-list');
        container.innerHTML = '';

        if (!scores || scores.length === 0) {
            container.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">暂无成绩数据</td></tr>';
            return;
        }
        
        scores.forEach(score => {
            const scoreItem = document.createElement('tr');
            const scoreValue = score.score ?? null;
            const rankValue = score.rank ?? null;
            const typeLabel = formatScoreTypeLabel(score.type, score.typeLabel);
            scoreItem.innerHTML = `
                <td>${escapeHtml(score.course || '未知课程')}</td>
                <td>
                    <div class="fw-semibold">${escapeHtml(score.exam || '未知项目')}</div>
                    <div class="text-muted small">${escapeHtml(typeLabel)}</div>
                </td>
                <td>${scoreValue !== null ? escapeHtml(scoreValue) : '-'}</td>
                <td>${rankValue !== null ? escapeHtml(rankValue) : '-'}</td>
                <td>${escapeHtml(score.date || '未知日期')}</td>
            `;
            container.appendChild(scoreItem);
        });
    }
    
    // 生成课程下拉选项
    function populateCourseOptions(scores) {
        const selectElement = document.getElementById('score-search');
        
        // 提取所有唯一课程
        const courses = [...new Set(scores.map(score => score.course))].filter(Boolean);
        
        // 清空现有选项（保留第一个"全部课程"选项）
        selectElement.innerHTML = '<option value="">全部课程</option>';
        
        // 添加课程选项
        courses.forEach(courseName => {
            const option = document.createElement('option');
            option.value = courseName;
            option.textContent = courseName;
            selectElement.appendChild(option);
        });
    }
    
    // 搜索作业
    function searchAssignments() {
        const searchTerm = document.getElementById('assignment-search').value.toLowerCase();
        const filteredAssignments = assignments.filter(assignment => 
            assignment.title.toLowerCase().includes(searchTerm) || 
            assignment.course.toLowerCase().includes(searchTerm)
        );
        renderAssignments(filteredAssignments);
    }
    
    // 筛选作业
    function filterAssignments(status) {
        const filteredAssignments = status === 'all' ? 
            assignments : 
            assignments.filter(assignment => assignment.status === status);
        renderAssignments(filteredAssignments);
    }
    
    // 搜索考试
    function searchExams() {
        const searchTerm = document.getElementById('exam-search').value.toLowerCase();
        const filteredExams = exams.filter(exam => 
            exam.title.toLowerCase().includes(searchTerm) || 
            exam.course.toLowerCase().includes(searchTerm)
        );
        renderExams(filteredExams);
    }
    
    // 筛选考试
    function filterExams(status) {
        const filteredExams = status === 'all' ? 
            exams : 
            exams.filter(exam => exam.status === status);
        renderExams(filteredExams);
    }
    
    // 搜索成绩
    function searchScores() {
        const selectedCourse = document.getElementById('score-search').value;
        const filteredScores = selectedCourse ? 
            scores.filter(score => score.course === selectedCourse) : 
            scores;
        renderScores(filteredScores);
    }
    
    // 从API获取作业数据
    async function fetchAssignments() {
        try {
            console.log('=== 开始获取作业数据 ===');
            const apiService = new APIService();
            const studentAPI = new StudentAPI(apiService);
            // 传递分页参数，确保能获取到数据
            console.log('调用 studentAPI.getAssignments({ page: 1, size: 100 })');
            const response = await studentAPI.getAssignments({ page: 1, size: 100 });
            
            console.log('作业API完整响应:', JSON.stringify(response, null, 2));
            console.log('response类型:', typeof response);
            console.log('response.success:', response?.success);
            console.log('response.data:', response?.data);
            
            // 处理API响应，确保数据格式正确
            let assignmentList = [];
            if (response) {
                if (response.success !== false) {
                    // 检查response.data是否存在
                    if (response.data) {
                        if (Array.isArray(response.data)) {
                            console.log('数据是数组格式');
                            assignmentList = response.data;
                        } else if (response.data.content) {
                            console.log('数据是分页格式，content字段存在');
                            assignmentList = response.data.content;
                        } else {
                            console.log('数据格式未知，response.data:', response.data);
                            // 尝试直接使用response.data作为对象
                            if (typeof response.data === 'object' && response.data !== null) {
                                assignmentList = [response.data];
                            }
                        }
                    } else {
                        console.warn('response.data 不存在');
                    }
                } else {
                    console.error('API返回失败:', response.message);
                }
            } else {
                console.error('API响应为null或undefined');
            }
            
            console.log('解析后的作业列表:', assignmentList);
            console.log('作业数量:', assignmentList.length);
            
            // 转换作业数据格式，确保与前端渲染函数兼容
            assignments = assignmentList.map(assignment => {
                // 计算作业状态
                let status = 'pending';
                const now = new Date();
                
                // 安全处理日期
                let dueDate = null;
                if (assignment.dueDate) {
                    try {
                        dueDate = new Date(assignment.dueDate);
                    } catch (e) {
                        console.error('日期解析错误:', e, assignment.dueDate);
                    }
                }
                
                if (assignment.submission) {
                    if (assignment.submission.graded) {
                        status = 'graded';
                    } else {
                        status = 'submitted';
                    }
                } else if (dueDate && dueDate < now) {
                    status = 'closed';
                }
                
                return {
                    id: assignment.id,
                    title: assignment.title,
                    description: assignment.description,
                    course: assignment.courseName || '未知课程',
                    dueDate: dueDate ? dueDate.toLocaleString() : '未知',
                    publishDate: assignment.publishDate ? new Date(assignment.publishDate).toLocaleString() : '未知',
                    status: status,
                    score: assignment.submission ? assignment.submission.score : null,
                    teacherComment: assignment.submission ? assignment.submission.teacherComment : null
                };
            });
            
            console.log('转换后的作业列表:', assignments);
            console.log('=== 作业数据获取完成 ===');
            
            // 确保即使数据为空也调用renderAssignments
            if (!assignments || assignments.length === 0) {
                console.warn('警告：作业列表为空！');
                console.warn('可能的原因：');
                console.warn('1. 后端没有返回数据');
                console.warn('2. 数据格式解析错误');
                console.warn('3. 学生没有分配作业');
            }
            
            renderAssignments(assignments);
        } catch (error) {
            console.error('获取作业数据失败:', error);
            console.error('错误堆栈:', error.stack);
            // 失败时显示错误信息
            const container = document.getElementById('assignment-list');
            if (container) {
                container.innerHTML = '<div class="error-message">获取作业数据失败: ' + error.message + '</div>';
            }
        }
    }
    
    // 从API获取考试数据
    async function fetchExams() {
        try {
            const apiService = new APIService();
            const studentAPI = new StudentAPI(apiService);
            const response = await studentAPI.getExams();
            if (response?.unsupported) {
                exams = [];
                renderExams(exams);
                showMessage(response.message, 'info');
                return;
            }
            
            console.log('考试API响应:', response);
            
            // 处理API响应，确保数据格式正确
            let examList = [];
            if (response && response.success && response.data) {
                if (Array.isArray(response.data)) {
                    examList = response.data;
                } else if (response.data.content) {
                    // 处理分页格式的数据
                    examList = response.data.content;
                } else {
                    examList = [];
                }
            }
            
            // 转换考试数据格式，确保与前端渲染函数兼容
            exams = examList.map(exam => {
                // 计算考试状态
                let status = 'upcoming';
                const now = new Date();
                const startTime = new Date(exam.startTime);
                const endTime = new Date(exam.endTime);
                
                if (exam.submission) {
                    status = exam.submission.graded ? 'graded' : 'submitted';
                } else if (endTime < now) {
                    status = 'completed';
                } else if (startTime <= now && endTime >= now) {
                    status = 'ongoing';
                }
                
                return {
                    id: exam.id,
                    title: exam.title,
                    description: exam.description,
                    course: exam.courseName || '未知课程',
                    examDate: exam.startTime ? new Date(exam.startTime).toLocaleString() : '未知',
                    status: status,
                    score: exam.submission ? exam.submission.score : null,
                    teacherComment: exam.submission ? exam.submission.teacherComment : null,
                    submission: exam.submission || null
                };
            });
            
            renderExams(exams);
        } catch (error) {
            console.error('获取考试数据失败:', error);
            // 失败时显示错误信息
            const container = document.getElementById('exam-list');
            container.innerHTML = '<div class="error-message">获取考试数据失败: ' + error.message + '</div>';
        }
    }
    
    // 从API获取成绩数据
    async function fetchScores() {
        try {
            const apiService = new APIService();
            const studentAPI = new StudentAPI(apiService);
            const response = await studentAPI.getScores();
            if (response?.unsupported) {
                scores = [];
                populateCourseOptions(scores);
                renderScores(scores);
                showMessage(response.message, 'info');
                return;
            }
            
            console.log('成绩API响应:', response);
            
            // 处理API响应，确保数据格式正确
            let scoreList = [];
            if (response && response.success && response.data) {
                if (Array.isArray(response.data)) {
                    scoreList = response.data;
                } else {
                    scoreList = [];
                }
            }
            
            // 转换成绩数据格式，确保与前端渲染函数兼容
            scores = scoreList.map(score => {
                // 优先使用 submitDate（完成时间），如果没有再回退到 examDate / submissionDate / completedAt
                let examDate = score.submitDate || score.examDate || score.submissionDate || score.completedAt;
                let dateStr = '未知日期';
                let timestamp = 0;
                if (examDate) {
                    try {
                        const parsedDate = new Date(examDate);
                        timestamp = Number.isNaN(parsedDate.getTime()) ? 0 : parsedDate.getTime();
                        dateStr = parsedDate.toLocaleDateString();
                    } catch (e) {
                        console.error('日期解析错误:', e, examDate);
                    }
                }
                
                return {
                    course: score.courseName || score.course || '未知课程',
                    exam: score.examName || score.name || score.title || '未知考试',
                    type: score.type || '',
                    typeLabel: score.typeLabel || '',
                    score: score.score ?? null,
                    rank: score.rank ?? null,
                    date: dateStr,
                    timestamp
                };
            }).sort((left, right) => right.timestamp - left.timestamp);
            
            // 生成课程选项
            populateCourseOptions(scores);
            renderScores(scores);
        } catch (error) {
            console.error('获取成绩数据失败:', error);
            // 失败时显示错误信息
            const container = document.getElementById('score-list');
            container.innerHTML = '<tr><td colspan="5" class="text-center">获取成绩数据失败: ' + error.message + '</td></tr>';
        }
    }

                // 验证：至少要有内容或文件
                if (!content.trim() && files.length === 0) {
                    showMessage('请至少填写考试内容或上传文件。', 'warning');
                    return;
                }
                
                try {
                    const apiService = new APIService();
                    const studentAPI = new StudentAPI(apiService);
                    
                    // 构建answers对象，包含文字内容和文件信息
                    const answers = {};
                    
                    // 添加文字内容
                    if (content.trim()) {
                        answers['content'] = content;
                    }
                    
                    // 处理文件：将图片转换为base64，其他文件记录文件名
                    if (files.length > 0) {
                        const filePromises = Array.from(files).map((file, index) => {
                            return new Promise((resolve) => {
                                if (file.type.startsWith('image/')) {
                                    // 图片转换为base64
                                    const reader = new FileReader();
                                    reader.onload = function(e) {
                                        answers[`image_${index}`] = {
                                            name: file.name,
                                            type: file.type,
                                            data: e.target.result // base64编码的图片数据
                                        };
                                        resolve();
                                    };
                                    reader.onerror = function() {
                                        answers[`file_${index}`] = {
                                            name: file.name,
                                            type: file.type,
                                            error: '读取失败'
                                        };
                                        resolve();
                                    };
                                    reader.readAsDataURL(file);
                                } else {
                                    // 非图片文件，记录文件信息（实际应用中可能需要上传到服务器）
                                    answers[`file_${index}`] = {
                                        name: file.name,
                                        type: file.type,
                                        size: file.size,
                                        note: '文件需要单独上传，请联系管理员'
                                    };
                                    resolve();
                                }
                            });
                        });
                        
                        // 等待所有文件处理完成
                        await Promise.all(filePromises);
                    }
                    
                    // 将answers对象转换为字符串格式（因为后端API期望Map<String, String>）
                    const answersString = {};
                    Object.keys(answers).forEach(key => {
                        if (typeof answers[key] === 'object') {
                            answersString[key] = JSON.stringify(answers[key]);
                        } else {
                            answersString[key] = String(answers[key]);
                        }
                    });
                    
                    // 提交考试（使用JSON格式，兼容当前后端API）
                    const response = await apiService.post(`/api/student/exams/${examId}/submit`, {
                        timeTaken: 0,
                        answers: answersString
                    });
                    
                    if (response && (response.success || response.code === 200)) {
                        showMessage('考试提交成功。', 'success');
                        const submitModal = bootstrap.Modal.getInstance(document.getElementById('submitExamModal'));
                        if (submitModal) {
                            submitModal.hide();
                        }
                        syncExamDetailToCache({
                            id: Number(examId),
                            submission: {
                                content: JSON.stringify(answersString),
                                graded: false,
                                score: null,
                                teacherComment: null,
                                submissionDate: new Date().toISOString()
                            }
                        });
                        // 重新获取考试列表
                        fetchExams();
                    } else {
                        const errorMsg = response.message || '提交失败，请稍后重试';
                        showMessage('考试提交失败: ' + errorMsg, 'error');
                        console.error('考试提交失败:', response);
                    }
                } catch (error) {
                    console.error('提交考试失败:', error);
                    showMessage('提交考试失败: ' + (error.message || '服务器内部错误，请联系管理员'), 'error');
                }
            });
        }
    });
    
    // 进入/开始考试
    function startExam(examId) {
        // 这里可以跳转到考试页面或显示考试内容
        showMessage(`考试 ${examId} 可先通过“查看”进入详情，当前页面会保留在考试列表中继续操作。`, 'info');
        // 实际应用中可以跳转到考试页面，如：window.location.href = `student-exam.html?id=${examId}`;
    }
    
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 检查登录状态
        checkLoginStatus();
        if (window.isJwtOnlyStudentSession && window.isJwtOnlyStudentSession()) {
            showMessage('检测到当前为 JWT 微服务登录环境，页面将优先使用已接通的作业、考试和成绩接口。', 'info');
        }
        
        // 初始化侧边栏状态
        setTimeout(initializeSidebar, 100); // 延迟执行，确保侧边栏已经加载
        
        // 侧边栏切换按钮事件监听
        const toggleSidebarBtn = document.getElementById('toggleSidebar');
        if (toggleSidebarBtn) {
            toggleSidebarBtn.addEventListener('click', toggleSidebar);
        }
        
        // 绑定选项卡事件
        bindTabEvents();
        
        // 首屏先只加载默认打开的作业标签，考试和成绩在切换到对应 tab 时按需取数
        fetchAssignments();
    });
</script>
