<body class="teacher-shell-body">
    <!-- 侧边栏导航组件 -->
    <div id="sidebar-container"></div>
    <script>
        // 加载侧边栏组件
        fetch('components/teacher-sidebar-nav.html?v=20260523-1')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                // 确保侧边栏组件完全加载后初始化
                setTimeout(() => {
                    try {
                        if (window.initSidebar) {
                            window.initSidebar();
                        } else {
                            // 尝试直接调用，可能脚本已经内联执行
                            if (typeof initSidebar === 'function') {
                                initSidebar();
                            }
                        }
                    } catch (error) {
                        console.error('初始化侧边栏失败:', error);
                    }
                }, 100);
            })
            .catch(error => console.error('加载侧边栏组件失败:', error));
    </script>

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
        
        // 节流函数
        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

    function buildStudentListSuccess(students, message = '学生列表数据获取成功') {
        return {

            data: Array.isArray(students) ? students : [],

        };

    function dedupeStudentsById(students) {
        return (Array.isArray(students) ? students : []).reduce((acc, student) => {
            if (student && student.id && !acc.find(existingStudent => existingStudent.id === student.id)) {
                acc.push(student);
            }
            return acc;
        }, []);
    }

    async function fetchStudentsByTeacherParams(params = {}) {
        const response = await window.teacherAPI.getStudents(params);
        console.log('调用getStudents返回:', response);

        if (response && response.code === 200) {
            return dedupeStudentsById(response.data || []);
        }

        throw new Error(response?.message || `获取学生列表失败: ${response?.code || '未知错误'}`);
    }

    function intersectStudentsById(primaryStudents, secondaryStudents) {
        const secondaryStudentIds = new Set(
            dedupeStudentsById(secondaryStudents).map(student => student.id)
        );

        return dedupeStudentsById(primaryStudents.filter(student => secondaryStudentIds.has(student.id)));
    }

    async function fetchAllTeacherStudents() {
        console.log('没有班级或课程参数或选择了全部，尝试获取班级列表...');
        const classListResponse = await fetchTeacherClassList();
        console.log('班级列表:', classListResponse);

        if (!(classListResponse.success && classListResponse.data.length > 0)) {
            console.log('没有班级数据，无法获取学生列表');
            return [];
        }

        const classIds = classListResponse.data.map(cls => cls.id);
        console.log('所有班级ID:', classIds);

        const studentPromises = classIds.map(classId => window.teacherAPI.getStudents({ classId }));
        const responses = await Promise.all(studentPromises);
        console.log('所有班级学生响应:', responses);

        const allStudents = [];
        responses.forEach(response => {
            if (response && response.code === 200) {
                const students = response.data || [];
                allStudents.push(...students);
            }
        });

        return dedupeStudentsById(allStudents);
    }

    // 获取学生列表
    async function getStudentList(params = {}) {
        try {
            if (!window.teacherAPI) {
                console.error('teacherAPI未初始化');
                return buildStudentListSuccess([], 'teacherAPI未初始化');
            }

            const hasSelectedClass = params.classId && params.classId !== 'all';
            const hasSelectedCourse = params.courseId && params.courseId !== 'all';

            if (hasSelectedClass && hasSelectedCourse) {
                const classStudents = await fetchStudentsByTeacherParams({ classId: params.classId });
                const courseStudents = await fetchStudentsByTeacherParams({ courseId: params.courseId });
                const filteredStudents = intersectStudentsById(courseStudents, classStudents);
                console.log('班级与课程交集后的学生列表:', filteredStudents);
                return buildStudentListSuccess(filteredStudents, '学生列表数据获取成功');
            }

            if (hasSelectedClass || hasSelectedCourse) {
                const students = await fetchStudentsByTeacherParams(params);
                console.log('最终学生列表:', students);
                return buildStudentListSuccess(students, '学生列表数据获取成功');
            }

            const allStudents = await fetchAllTeacherStudents();
            console.log('合并并去重后的学生列表:', allStudents);
            return buildStudentListSuccess(allStudents, '获取所有班级学生列表成功');
        } catch (error) {
            console.error('获取学生列表失败:', error);
            return buildStudentListSuccess([], `获取学生列表失败: ${error.message}`);
        }
    }

    function getApiStatusCode(responseOrError) {
        if (typeof responseOrError?.code === 'number') {
            return responseOrError.code;
        }
        if (typeof responseOrError?.status === 'number') {
            return responseOrError.status;
        }
        if (typeof responseOrError?.raw?.code === 'number') {
            return responseOrError.raw.code;
        }
        if (typeof responseOrError?.response?.status === 'number') {
            return responseOrError.response.status;
        }
        return null;
    }

            if (result && result.code === 200 && result.data) {
                // 直接使用后端返回的真实数据
                formattedData = result.data;

                if (!formattedData.knowledgePointDistribution) {

                }

    function normalizeKnowledgeDistributionEntry(point, fallbackOrderIndex) {
        const knowledgePointId = point.knowledgePointId ?? point.id;
        const knowledgePointName = point.knowledgePointName || point.pointName || point.name || `知识点 ${knowledgePointId}`;
        const masteryRate = typeof point.masteryRate === 'number' ? point.masteryRate : 0;
        const orderIndex = typeof point.orderIndex === 'number'
            ? point.orderIndex
            : Number.parseInt(point.orderIndex, 10) || fallbackOrderIndex;
        return {
            knowledgePointId,
            knowledgePointName,
            masteryRate,
            difficulty: point.difficulty || '未知',
            orderIndex
        };
    }

    async function mergeKnowledgeAnalysisWithPointList(analysisData, filters) {
        if (!analysisData) {
            return analysisData;
        }

        const rawPointList = await fetchKnowledgePointList();
        if (!rawPointList.success || !Array.isArray(rawPointList.data)) {
            return analysisData;
        }

        const selectedCourseId = filters.courseId && filters.courseId !== 'all'
            ? Number.parseInt(filters.courseId, 10)
            : null;
        const selectedKnowledgePointId = filters.knowledgePoint && filters.knowledgePoint !== 'all'
            ? Number.parseInt(filters.knowledgePoint, 10)
            : null;
        const distribution = Array.isArray(analysisData.knowledgePointDistribution)
            ? analysisData.knowledgePointDistribution.map((point, index) => normalizeKnowledgeDistributionEntry(point, index + 1))
            : [];
        const seenIds = new Set(distribution.map(point => point.knowledgePointId));

        rawPointList.data
            .filter(point => selectedCourseId === null || point.courseId === selectedCourseId)
            .filter(point => selectedKnowledgePointId === null || point.id === selectedKnowledgePointId)
            .forEach(point => {
                if (seenIds.has(point.id)) {
                    return;
                }
                distribution.push(normalizeKnowledgeDistributionEntry(point, distribution.length + 1));
            });

        distribution.sort((left, right) => {
            if (left.orderIndex !== right.orderIndex) {
                return left.orderIndex - right.orderIndex;
            }
            return left.knowledgePointId - right.knowledgePointId;
        });
        distribution.forEach((point, index) => {
            point.orderIndex = typeof point.orderIndex === 'number' ? point.orderIndex : index + 1;
        });

        const distributionIds = new Set(distribution.map(point => point.knowledgePointId));
        const excellentStudentAverage = Array.isArray(analysisData.excellentStudentAverage)
            ? analysisData.excellentStudentAverage.slice(0, distribution.length)
            : [];
        while (excellentStudentAverage.length < distribution.length) {
            excellentStudentAverage.push(0.0);
        }

        return {
            ...analysisData,
            knowledgePointDistribution: distribution,
            weakTopics: distribution
                .filter(point => point.masteryRate < 60)
                .map(point => {
                    const existingWeakTopic = Array.isArray(analysisData.weakTopics)
                        ? analysisData.weakTopics.find(topic => topic.knowledgePointId === point.knowledgePointId)
                        : null;
                    return existingWeakTopic || {
                        knowledgePointId: point.knowledgePointId,
                        knowledgePointName: point.knowledgePointName,
                        averageMastery: point.masteryRate,
                        studentCount: 0,
                        difficulty: point.difficulty
                    };
                }),
            atRiskStudents: Array.isArray(analysisData.atRiskStudents)
                ? analysisData.atRiskStudents.map(student => ({
                    ...student,
                    weakKnowledgePoints: Array.isArray(student.weakKnowledgePoints)
                        ? student.weakKnowledgePoints.filter(point => distributionIds.has(point.knowledgePointId))
                        : []
                }))
                : [],
            excellentStudentAverage
        };
    }

            updateKnowledgeRadarChart({
                knowledgePointDistribution: [],
                excellentStudentAverage: []
            });
            updateKnowledgeList({
                atRiskStudents: []
            });
            updatePaginationInfo({});
            showError(error.message || '获取数据失败，请稍后重试');
        } finally {
            // 确保加载状态被隐藏
            hideLoading();
        }
    }

    function initEmptyState() {

    // 更新统计卡片数据
    function updateStatsCards(data) {
        // 确保数据存在且格式正确
        if (!data) {
            return;
        }
        
        const knowledgePoints = data.knowledgePointDistribution || [];
        const atRiskStudents = data.atRiskStudents || [];
        
        // 计算总知识点数
        const totalKnowledgePoints = knowledgePoints.length;
        
        // 计算薄弱知识点数（掌握率<60%）
        const weakKnowledgePoints = knowledgePoints.filter(point => {
            const rate = typeof point.masteryRate === 'number' ? point.masteryRate : 0;
            return rate < 60;
        }).length;
        
        // 计算平均掌握程度
        const totalMasteryRate = knowledgePoints.reduce((sum, point) => {
            const rate = typeof point.masteryRate === 'number' ? point.masteryRate : 0;
            return sum + rate;
        }, 0);
        const averageMasteryLevel = totalKnowledgePoints > 0 ? Math.round((totalMasteryRate / totalKnowledgePoints) * 10) / 10 : 0;
        
        // 待改进学生数
        const studentsNeedingImprovement = atRiskStudents.length;
        
        // 更新总知识点数
        document.querySelector('.stats-cards .stat-card:nth-child(1) .stat-card-value').textContent = totalKnowledgePoints;
        
        // 更新薄弱知识点数
        document.querySelector('.stats-cards .stat-card:nth-child(2) .stat-card-value').textContent = weakKnowledgePoints;
        
        // 更新平均掌握程度
        document.querySelector('.stats-cards .stat-card:nth-child(3) .stat-card-value').textContent = `${averageMasteryLevel}%`;
        
        // 更新待改进学生数
        document.querySelector('.stats-cards .stat-card:nth-child(4) .stat-card-value').textContent = studentsNeedingImprovement;
    }
    
    // 更新知识点掌握程度分布图表
    function updateKnowledgeDistributionChart(data) {
        if (!knowledgeDistributionChart || !data) {
            return;
        }
        
        const knowledgePoints = data.knowledgePointDistribution || [];
        
        // 计算不同掌握程度区间的知识点数量
        const excellentCount = knowledgePoints.filter(point => {
            const rate = typeof point.masteryRate === 'number' ? point.masteryRate : 0;
            return rate >= 85;
        }).length;
        const goodCount = knowledgePoints.filter(point => {
            const rate = typeof point.masteryRate === 'number' ? point.masteryRate : 0;
            return rate >= 70 && rate < 85;
        }).length;
        const averageCount = knowledgePoints.filter(point => {
            const rate = typeof point.masteryRate === 'number' ? point.masteryRate : 0;
            return rate >= 60 && rate < 70;
        }).length;
        const poorCount = knowledgePoints.filter(point => {
            const rate = typeof point.masteryRate === 'number' ? point.masteryRate : 0;
            return rate < 60;
        }).length;
        
        // 更新图表数据
        knowledgeDistributionChart.data.datasets[0].data = [
            excellentCount,
            goodCount,
            averageCount,
            poorCount
        ];
        
        knowledgeDistributionChart.update();
    }
    
    // 更新知识点掌握程度雷达图
    function updateKnowledgeRadarChart(data) {
        if (!knowledgeRadarChart || !data) {
            return;
        }
        
        const knowledgePoints = data.knowledgePointDistribution || [];
        
        // 提取知识点名称作为雷达图标签
        const knowledgePointNames = knowledgePoints.map(point => point.knowledgePointName || '未知');
        
        // 提取掌握率作为班级平均掌握程度数据
        const classAverageMastery = knowledgePoints.map(point => {
            const rate = typeof point.masteryRate === 'number' ? point.masteryRate : 0;
            return Math.round(rate);
        });
        
        // 更新雷达图数据
        knowledgeRadarChart.data.labels = knowledgePointNames.length > 0 ? knowledgePointNames : ['暂无数据'];
        knowledgeRadarChart.data.datasets[0].data = classAverageMastery.length > 0 ? classAverageMastery : [0];
        
        // 检查是否有优秀学生平均数据，如果没有则移除第二个数据集
        if (data.excellentStudentAverage && data.excellentStudentAverage.length > 0) {
            if (knowledgeRadarChart.data.datasets.length < 2) {
                knowledgeRadarChart.data.datasets.push({
                    label: '优秀学生平均',
                    data: data.excellentStudentAverage,
                    backgroundColor: 'rgba(25, 135, 84, 0.2)',
                    borderColor: 'rgba(25, 135, 84, 1)',
                    pointBackgroundColor: 'rgba(25, 135, 84, 1)',
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: 'rgba(25, 135, 84, 1)'
                });
            } else {
                knowledgeRadarChart.data.datasets[1].data = data.excellentStudentAverage;
            }
        } else {
            // 如果没有优秀学生数据，只保留第一个数据集
            if (knowledgeRadarChart.data.datasets.length > 1) {
                knowledgeRadarChart.data.datasets = [knowledgeRadarChart.data.datasets[0]];
            }
        }
        
        // 更新图表
        knowledgeRadarChart.update();
    }
    
    // 更新知识点列表
    function updateKnowledgeList(knowledgeData) {
        const knowledgeList = document.querySelector('.knowledge-list');
        knowledgeList.innerHTML = '';
        
        // 确保数据存在且格式正确
        if (!knowledgeData || !knowledgeData.knowledgePointDistribution) {
            knowledgeList.innerHTML = '<p class="text-center text-muted py-4">暂无知识点数据</p>';
            return;
        }
        
        const knowledgePoints = knowledgeData.knowledgePointDistribution;
        
        if (knowledgePoints.length === 0) {
            knowledgeList.innerHTML = '<p class="text-center text-muted py-4">暂无知识点数据</p>';
            return;
        }
        
        // 计算当前页需要显示的数据范围
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, knowledgePoints.length);
        const currentPageData = knowledgePoints.slice(startIndex, endIndex);
        
        // 渲染当前页的数据
        currentPageData.forEach(point => {
            const card = createKnowledgeCard(point, knowledgeData);
            knowledgeList.appendChild(card);
        });
    }
    
    // 创建知识点卡片
    function createKnowledgeCard(point, knowledgeData) {
        const card = document.createElement('div');
        card.className = 'knowledge-card';
        
        // 确保 masteryRate 是数字
        const masteryRate = typeof point.masteryRate === 'number' ? Math.round(point.masteryRate * 10) / 10 : 0;
        
        // 根据掌握程度确定等级和颜色
        const levelInfo = getLevelInfo(masteryRate);
        
        // 获取待改进学生数
        const atRiskStudentCount = getAtRiskStudentsCount(point, knowledgeData);
        
        // 设置卡片内容
        card.innerHTML = `
            <div class="knowledge-card-header">
                <h5 class="knowledge-card-title">${point.knowledgePointName}</h5>
                <span class="knowledge-card-level level-${levelInfo.level}">${levelInfo.levelText}</span>
            </div>
            <div class="progress">
                <div class="progress-bar bg-${levelInfo.color}" role="progressbar" style="width: ${masteryRate}%" aria-valuenow="${masteryRate}" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <div class="row">
                <div class="col-md-3">
                    <p><strong>掌握程度：</strong>${masteryRate}%</p>
                    <div class="rating">${getRatingStars(masteryRate)}</div>
                </div>
                <div class="col-md-3">
                    <p><strong>难度级别：</strong>${point.difficulty || '未知'}</p>
                    <p><strong>排序索引：</strong>${point.orderIndex || 0}</p>
                </div>
                <div class="col-md-3">
                    <p><strong>待改进学生：</strong>${atRiskStudentCount}人</p>
                </div>
                <div class="col-md-3 text-right">
                    <button class="btn btn-sm btn-primary" onclick="viewKnowledgeDetail('${point.knowledgePointId}')">查看详情</button>
                    <button class="btn btn-sm btn-warning" onclick="editKnowledge('${point.knowledgePointId}')">编辑</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteKnowledge('${point.knowledgePointId}')">删除</button>
                </div>
            </div>
        `;
        
        return card;
    }
    
    // 获取待改进学生数
    function getAtRiskStudentsCount(knowledgePoint, knowledgeData) {
        if (!knowledgeData || !knowledgeData.atRiskStudents) {
            return 0;
        }
        
        let count = 0;
        knowledgeData.atRiskStudents.forEach(student => {
            if (student.weakKnowledgePoints) {
                const hasWeakPoint = student.weakKnowledgePoints.some(point => 
                    point.knowledgePointId === knowledgePoint.knowledgePointId
                );
                if (hasWeakPoint) {
                    count++;
                }
            }
        });
        
        return count;
    }
    
    // 根据掌握程度获取等级信息
    function getLevelInfo(masteryLevel) {
        // 确保 masteryLevel 是数字，如果是 undefined 或 null 则默认为 0
        const level = typeof masteryLevel === 'number' ? masteryLevel : 0;
        
        if (level >= 85) {
            return { level: 'excellent', levelText: '优秀', color: 'success' };
        } else if (level >= 70) {
            return { level: 'good', levelText: '良好', color: 'primary' };
        } else if (level >= 60) {
            return { level: 'average', levelText: '一般', color: 'warning' };
        } else {
            return { level: 'poor', levelText: '较差', color: 'danger' };
        }
    }
    
    // 根据掌握程度生成评分星星
    function getRatingStars(masteryLevel) {
        const stars = [];
        const starCount = Math.round(masteryLevel / 20);
        
        for (let i = 0; i < 5; i++) {
            if (i < starCount) {
                stars.push('<i class="fa fa-star"></i>');
            } else {
                stars.push('<i class="fa fa-star-o"></i>');
            }
        }
        
        return stars.join('');
    }

    // 更新分页信息
    function updatePaginationInfo(data) {
        // 计算总页数和总记录数
        const knowledgePoints = data.knowledgePointDistribution || [];
        totalKnowledgePoints = knowledgePoints.length;
        totalPages = Math.ceil(totalKnowledgePoints / pageSize);

    // 渲染分页控件
    function renderPagination() {
        const paginationContainer = document.getElementById('knowledge-pagination');
        paginationContainer.innerHTML = '';
        
        // 创建上一页按钮
        const prevItem = document.createElement('li');
        prevItem.className = 'page-item';
        prevItem.innerHTML = `<a class="page-link" data-page="prev" href="javascript:void(0);">上一页</a>`;
        prevItem.querySelector('.page-link').disabled = currentPage === 1;
        paginationContainer.appendChild(prevItem);
        
        // 创建页码按钮
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(totalPages, startPage + 4);
        
        // 添加首页按钮
        if (startPage > 1) {
            const firstItem = document.createElement('li');
            firstItem.className = 'page-item';
            firstItem.innerHTML = `<a class="page-link" data-page="1" href="javascript:void(0);">1</a>`;
            paginationContainer.appendChild(firstItem);
            
            if (startPage > 2) {
                const ellipsisItem = document.createElement('li');
                ellipsisItem.className = 'page-item disabled';
                ellipsisItem.innerHTML = `<a class="page-link" href="javascript:void(0);">...</a>`;
                paginationContainer.appendChild(ellipsisItem);
            }
        }
        
        // 添加中间页码
        for (let i = startPage; i <= endPage; i++) {
            const pageItem = document.createElement('li');
            pageItem.className = `page-item ${currentPage === i ? 'active' : ''}`;
            pageItem.innerHTML = `<a class="page-link" data-page="${i}" href="javascript:void(0);">${i}</a>`;
            paginationContainer.appendChild(pageItem);
        }
        
        // 添加末页按钮
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                const ellipsisItem = document.createElement('li');
                ellipsisItem.className = 'page-item disabled';
                ellipsisItem.innerHTML = `<a class="page-link" href="javascript:void(0);">...</a>`;
                paginationContainer.appendChild(ellipsisItem);
            }
            
            const lastItem = document.createElement('li');
            lastItem.className = 'page-item';
            lastItem.innerHTML = `<a class="page-link" data-page="${totalPages}" href="javascript:void(0);">${totalPages}</a>`;
            paginationContainer.appendChild(lastItem);
        }
        
        // 创建下一页按钮
        const nextItem = document.createElement('li');
        nextItem.className = 'page-item';
        nextItem.innerHTML = `<a class="page-link" data-page="next" href="javascript:void(0);">下一页</a>`;
        nextItem.querySelector('.page-link').disabled = currentPage === totalPages;
        paginationContainer.appendChild(nextItem);
    }

    function initPagination() {
        const paginationContainer = document.getElementById('knowledge-pagination');
        
        paginationContainer.addEventListener('click', function(e) {
            const target = e.target.closest('.page-link');
            if (target) {
                const pageAction = target.getAttribute('data-page');
                
                if (pageAction === 'prev') {
                    if (currentPage > 1) {
                        currentPage--;
                        handleQuery(currentPage);
                    }
                } else if (pageAction === 'next') {
                    if (currentPage < totalPages) {
                        currentPage++;
                        handleQuery(currentPage);
                    }
                } else {
                    const pageNumber = parseInt(pageAction);
                    if (!isNaN(pageNumber) && pageNumber !== currentPage) {
                        currentPage = pageNumber;
                        handleQuery(currentPage);
                    }
                }
            }
        });
    }

    async function initializeTeacherKnowledgePage() {
        const hasAccess = await ensureTeacherKnowledgeAccess();
        if (!hasAccess) {
            return;
        }

        initializeTeacherKnowledgeChrome();
        await loadUserDropdownForTeacher('userDropdownContainer');
        initializeKnowledgeManagementControls();
        initializeKnowledgeAnalysisCharts();
        initializeKnowledgeFilterControls();
        initializeKnowledgeTableActions();
        await populateKnowledgeCourseOptions();
        initImageErrorHandling();
        initPagination();
        await loadInitialData();
    }

    document.addEventListener('DOMContentLoaded', initializeTeacherKnowledgePage);
    </script>
</body>
</html>
