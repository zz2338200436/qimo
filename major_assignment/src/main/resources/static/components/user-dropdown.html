<!-- 用户下拉菜单组件 -->
<!-- Font Awesome CDN - 使用v5+版本 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

<style>
    /* 用户下拉菜单容器 */
    .user-dropdown-container {
        position: relative;
        display: inline-block;
    }

    /* 用户信息按钮 */
    .user-dropdown-btn {
        background: none;
        border: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        color: #334155;
        font-family: inherit;
    }

    .user-dropdown-btn:hover {
        background-color: #f1f5f9;
    }

    .user-dropdown-btn:focus {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
    }

    /* 用户头像 - 默认学生端蓝色主题 */
    .user-dropdown-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 600;
        font-size: 16px;
    }

    /* 用户信息 */
    .user-dropdown-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .user-dropdown-name {
        font-size: 14px;
        font-weight: 600;
        color: #334155;
    }

    .user-dropdown-role {
        font-size: 12px;
        color: #64748b;
    }

    /* 下拉箭头 */
    .user-dropdown-arrow {
        font-size: 12px;
        color: #64748b;
        transition: transform 0.3s ease;
    }

    /* 下拉菜单 */
    .user-dropdown-menu {
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 8px;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border: 1px solid #e2e8f0;
        min-width: 200px;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
    }

    /* 下拉菜单显示状态 */
    .user-dropdown-container.open .user-dropdown-menu {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }

    /* 下拉菜单显示时的箭头旋转 */
    .user-dropdown-container.open .user-dropdown-arrow {
        transform: rotate(180deg);
    }

    /* 菜单项 */
    .user-dropdown-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        font-size: 14px;
        color: #334155;
        text-decoration: none;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        font-family: inherit;
    }

    .user-dropdown-item:hover {
        background-color: #f1f5f9;
    }

    .user-dropdown-item i {
        width: 16px;
        text-align: center;
        color: #64748b;
    }

    /* 分隔线 */
    .user-dropdown-divider {
        height: 1px;
        background-color: #e2e8f0;
        margin: 4px 0;
    }

    /* 退出登录菜单项 */
    .user-dropdown-item.logout {
        color: #ef4444;
    }
 
    .user-dropdown-item.logout:hover {
        background-color: #fee2e2;
    }
 
    .user-dropdown-item.logout i {
        color: #ef4444;
    }

    /* 教师端紫色主题：通过在容器上添加 teacher-theme 类启用 */
    .user-dropdown-container.teacher-theme .user-dropdown-avatar {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .user-dropdown-container.teacher-theme .user-dropdown-name {
        color: #4c1d95;
    }

    .user-dropdown-container.teacher-theme .user-dropdown-role,
    .user-dropdown-container.teacher-theme .user-dropdown-arrow {
        color: #7c3aed;
    }

    .user-dropdown-container.teacher-theme .user-dropdown-btn:hover {
        background-color: #f3e8ff;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
        .user-dropdown-info {
            display: none;
        }

        .user-dropdown-btn {
            padding: 8px;
        }

        .user-dropdown-menu {
            min-width: 180px;
            right: -12px;
        }
    }

    /* 防抖动和点击反馈 */
    .user-dropdown-btn:active {
        transform: scale(0.98);
    }
</style>

<!-- 用户下拉菜单HTML结构 -->
<div class="user-dropdown-container" id="userDropdown">
    <button class="user-dropdown-btn" id="userDropdownBtn" aria-haspopup="true" aria-expanded="false">
        <!-- [DYNAMIC_USER_AVATAR]_[API:GET_USER_INFO]_[用户头像] -->
        <div class="user-dropdown-avatar" id="userDropdownAvatar"></div>
        <div class="user-dropdown-info">
            <!-- [DYNAMIC_USER_NAME]_[API:GET_USER_INFO]_[用户名] -->
            <div class="user-dropdown-name" id="userDropdownName"></div>
            <!-- [DYNAMIC_USER_ROLE]_[API:GET_USER_INFO]_[用户角色] -->
            <div class="user-dropdown-role"></div>
        </div>
        <i class="fas fa-chevron-down user-dropdown-arrow"></i>
    </button>

    <div class="user-dropdown-menu" id="userDropdownMenu" aria-labelledby="userDropdownBtn">
        <!-- 预留位置，便于后续添加更多功能 -->
        <!-- <a href="#" class="user-dropdown-item">
            <i class="fas fa-user"></i>
            <span>个人资料</span>
        </a>
        <a href="#" class="user-dropdown-item">
            <i class="fas fa-cog"></i>
            <span>账号设置</span>
        </a>
        <div class="user-dropdown-divider"></div> -->
        <button class="user-dropdown-item logout" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i>
            <span>退出登录</span>
        </button>
    </div>
</div>

<script>
    // 用户下拉菜单组件类
    class UserDropdown {
        /**
         * @param {string} [containerId]  预留参数，便于未来在不同容器中复用
         * @param {string} [userType]     预留参数，区分 student / teacher 等角色
         */
        constructor(containerId, userType) {
            // 目前组件内部仍然使用固定ID，保持与现有页面兼容
            this.container = document.getElementById('userDropdown');
            this.button = document.getElementById('userDropdownBtn');
            this.menu = document.getElementById('userDropdownMenu');
            this.logoutBtn = document.getElementById('logoutBtn');
            this.isOpen = false;
            this.debounceTimer = null;
            this.userType = userType || null;
            
            this.init();
        }

        // 初始化组件
        init() {
            this.bindEvents();
            this.loadUserInfo();
        }

        // 绑定事件
        bindEvents() {
            // 点击按钮切换菜单
            this.button.addEventListener('click', (e) => {
                e.stopPropagation();
                this.toggleMenu();
            });

            // 点击菜单项
            this.menu.addEventListener('click', (e) => {
                e.stopPropagation();
                this.handleMenuItemClick(e.target.closest('.user-dropdown-item'));
            });

            // 点击外部关闭菜单
            document.addEventListener('click', () => {
                this.closeMenu();
            });

            // 键盘事件
            this.button.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    this.closeMenu();
                } else if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.toggleMenu();
                }
            });
        }

        // 防抖动切换菜单
        toggleMenu() {
            // 清除之前的定时器
            if (this.debounceTimer) {
                clearTimeout(this.debounceTimer);
            }

            // 设置新的定时器
            this.debounceTimer = setTimeout(() => {
                this.isOpen = !this.isOpen;
                this.updateMenuState();
            }, 50); // 50ms防抖动延迟
        }

        // 打开菜单
        openMenu() {
            this.isOpen = true;
            this.updateMenuState();
        }

        // 关闭菜单
        closeMenu() {
            this.isOpen = false;
            this.updateMenuState();
        }

        // 更新菜单状态
        updateMenuState() {
            if (this.isOpen) {
                this.container.classList.add('open');
                this.button.setAttribute('aria-expanded', 'true');
            } else {
                this.container.classList.remove('open');
                this.button.setAttribute('aria-expanded', 'false');
            }
        }

        // 处理菜单项点击
        handleMenuItemClick(item) {
            if (!item) return;

            if (item.id === 'logoutBtn') {
                this.handleLogout();
            } else {
                // 预留处理其他菜单项的逻辑
                const href = item.getAttribute('href');
                if (href && href !== '#') {
                    window.location.href = href;
                }
            }

            this.closeMenu();
        }

        // 处理退出登录
        async handleLogout() {
            try {
                // 在清除本地存储前，先读取用户角色信息，用于决定跳转页面
                const userJson = sessionStorage.getItem('user');
                let loginPage = 'student-login.html';

                if (userJson) {
                    try {
                        const user = JSON.parse(userJson);
                        if (Array.isArray(user.roles)) {
                            // 教师端跳转教师登录页
                            if (user.roles.includes('TEACHER')) {
                                loginPage = 'teacher-login.html';
                            } else if (user.roles.includes('STUDENT')) {
                                // 学生端跳转学生登录页
                                loginPage = 'student-login.html';
                            }
                        }
                    } catch (e) {
                        console.error('解析用户信息失败，使用默认登录页:', e);
                    }
                }

                // 清除本地存储的用户信息和token（使用sessionStorage，每个标签页独立）
                sessionStorage.removeItem('user');
                sessionStorage.removeItem('token');
                sessionStorage.removeItem('userId');
                
                // 重定向到对应的登录页面
                window.location.href = loginPage;
            } catch (error) {
                console.error('退出登录失败:', error);
                alert('退出登录失败，请稍后重试');
            }
        }

        // 加载用户信息
        loadUserInfo() {
            try {
                // 从本地存储获取用户信息（使用sessionStorage，每个标签页独立）
                const userJson = sessionStorage.getItem('user');
                if (userJson) {
                    const user = JSON.parse(userJson);
                    
                    // 更新用户名
                    const nameElement = document.getElementById('userDropdownName');
                    if (nameElement) {
                        nameElement.textContent = user.name || user.username || '用户';
                    }

                    // 更新头像
                    const avatarElement = document.getElementById('userDropdownAvatar');
                    if (avatarElement) {
                        const displayName = user.name || user.username || '';
                        avatarElement.textContent = displayName
                            ? displayName.charAt(0).toUpperCase()
                            : 'U';
                    }

                    // 更新角色显示
                    const roleElement = document.querySelector('.user-dropdown-role');
                    if (roleElement) {
                        let roleText = '用户';
                        let isTeacherSide = false;
                        if (Array.isArray(user.roles)) {
                            if (user.roles.includes('TEACHER')) {
                                roleText = '课程教师';
                                isTeacherSide = true;
                            } else if (user.roles.includes('STUDENT')) {
                                roleText = '学生用户';
                            }
                        }
                        roleElement.textContent = roleText;

                        // 根据角色为教师端添加紫色主题
                        if (isTeacherSide && this.container) {
                            this.container.classList.add('teacher-theme');
                        }
                    }
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
        }

        // 更新用户信息（外部调用）
        updateUserInfo(userData) {
            if (userData) {
                // 更新本地存储（使用sessionStorage，每个标签页独立）
                sessionStorage.setItem('user', JSON.stringify(userData));
                
                // 更新界面
                this.loadUserInfo();
            }
        }
    }

    // 暴露UserDropdown类给全局作用域
    window.UserDropdown = UserDropdown;
</script>
