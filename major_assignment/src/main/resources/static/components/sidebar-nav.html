<!-- 侧边栏导航组件 -->
<style>
    /* 侧边栏样式统一 */
    .sidebar {
        width: 280px;
        height: 100vh;
        background: linear-gradient(180deg, #0f766e 0%, #0d9488 62%, #14b8a6 100%);
        color: white;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        overflow-y: auto;
        transition: width 0.3s ease;
        box-shadow: 0 18px 40px rgba(13, 148, 136, 0.16);
    }

    .sidebar.desktop-collapsed {
        width: 80px;
    }

    .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .sidebar-logo i {
        font-size: 28px;
    }

    .sidebar-logo span {
        font-size: 18px;
        font-weight: 700;
    }

    .sidebar-menu {
        padding: 20px 0;
    }

    .menu-item {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        transition: all 0.3s ease;
        border-left: 3px solid transparent;
        font-size: 16px;
        line-height: 1;
        font-family: 'Inter', sans-serif;
        margin: 0;
    }

    .menu-item:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
            border-left-color: #ccfbf1;
    }

    .menu-item.active {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border-left-color: #ccfbf1;
    }

    .menu-item i {
        width: 30px;
        margin-right: 10px;
        text-align: center;
        font-size: 1.2rem;
    }

    /* 折叠状态样式 */
    .sidebar.desktop-collapsed .sidebar-logo span {
        display: none;
    }

    .sidebar.desktop-collapsed .menu-item span {
        display: none;
    }

    .sidebar.desktop-collapsed .menu-item i {
        margin-right: 0;
    }

    /* 主内容区样式 */
    .main-content {
        margin-left: 280px;
        transition: margin-left 0.3s ease;
    }

    .main-content.collapsed {
        margin-left: 80px;
    }

    .sidebar-overlay {
        display: none;
    }

    /* 响应式布局 - 移动端优化 */
    @media (max-width: 768px) {
        .sidebar {
            transform: translateX(-280px);
        }
        
        .sidebar.mobile-open {
            transform: translateX(0);
            width: 280px;
        }
        
        .main-content {
            margin-left: 0;
        }
        
        .main-content.collapsed {
            margin-left: 0;
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            border: 0;
            background: rgba(15, 23, 42, 0.36);
            display: block;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    }
</style>

<!-- 侧边栏导航HTML结构 -->

<script>
    // 高亮当前导航项
    function highlightActiveNavItem() {
        try {
            const currentPath = window.location.pathname;
            const navItems = document.querySelectorAll('.menu-item');
            
            navItems.forEach(item => {
                const href = item.getAttribute('href');
                if (currentPath.endsWith(href)) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        } catch (error) {
            console.error('Error highlighting active nav item:', error);
        }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        highlightActiveNavItem();
        if (window.CommonUI) {
            window.CommonUI.bindSidebarDismissHandlers();
            window.CommonUI.initializeSidebar();
        }
    });
</script>
