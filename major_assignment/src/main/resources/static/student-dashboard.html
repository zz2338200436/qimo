<!-- JavaScript代码 -->
<script>
    // 高亮当前导航项
    function highlightActiveNavItem() {
        CommonUI.highlightActiveNavItem({ selector: '.sidebar .menu-item, .menu-item' });
    }
    
    // 侧边栏折叠/展开功能
    function toggleSidebar() {
        return CommonUI.toggleSidebar();
    }
    
    // 初始化侧边栏状态
    function initializeSidebar() {
        CommonUI.initializeSidebar();
    }
    
    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
        if (!checkLoginStatus()) {
            return;
        }
        if (window.loadFrontendCapabilities) {
            window.loadFrontendCapabilities();
        }
        if (window.isJwtOnlyStudentSession && window.isJwtOnlyStudentSession()) {
            showMessage('检测到当前为 JWT 微服务登录环境，学生仪表盘将优先加载已接通的微服务数据。', 'info');
        }
        // 移除原来的loadSidebar函数调用，因为我们已经在页面顶部使用jQuery加载了侧边栏
        getDashboardData();
        
        // 初始化侧边栏状态
        setTimeout(initializeSidebar, 100); // 延迟执行，兜底等待侧边栏加载完成
        
        // 侧边栏切换按钮事件监听
        const toggleSidebarBtn = document.getElementById('toggleSidebar');
        if (toggleSidebarBtn) {
            toggleSidebarBtn.addEventListener('click', toggleSidebar);
        }
        
        // 添加定时刷新机制，每10分钟更新一次数据
        setInterval(getDashboardData, 10 * 60 * 1000);
        
        // 添加页面可见性变化监听，当页面重新可见时刷新数据
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                getDashboardData();
            }
        });
    });

    function showMessage(text, type = 'info') {
        CommonUI.showMessage(text, type, { dismissible: false, duration: 3500 });
    }

    // 检查登录状态
    function checkLoginStatus() {
        if (!CommonUI.requireStudentSession({ redirectUrl: 'student-login.html' })) {
            return false;
        }

        // 加载用户下拉菜单组件
        CommonUI.loadUserDropdown('userDropdownContainer', 'student')
            .then(() => {
                const menuItems = document.querySelectorAll('.sidebar .menu-item');
                menuItems.forEach(item => item.classList.remove('active'));
                const dashboardItem = document.getElementById('nav-dashboard');
                if (dashboardItem) {
                    dashboardItem.classList.add('active');
                }
                initializeSidebar();
            })
            .catch(error => {
                console.error('加载用户下拉组件失败:', error);
            });
        return true;
    }

    // 计算本周学习时间分布
    async function calculateStudyTime() {
        // 从API获取学习时间分布数据
        const apiService = new APIService();
        const studentAPI = new StudentAPI(apiService);
        try {
            const studyTimeData = await studentAPI.getStudyTimeDistribution();
            if (studyTimeData && studyTimeData.success && studyTimeData.data && Array.isArray(studyTimeData.data)) {
                // 从API返回的数据中提取学习时间数组
                // 确保数据按照顺序排列（从过去到现在）
                const studyTimes = studyTimeData.data
                    .sort((a, b) => new Date(a.date) - new Date(b.date))
                    .map(item => parseFloat(item.study_time) || 0);
                return studyTimes;
            }
        } catch (error) {
            console.error('获取学习时间分布失败:', error);
        }
        // 返回空数组，让图表显示没有数据的状态
        return [];
    }

    // 将原始学习时间数据规范化为周一至周日的数组
    function transformStudyTimeData(rawData) {
        const weekData = new Array(7).fill(0);
        if (!Array.isArray(rawData)) {
            return weekData;
        }
        const dayNameMap = {
            Monday: 0,
            Tuesday: 1,
            Wednesday: 2,
            Thursday: 3,
            Friday: 4,
            Saturday: 5,
            Sunday: 6
        };

        rawData.forEach((item, index) => {
            // 兼容数据库返回的各种命名风格（study_time / STUDY_TIME / studyTime 等）
            let normalized = {};
            if (item && typeof item === 'object') {
                Object.keys(item).forEach(key => {
                    normalized[key] = item[key];
                    normalized[key.toLowerCase()] = item[key];
                });
            } else {
                normalized = item;
            }

            let value = 0;
            let targetIndex = index % 7;

            if (typeof item === 'number') {
                value = item;
            } else if (item) {
                value = parseFloat(
                    normalized.study_time ??
                    normalized['study_time'] ??
                    normalized.studytime ??
                    normalized['studytime'] ??
                    normalized.value ??
                    0
                ) || 0;

                // 优先根据日期计算索引，保证顺序正确
                const dateValue = normalized.date || normalized.activity_date || normalized['activity_date'];
                if (dateValue) {
                    const dateObj = new Date(dateValue);
                    if (!isNaN(dateObj)) {
                        const day = dateObj.getDay(); // 周日为0
                        targetIndex = day === 0 ? 6 : day - 1;
                    }
                } else if (normalized.day && dayNameMap[normalized.day]) {
                    targetIndex = dayNameMap[normalized.day];
                }
            }

            weekData[targetIndex] = value;
        });

        console.log('规范化后的本周学习时间分布 weekData:', weekData);
        return weekData;
    }

    function normalizeStudentCourseProgress(course) {
        if (!course || typeof course !== 'object') {
            return 0;
        }

        const explicitProgress = Number(
            course.progress ??
            course.courseProgress ??
            course.learningProgress ??
            course.completionRate
        );
        if (Number.isFinite(explicitProgress)) {
            return Math.max(0, Math.min(100, Math.round(explicitProgress)));
        }

        const status = String(course.courseStatus || course.status || '').trim();
        if (status === '已结束' || status.toUpperCase() === 'COMPLETED') {
            return 100;
        }
        if (status === '进行中' || status.toUpperCase() === 'IN_PROGRESS') {
            return 60;
        }
        if (status === '未开始' || status.toUpperCase() === 'NOT_STARTED') {
            return 0;
        }

        return 0;
    }

    function buildCourseProgressChartData(courseList) {
        const safeList = Array.isArray(courseList) ? courseList : [];
        return {
            ids: safeList.map(course => course.id ?? course.courseId ?? null),
            names: safeList.map(course => course.courseName || course.name || '未知课程'),
            progress: safeList.map(normalizeStudentCourseProgress)
        };
    }

    function deriveDashboardProgressFromCourses(courseList) {
        const progressValues = (Array.isArray(courseList) ? courseList : []).map(normalizeStudentCourseProgress);
        if (!progressValues.length) {
            return null;
        }
        return Math.round(progressValues.reduce((sum, value) => sum + value, 0) / progressValues.length);
    }

    function resolveDashboardProgressMeta(stats) {
        if (stats && Number.isFinite(Number(stats.progress))) {
            return '根据已接通课程数据估算';
        }
        return '暂无可计算的学习进度';
    }

    async function populateDashboardStudyTimeFromConnectedSources(studentAPI, chartData) {
        try {
            const studyTimeData = await studentAPI.getStudyTimeDistribution();
            console.log('获取到学习时间分布数据:', studyTimeData);
            if (studyTimeData && studyTimeData.success && studyTimeData.data && Array.isArray(studyTimeData.data)) {
                chartData.studyTime = transformStudyTimeData(
                    studyTimeData.data.sort((a, b) => new Date(a.date) - new Date(b.date))
                );
                return;
            }
        } catch (error) {
            console.error('获取学习时间分布失败:', error);
        }

        chartData.studyTime = transformStudyTimeData([]);
    }

    async function populateDashboardFromConnectedSources(studentAPI, statsData, chartData) {
        let courseList = [];
        let assignmentList = [];
        let examList = [];

        try {
            const courses = await studentAPI.getStudentCourses();
            if (courses && courses.success && courses.data) {
                courseList = courses.data.content || courses.data || [];
                const progressData = buildCourseProgressChartData(courseList);
                chartData.courses = courseList;
                chartData.courseIds = progressData.ids;
                chartData.courseNames = progressData.names;
                chartData.courseProgress = progressData.progress;
            }
        } catch (error) {
            console.error('从课程列表获取仪表盘数据失败:', error);
        }

        try {
            const assignments = await studentAPI.getAssignments({ submitted: false, isActive: true });
            if (assignments && assignments.success && assignments.data) {
                assignmentList = assignments.data.content || assignments.data || [];
            }
        } catch (error) {
            console.error('从作业列表获取仪表盘数据失败:', error);
        }

        try {
            const exams = await studentAPI.getExams({ submitted: false, isActive: true });
            if (exams && exams.success && exams.data) {
                examList = exams.data.content || exams.data || [];
            }
        } catch (error) {
            console.error('从考试列表获取仪表盘数据失败:', error);
        }

        await populateDashboardStudyTimeFromConnectedSources(studentAPI, chartData);

        statsData.courses = courseList.length;
        statsData.assignments = assignmentList.length;
        statsData.exams = examList.length;
        statsData.progress = deriveDashboardProgressFromCourses(courseList);

        await populateDashboardActivitiesFromConnectedSources(studentAPI, statsData);
    }

    async function populateDashboardActivitiesFromConnectedSources(studentAPI, statsData) {
        let recentAssignments = [];
        let recentExams = [];

        try {
            const assignments = await studentAPI.getAssignments({ page: 1, size: 5 });
            if (assignments && assignments.success && assignments.data) {
                recentAssignments = assignments.data.content || assignments.data || [];
            }
        } catch (error) {
            console.error('从作业列表获取最近活动失败:', error);
        }

        try {
            const exams = await studentAPI.getExams({ page: 1, size: 20 });
            if (exams && exams.success && exams.data) {
                recentExams = exams.data.content || exams.data || [];
            }
        } catch (error) {
            console.error('从考试列表获取最近活动失败:', error);
        }

        const activities = [];
        let upcomingExamCountFromList = 0;
        const now = new Date();

        recentAssignments.forEach(assignment => {
            activities.push({
                type: 'assignment',
                text: `作业：${assignment.title || assignment.assignmentTitle || '未命名作业'}`,
                time: assignment.dueDate || assignment.submitTime || new Date().toISOString()
            });
        });

        recentExams.forEach(exam => {
            const startTime = exam.startTime ? new Date(exam.startTime) : null;
            if (startTime && startTime > now) {
                upcomingExamCountFromList++;
            }

            activities.push({
                type: 'exam',
                text: `考试：${exam.title || exam.examTitle || '未命名考试'}`,
                time: exam.startTime || exam.examTime || new Date().toISOString()
            });
        });

        if ((!statsData.exams || statsData.exams === 0) && upcomingExamCountFromList > 0) {
            console.log('使用最近活动考试列表覆盖 statsData.exams，数量为:', upcomingExamCountFromList);
            statsData.exams = upcomingExamCountFromList;
            updateStats(statsData);
        }

        activities.sort((a, b) => new Date(b.time) - new Date(a.time));
        updateRecentActivities(activities.slice(0, 5));
    }
    
    // 获取仪表板数据
    async function getDashboardData() {
        try {
            const sessionContext = window.getStudentSessionContext ? window.getStudentSessionContext() : null;
            const userStr = sessionStorage.getItem('user');
            let studentId = window.getCurrentUserId ? window.getCurrentUserId() : null;
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    studentId = studentId || user.id;
                } catch (error) {
                    console.warn('解析学生信息失败，改用已保存的 userId:', error);
                }
            }
            if (!studentId && !(sessionContext && sessionContext.canRender)) {
                console.error('学生登录上下文缺失');
                showEmptyStateData();
                return;
            }
            console.log('当前登录学生ID:', studentId || '未知，改由JWT上下文继续请求');
            
            // 初始化API服务
            const apiService = new APIService();
            const studentAPI = new StudentAPI(apiService);
            
            let statsData = {
                courses: 0,
                assignments: 0,
                exams: 0,
                progress: 0
            };
            
            let chartData = {
                studyTime: [],
                courseNames: [],
                courseProgress: []
            };
            
            // 显示加载状态
            showLoading();
            
            // 优先调用学生表现接口获取综合数据
            try {
                console.log('调用/dashboard/student-performance接口获取学生表现数据');
                const performanceData = await studentAPI.getCurrentStudentPerformance();
                console.log('获取到学生表现数据:', performanceData);
                console.log('performanceData类型:', typeof performanceData);
                console.log('performanceData是否为null:', performanceData === null);
                console.log('performanceData.success:', performanceData?.success);
                console.log('performanceData.data:', performanceData?.data);
                
                // 检查API返回的数据
                if (performanceData) {
                    // 如果返回的数据有success字段，检查success
                    if (performanceData.success === false) {
                        if (performanceData.unsupported) {
                            console.log('学生综合表现接口暂未接通，继续使用已接通的数据源生成仪表盘。');
                        } else {
                            console.warn('API返回success=false:', performanceData.message || '未知错误');
                        }
                    } else if (performanceData.success && performanceData.data) {
                        const data = performanceData.data;
                        
                        // 更新统计数据
                        statsData.courses = data.courseCount || 0;
                        
                        statsData.assignments = data.pendingAssignments || 0;
                        
                        statsData.exams = data.upcomingExams || 0;
                        
                        statsData.progress = Math.round(data.overallProgress || 0);
                    } else if (performanceData.data) {
                        // 如果没有success字段，但直接有data字段
                        const data = performanceData.data;
                        
                        // 更新统计数据
                        statsData.courses = data.courseCount || 0;
                        
                        statsData.assignments = data.pendingAssignments || 0;
                        
                        statsData.exams = data.upcomingExams || 0;
                        
                        statsData.progress = Math.round(data.overallProgress || 0);
                    } else {
                        console.warn('API返回的数据格式不正确:', performanceData);
                    }
                } else {
                    console.warn('API返回null，可能是401未授权错误');
                }
                
                // 如果成功获取了数据，继续处理课程列表等
                if (performanceData && performanceData.data) {
                    const data = performanceData.data;
                    
                    // 获取课程列表用于进度图表
                    if (data.courses && Array.isArray(data.courses)) {
                        const progressData = buildCourseProgressChartData(data.courses);
                        chartData.courses = data.courses;
                        chartData.courseIds = progressData.ids;
                        chartData.courseNames = progressData.names;
                        chartData.courseProgress = progressData.progress;
                        if (!statsData.courses) {
                            statsData.courses = data.courses.length;
                        }
                        if (!statsData.progress) {
                            statsData.progress = deriveDashboardProgressFromCourses(data.courses);
                        }
                    } else {
                        // 备用方案：从API获取课程列表
                        try {
                            const courses = await studentAPI.getStudentCourses();
                            if (courses && courses.success && courses.data) {
                                const courseList = courses.data.content || courses.data || [];
                                const progressData = buildCourseProgressChartData(courseList);
                                chartData.courses = courseList;
                                chartData.courseIds = progressData.ids;
                                chartData.courseNames = progressData.names;
                                chartData.courseProgress = progressData.progress;
                                if (!statsData.courses) {
                                    statsData.courses = courseList.length;
                                }
                                if (!statsData.progress) {
                                    statsData.progress = deriveDashboardProgressFromCourses(courseList);
                                }
                            }
                        } catch (error) {
                            console.error('获取课程列表失败:', error);
                        }
                    }
                    
                    await populateDashboardStudyTimeFromConnectedSources(studentAPI, chartData);
                    
                    // 更新最近活动
                    if (data.recentActivities && Array.isArray(data.recentActivities)) {
                        const activities = data.recentActivities.map(activity => ({
                            type: activity.type || 'unknown',
                            text: activity.description || '未知活动',
                            time: activity.timestamp || new Date().toISOString(),
                            score: 0
                        }));
                        updateRecentActivities(activities);
                    } else {
                        const activitiesResponse = await studentAPI.getRecentActivities();
                        if (activitiesResponse?.unsupported) {
                            showMessage(activitiesResponse.message, 'info');
                            await populateDashboardActivitiesFromConnectedSources(studentAPI, statsData);
                        } else {
                            try {
                                await populateDashboardActivitiesFromConnectedSources(studentAPI, statsData);
                            } catch (error) {
                                console.error('生成最近活动数据失败:', error);
                                // 没有活动数据时显示空列表
                                updateRecentActivities([]);
                            }
                        }
                    }
                } else {
                    await populateDashboardFromConnectedSources(studentAPI, statsData, chartData);
                }
            } catch (performanceError) {
                console.error('获取学生表现数据失败:', performanceError);
                
                // 备用方案：分别获取各个数据
            try {
                // 获取学生统计数据
                const studentStats = await studentAPI.getStudentStats();
                    if (studentStats && studentStats.success && studentStats.data) {
                        const data = studentStats.data;
                        statsData = {
                            courses: data.totalCourses || 0,
                            assignments: (data.totalAssignments || 0) - (data.completedAssignments || 0),
                            exams: (data.totalExams || 0) - (data.completedExams || 0),
                            progress: Math.round(data.averageScore || 0)
                        };
                    }
            } catch (statsError) {
                console.error('获取学生统计数据失败:', statsError);
                let fallbackCourseList = [];
                let fallbackAssignmentList = [];
                let fallbackExamList = [];
                
                // 尝试直接查询各个列表
                // 尝试从课程列表中获取课程数量
                try {
                    const courses = await studentAPI.getStudentCourses();
                    if (courses && courses.success && courses.data) {
                        fallbackCourseList = courses.data.content || courses.data || [];
                        const progressData = buildCourseProgressChartData(fallbackCourseList);
                        statsData.courses = fallbackCourseList.length;
                        statsData.progress = deriveDashboardProgressFromCourses(fallbackCourseList);
                        chartData.courses = fallbackCourseList;
                        chartData.courseIds = progressData.ids;
                        chartData.courseNames = progressData.names;
                        chartData.courseProgress = progressData.progress;
                    }
                } catch (error) {
                    console.error('从课程列表获取课程数量失败:', error);
                }
                
                // 尝试获取作业列表
                try {
                    const assignments = await studentAPI.getAssignments({ submitted: false, isActive: true });
                    if (assignments && assignments.success && assignments.data) {
                        fallbackAssignmentList = assignments.data.content || assignments.data || [];
                        statsData.assignments = fallbackAssignmentList.length;
                    }
                } catch (error) {
                    console.error('获取待完成作业数据失败:', error);
                }
                
                // 尝试获取考试列表
                try {
                    const exams = await studentAPI.getExams({ submitted: false, isActive: true });
                    if (exams && exams.success && exams.data) {
                        fallbackExamList = exams.data.content || exams.data || [];
                        statsData.exams = fallbackExamList.length;
                    }
                } catch (error) {
                    console.error('获取即将到来的考试数据失败:', error);
                }

                if (!statsData.courses && fallbackCourseList.length) {
                    statsData.courses = fallbackCourseList.length;
                }
                if (!statsData.progress && fallbackCourseList.length) {
                    statsData.progress = deriveDashboardProgressFromCourses(fallbackCourseList);
                }
                if (!statsData.assignments && fallbackAssignmentList.length) {
                    statsData.assignments = fallbackAssignmentList.length;
                }
                if (!statsData.exams && fallbackExamList.length) {
                    statsData.exams = fallbackExamList.length;
                }

                if (!statsData.courses && !statsData.assignments && !statsData.exams && !statsData.progress) {
                    await populateDashboardFromConnectedSources(studentAPI, statsData, chartData);
                }
            }
                
                // 尝试获取最近活动数据
                try {
                    await populateDashboardActivitiesFromConnectedSources(studentAPI, statsData);
                } catch (error) {
                    console.error('生成最近活动数据失败:', error);
                    // 没有活动数据时显示空列表
                    updateRecentActivities([]);
                }
                
                // 尝试从API获取学习时间分布
                try {
                    await populateDashboardStudyTimeFromConnectedSources(studentAPI, chartData);
                } catch (error) {
                    console.error('获取学习时间分布失败:', error);
                    chartData.studyTime = transformStudyTimeData([]);
                }
            }
            
            // 为了保证“即将到来的考试”统计准确，这里再次基于考试列表修正 statsData.exams
            try {
                const examsResp = await studentAPI.getExams({ page: 1, size: 100 });
                if (examsResp && examsResp.success && examsResp.data) {
                    const examList = examsResp.data.content || examsResp.data || [];
                    const now = new Date();
                    
                    // 仅统计尚未开始的考试数量
                    const upcomingCount = examList.filter(exam => {
                        if (!exam || !exam.startTime) return false;
                        const start = new Date(exam.startTime);
                        return start > now;
                    }).length;
                    
                    // 只有在后端给出的 exams 为 0 或未定义时才覆盖，避免破坏本来正确的数据
                    if ((!statsData.exams || statsData.exams === 0) && upcomingCount > 0) {
                        console.log('根据 /api/student/exams 重新计算 upcoming 考试数量:', upcomingCount);
                        statsData.exams = upcomingCount;
                    }
                }
            } catch (error) {
                console.error('根据考试列表修正即将到来考试数量失败:', error);
            }
            
            // 输出最终的statsData，用于调试
            console.log('最终的统计数据:', statsData);
            
            // 更新统计数据
            updateStats(statsData);
            
            // 更新图表
            updateCharts(chartData);
            
        } catch (error) {
            console.error('获取仪表板数据失败:', error);
            // 显示错误消息
            showMessage('加载仪表盘数据失败，请稍后重试', 'error');
            // 显示空状态数据
            showEmptyStateData();
        } finally {
            // 隐藏加载状态
            hideLoading();
        }
    }



    // 更新统计数据（带过渡效果）
    function updateStats(stats) {
        if (stats) {
            const metaLabelOverrides = {
                courses: '当前课程总览',
                assignments: '当前待完成作业',
                exams: '当前考试安排',
                progress: '当前学习进度估算'
            };
            // 添加加载状态
            const statValues = document.querySelectorAll('.stat-value');
            const statChanges = document.querySelectorAll('.stat-change');
            
            statValues.forEach(value => {
                value.style.opacity = '0.5';
            });
            
            statChanges.forEach(change => {
                change.style.opacity = '0.5';
            });
            
            // 延迟更新数值，模拟异步数据加载
            setTimeout(() => {
                animateValue('courseCount', 0, stats.courses || 0, 600);
                animateValue('assignmentCount', 0, stats.assignments || 0, 600);
                animateValue('examCount', 0, stats.exams || 0, 600);
                animateProgress('progressPercentage', 0, stats.progress, 600);
                
                // 更新变化趋势
                updateStatMeta('courseCount', metaLabelOverrides.courses);
                updateStatMeta('assignmentCount', metaLabelOverrides.assignments);
                updateStatMeta('examCount', metaLabelOverrides.exams);
                updateStatMeta('progressPercentage', metaLabelOverrides.progress);
                if (!Number.isFinite(Number(stats.progress))) {
                    updateStatMeta('progressPercentage', resolveDashboardProgressMeta(stats));
                }
                
                // 恢复不透明度
                statValues.forEach(value => {
                    value.style.opacity = '1';
                });
                
                statChanges.forEach(change => {
                    change.style.opacity = '1';
                });
            }, 300);
        }
    }
    
    // 更新变化趋势显示
    function updateStatMeta(elementId, labelText) {
        const labelElement = document.getElementById(`${elementId}MetaLabel`);
        if (labelElement) {
            labelElement.textContent = labelText;
        }
    }
    
    // 数值动画函数
    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        const range = end - start;
        const minTimer = 50;
        let stepTime;
        
        // 修复当range为0时stepTime变为Infinity的问题
        if (range === 0) {
            // 直接设置最终值，不需要动画
            obj.textContent = end;
            return;
        }
        
        stepTime = Math.abs(Math.floor(duration / range));
        stepTime = Math.max(stepTime, minTimer);
        
        let startTime = new Date().getTime();
        let endTime = startTime + duration;
        let timer;
        
        function run() {
            let now = new Date().getTime();
            let remaining = Math.max((endTime - now) / duration, 0);
            let value = Math.round(end - (remaining * range));
            obj.textContent = value;
            
            if (value === end) {
                clearInterval(timer);
            }
        }
        
        timer = setInterval(run, stepTime);
        run();
    }
    
    // 进度百分比动画函数
    function animateProgress(id, start, end, duration) {
        const obj = document.getElementById(id);
        if (!Number.isFinite(Number(end))) {
            obj.textContent = '--';
            return;
        }
        end = Number(end);
        const range = end - start;
        const minTimer = 50;
        let stepTime;
        
        // 修复当range为0时stepTime变为Infinity的问题
        if (range === 0) {
            // 直接设置最终值，不需要动画
            obj.textContent = end + '%';
            return;
        }
        
        stepTime = Math.abs(Math.floor(duration / range));
        stepTime = Math.max(stepTime, minTimer);
        
        let startTime = new Date().getTime();
        let endTime = startTime + duration;
        let timer;
        
        function run() {
            let now = new Date().getTime();
            let remaining = Math.max((endTime - now) / duration, 0);
            let value = Math.round(end - (remaining * range));
            obj.textContent = value + '%';
            
            if (value === end) {
                clearInterval(timer);
            }
        }
        
        timer = setInterval(run, stepTime);
        run();
    }

    function normalizeProgressValue(value) {
        if (value && typeof value === 'object') {
            value = value.progress ?? value.progressPercentage ?? value.completionRate ??
                value.completionPercentage ?? value.mastery ?? value.masteryRate ?? value.averageMastery ?? 0;
        }
        if (typeof value === 'string') {
            value = value.replace('%', '').trim();
        }
        const numericValue = Number(value);
        if (!Number.isFinite(numericValue)) {
            return 0;
        }
        const percentage = numericValue > 0 && numericValue <= 1 ? numericValue * 100 : numericValue;
        return Math.max(0, Math.min(100, Math.round(percentage * 10) / 10));
    }

    async function enrichCourseProgressFromStats(chartsData, normalizedCourseProgress) {
        if (!chartsData || normalizedCourseProgress.some(value => value > 0)) {
            return normalizedCourseProgress;
        }
        try {
            const apiService = new APIService();
            const statsResponse = await apiService.get('/api/student/stats');
            const knowledgePoints = statsResponse && statsResponse.success && statsResponse.data
                ? statsResponse.data.knowledgePoints
                : [];
            if (!Array.isArray(knowledgePoints) || knowledgePoints.length === 0) {
                return normalizedCourseProgress;
            }
            const progressByCourse = new Map();
            const progressByCourseId = new Map();
            knowledgePoints.forEach(point => {
                const courseName = point.courseName || point.course || point.name;
                const courseId = point.courseId ?? point.course_id ?? null;
                const progress = normalizeProgressValue(point.mastery ?? point.masteryRate ?? point.averageMastery);
                if (progress <= 0) {
                    return;
                }
                if (courseId !== null && courseId !== undefined && String(courseId).trim() !== '') {
                    const idKey = String(courseId);
                    const currentById = progressByCourseId.get(idKey) || { total: 0, count: 0 };
                    currentById.total += progress;
                    currentById.count += 1;
                    progressByCourseId.set(idKey, currentById);
                }
                if (courseName) {
                    const current = progressByCourse.get(courseName) || { total: 0, count: 0 };
                    current.total += progress;
                    current.count += 1;
                    progressByCourse.set(courseName, current);
                }
            });
            if (progressByCourse.size === 0 && progressByCourseId.size === 0) {
                return normalizedCourseProgress;
            }
            const courseIds = Array.isArray(chartsData.courseIds) ? chartsData.courseIds : [];
            return (chartsData.courseNames || []).map((name, index) => {
                const courseId = courseIds[index];
                const current = courseId !== null && courseId !== undefined
                    ? progressByCourseId.get(String(courseId))
                    : null;
                if (current) {
                    return Math.round((current.total / current.count) * 10) / 10;
                }
                const currentByName = progressByCourse.get(name);
                return currentByName ? Math.round((currentByName.total / currentByName.count) * 10) / 10 : normalizedCourseProgress[index] || 0;
            });
        } catch (error) {
            console.warn('课程进度兜底计算失败:', error);
            return normalizedCourseProgress;
        }
    }

    // 更新图表数据
    async function updateCharts(chartsData) {
        if (!chartsData) return;
        const courseRows = Array.isArray(chartsData.courses) ? chartsData.courses : [];
        const normalizedCourseNames = Array.isArray(chartsData.courseNames) && chartsData.courseNames.length > 0
            ? chartsData.courseNames
            : courseRows.map(course => course.courseName || course.name || course.title || '未命名课程');
        let normalizedCourseProgress = Array.isArray(chartsData.courseProgress)
            ? chartsData.courseProgress.map(value => normalizeProgressValue(value))
            : [];
        if (courseRows.length > 0 && (normalizedCourseProgress.length === 0 || normalizedCourseProgress.every(value => value === 0))) {
            normalizedCourseProgress = courseRows.map(course => normalizeProgressValue(course));
        }
        normalizedCourseProgress = await enrichCourseProgressFromStats(
            { ...chartsData, courseNames: normalizedCourseNames },
            normalizedCourseProgress
        );

        // 学习时间分布图表
        const studyTimeChart = echarts.init(document.getElementById('studyTimeChart'));
        const studyTimeOption = {
            tooltip: {
                trigger: 'axis'
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: '学习时长(小时)',
                    type: 'line',
                    data: chartsData.studyTime || [],
                    smooth: true,
                    lineStyle: {
                        color: '#0d9488'
                    },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            {
                                offset: 0,
                                color: 'rgba(13, 148, 136, 0.3)'
                            },
                            {
                                offset: 1,
                                color: 'rgba(13, 148, 136, 0.05)'
                            }
                        ])
                    }
                }
            ]
        };
        studyTimeChart.setOption(studyTimeOption);

        // 课程学习进度图表
        const courseProgressChart = echarts.init(document.getElementById('courseProgressChart'));
        const courseProgressOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'value',
                max: 100
            },
            yAxis: {
                type: 'category',
                data: normalizedCourseNames
            },
            series: [
                {
                    name: '完成进度(%)',
                    type: 'bar',
                    data: normalizedCourseProgress,
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                            {
                                offset: 0,
                                color: '#0d9488'
                            },
                            {
                                offset: 1,
                                color: '#0f766e'
                            }
                        ])
                    }
                }
            ]
        };
        courseProgressChart.setOption(courseProgressOption);

        // 窗口大小改变时重新渲染图表
        window.addEventListener('resize', function() {
            studyTimeChart.resize();
            courseProgressChart.resize();
        });
    }

    // 更新最近活动列表
    function updateRecentActivities(activities) {
        const activitiesList = document.getElementById('activitiesList');
        
        const activityData = Array.isArray(activities) ? activities : [];
        
        activitiesList.innerHTML = '';
        
        if (activityData.length === 0) {
            // 没有活动数据时显示提示信息
            activitiesList.innerHTML = `
                <div class="no-activities">
                    <i class="fas fa-inbox"></i>
                    <p>暂无活动记录</p>
                </div>
            `;
            return;
        }
        
        activityData.forEach(activity => {
            const activityItem = document.createElement('div');
            activityItem.className = 'activity-item';
            
            let iconClass = '';
            let iconColor = '';
            
            switch (activity.type) {
                case 'course':
                    iconClass = 'fas fa-book';
                    iconColor = '#0d9488';
                    break;
                case 'assignment':
                    iconClass = 'fas fa-file-alt';
                    iconColor = '#10b981';
                    break;
                case 'exam':
            iconClass = 'fas fa-line-chart';
                    iconColor = '#f59e0b';
                    break;
                case 'resource':
                    iconClass = 'fas fa-download';
                    iconColor = '#8b5cf6';
                    break;
                default:
                    iconClass = 'fas fa-info-circle';
                    iconColor = '#64748b';
            }
            
            activityItem.innerHTML = `
                <div class="activity-icon" style="background: ${iconColor}33; color: ${iconColor};">
                    <i class="${iconClass}"></i>
                </div>
                <div class="activity-content">
                    <div class="activity-text">${activity.text}</div>
                    <div class="activity-time">${activity.time}</div>
                </div>
            `;
            
            activitiesList.appendChild(activityItem);
        });
    }

    // 更新课程列表（仅使用真实数据）
    function updateCoursesList(courses) {
        const coursesGrid = document.getElementById('coursesGrid');
        
        if (!coursesGrid) {
            return;
        }
        
        const courseData = Array.isArray(courses) ? courses : [];
        coursesGrid.innerHTML = '';
        
        if (courseData.length === 0) {
            coursesGrid.innerHTML = `
                <div class="no-courses">
                    <i class="fas fa-inbox"></i>
                    <p>暂无课程数据</p>
                </div>
            `;
            return;
        }
        
        courseData.forEach(course => {
            const courseCard = document.createElement('div');
            courseCard.className = 'course-card';
            
            const progress = typeof course.progress === 'number' ? course.progress : 0;
            const name = course.courseName || course.name || '未命名课程';
            const teacher = course.teacherName || course.teacher || '未知教师';
            
            courseCard.innerHTML = `
                <div class="course-header">
                    <div class="course-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="course-info">
                        <h4>${name}</h4>
                        <div class="course-teacher">${teacher}</div>
                    </div>
                </div>
                <div class="course-progress">
                    <div class="progress-label">
                        <span>学习进度</span>
                        <span>${progress}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%">
                        </div>
                    </div>
                </div>
            `;
            
            coursesGrid.appendChild(courseCard);
        });
    }
    
    // 显示空状态数据
    function showEmptyStateData() {
        console.log('显示空状态数据');
        
        // 空统计数据
        const emptyStatsData = {
            courses: 0,
            assignments: 0,
            exams: 0,
            progress: null
        };
        
        // 空图表数据
        const emptyChartData = {
            studyTime: [],
            courseNames: [],
            courseProgress: []
        };
        
        // 空活动数据
        const emptyActivities = [];
        
        // 更新统计数据
        updateStats(emptyStatsData);
        
        // 更新图表
        updateCharts(emptyChartData);
        
        // 更新最近活动
        updateRecentActivities(emptyActivities);
    }
