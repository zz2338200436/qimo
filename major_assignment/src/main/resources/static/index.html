<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能后台学习辅助系统</title>
    <!-- Bootstrap 5 CDN -->
    <link href="lib/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link href="lib/font-awesome.min.css" rel="stylesheet">
    <!-- Google Fonts -->
        <style>
        :root {
            --teacher-primary: #2563eb;
            --teacher-primary-strong: #1d4ed8;
            --teacher-shell: #0f172a;
            --teacher-accent: #38bdf8;
            --student-primary: #0d9488;
            --student-primary-strong: #0f766e;
            --student-accent: #14b8a6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 18% 20%, rgba(20, 184, 166, 0.24), transparent 30%),
                radial-gradient(circle at 82% 18%, rgba(56, 189, 248, 0.2), transparent 32%),
                linear-gradient(135deg, var(--teacher-shell) 0%, #1e293b 42%, var(--student-primary-strong) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0f172a;
        }
        
        .welcome-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
            max-width: 600px;
            width: 100%;
        }
        
        .welcome-icon {
            font-size: 80px;
            color: var(--student-primary);
            margin-bottom: 20px;
        }
        
        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
        }
        
        .welcome-subtitle {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 40px;
        }
        
        .login-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .login-btn {
            flex: 1;
            min-width: 200px;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .student-btn {
            background: linear-gradient(135deg, var(--student-primary) 0%, var(--student-primary-strong) 100%);
            color: white;
        }
        
        .student-btn:hover {
            background: linear-gradient(135deg, var(--student-primary-strong) 0%, #115e59 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.3);
            color: white;
        }
        
        .teacher-btn {
            background: linear-gradient(135deg, var(--teacher-primary) 0%, var(--teacher-primary-strong) 100%);
            color: white;
        }
        
        .teacher-btn:hover {
            background: linear-gradient(135deg, var(--teacher-primary-strong) 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.32);
            color: white;
        }
        
        .login-btn i {
            margin-right: 8px;
        }
        
        @media (max-width: 576px) {
            .login-buttons {
                flex-direction: column;
            }
            
            .welcome-title {
                font-size: 24px;
            }
            
            .welcome-container {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <i class="fa fa-graduation-cap welcome-icon"></i>
        <h1 class="welcome-title">智能后台学习辅助系统</h1>
        <p class="welcome-subtitle">欢迎使用智能后台学习辅助系统，请选择您的身份登录</p>
        
        <div class="login-buttons">
            <a href="student-login.html" class="login-btn student-btn">
                <i class="fa fa-user-circle-o"></i> 学生登录
            </a>
            <a href="teacher-login.html?v=20260608-theme-4" class="login-btn teacher-btn">
                <i class="fa fa-user-md"></i> 教师登录
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="lib/bootstrap.bundle.min.js"></script>
    <script>
        (function redirectLoggedInUser() {
            try {
                const user = JSON.parse(sessionStorage.getItem('user') || 'null');
                if (user?.roles?.includes('TEACHER')) {
                    window.location.href = 'teacher-dashboard.html?v=20260608-theme-4';
                    return;
                }
                if (user?.roles?.includes('STUDENT')) {
                    window.location.href = 'student-dashboard.html';
                }
            } catch (error) {
                console.warn('Auto redirect skipped:', error);
            }
        })();
    </script>
</body>
</html>
