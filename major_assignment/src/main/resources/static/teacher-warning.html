                        '与学生进行面谈，了解学习困难',
                        '安排课后辅导，针对性解决问题',
                        '与家长沟通，共同关注学生学习情况',
                        '制定学习计划，帮助学生提高成绩'
                    ];
                } else if (warningType === '作业预警') {
                    suggestions = [
                        '提醒学生按时完成作业',
                        '了解学生作业完成困难的原因',
                        '提供作业辅导或额外练习',
                        '建立作业提醒机制'
                    ];
                } else if (warningType === '考勤预警') {
                    suggestions = [
                        '联系学生了解缺勤原因',
                        '与家长沟通，加强考勤管理',
                        '建立考勤奖惩机制',
                        '关注学生学习状态变化'
                    ];
                } else if (warningType === '进度预警') {
                    suggestions = [
                        '了解学生学习进度落后的原因',
                        '提供学习资源和辅导',
                        '制定个性化学习计划',
                        '定期跟踪学习进度'
                    ];
                }

                const warningStatus = normalizeWarningStatus(initialStatus, initialResolved);
                const warningStudentName = warningDetail.studentName || studentName;
                const warningCourseName = warningDetail.courseName || '未关联课程';
                const warningLevel = warningDetail.warningLevel || '未设置';
                const warningReason = warningDetail.reason || warningDetail.warningMessage || '暂无预警原因说明';
                const warningSuggestion = warningDetail.suggestion || getSuggestionByWarningType(warningType);
                
                // 渲染预警详情内容
                const warningDetailContent = document.getElementById('warningDetailContent');
                warningDetailContent.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-body">
                                    <h6 class="card-title">预警基本信息</h6>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <p><strong>预警ID：</strong>${warningId}</p>
                                            <p><strong>预警类型：</strong><span class="badge badge-${getWarningTypeColor(warningType)}">${warningType}</span></p>
                                            <p><strong>预警时间：</strong>${warningDetail.triggerDate ? new Date(warningDetail.triggerDate).toLocaleString() : '暂无触发时间'}</p>
                                        </div>
                                        <div class="col-md-6">
                                            <p><strong>处理状态：</strong><span class="badge badge-${getStatusColor(warningStatus)}" id="warningDetailStatusBadge">${getStatusText(warningStatus)}</span></p>
                                            <p><strong>预警级别：</strong>${warningLevel}</p>
                                            <p><strong>关联类型：</strong>${warningDetail.assessmentType || '未关联测评'}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card mb-3">
                                <div class="card-body">
                                    <h6 class="card-title">学生信息</h6>
                                    <p><strong>学号：</strong>${studentId}</p>
                                    <p><strong>姓名：</strong>${warningStudentName}</p>
                                    <p><strong>课程：</strong>${warningCourseName}</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card mb-3">
                                <div class="card-body">
                                    <h6 class="card-title">预警原因</h6>
                                    <p>${warningReason}</p>
                                </div>
                            </div>
                            <div class="card mb-3">
                                <div class="card-body">
                                    <h6 class="card-title">预警建议</h6>
                                    <p>${warningSuggestion}</p>
                                    <ol>
                                        ${suggestions.map(suggestion => `<li>${suggestion}</li>`).join('')}
                                    </ol>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title">处理记录</h6>
                            <div class="processing-record">
                                <p class="text-muted">${warningDetail.resolvedNote || '暂无处理记录'}</p>
                            </div>
                        </div>
                    </div>
                `;
                
                // 显示模态框
                const modal = new bootstrap.Modal(document.getElementById('warningDetailModal'));
                modal.show();
                
                // 设置当前预警ID
                currentWarningId = warningId;
                
                updateWarningDetailStatusBadge(warningStatus);
                updateWarningDetailActionState(warningStatus);
            } catch (error) {
                console.error('获取预警详情失败:', error);
                const warningDetailContent = document.getElementById('warningDetailContent');
                showError(warningDetailContent, '获取预警详情失败，请稍后重试');
            }
        }
        
        // 获取当前筛选条件
        function getCurrentFilters() {
            const selectedClass = document.getElementById('class-select').value;
            const selectedCourse = document.getElementById('course-select').value;
            const selectedType = document.getElementById('warning-type').value;
            const selectedStatus = document.getElementById('warning-status').value;
            
            return {
                classId: selectedClass,
                courseId: selectedCourse,
                warningType: selectedType,
                status: selectedStatus
            };
        }
        
        // 标记为处理中
        async function markAsProcessing(warningId) {
            try {
                // 调用API更新预警状态为处理中
                await fetchAPI(`/early-warnings/teacher/status/${warningId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'processing',
                        resolvedNote: ''
                    })
                });
                
                // 获取当前筛选条件
                const currentFilters = getCurrentFilters();
                
                // 刷新数据，传递当前筛选条件
                await loadWarnings(currentPage, currentFilters);
                await loadStats(currentFilters);
                await updateCharts(currentFilters); // 更新图表数据
                updateWarningDetailStatusBadge('processing');
                updateWarningDetailActionState('processing');
                showNotification('预警已标记为处理中', 'success');
            } catch (error) {
                console.error('标记预警状态失败:', error);
                showNotification('标记预警状态失败', 'error');
            }
        }
        
        // 标记为已解决
        async function resolveWarning(warningId) {
            // 防止重复调用
            if (isResolving) {
                console.log('正在处理中，请勿重复点击');
                return;
            }
            
            try {
                isResolving = true;
                
                // 调用API更新预警状态为已解决
                await fetchAPI(`/early-warnings/teacher/status/${warningId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        status: 'resolved',
                        resolvedNote: ''
                    })
                });
                
                // 获取当前筛选条件
                const currentFilters = getCurrentFilters();
                
                // 先清空警告列表，防止重复数据
                const warningList = document.querySelector('.warning-list');
                if (warningList) {
                    warningList.innerHTML = '';
                }
                
                // 刷新数据，传递当前筛选条件
                await loadWarnings(currentPage, currentFilters);
                await loadStats(currentFilters);
                await updateCharts(currentFilters); // 更新图表数据
                updateWarningDetailStatusBadge('resolved');
                updateWarningDetailActionState('resolved');
                showNotification('预警已标记为已解决', 'success');
            } catch (error) {
                console.error('标记预警状态失败:', error);
                showNotification('标记预警状态失败', 'error');
            } finally {
                isResolving = false;
            }
        }
        
        // 导出Excel功能
        async function exportToExcel() {
            try {
                const selectedClass = document.getElementById('class-select').value;
                const selectedCourse = document.getElementById('course-select').value;
                const selectedType = document.getElementById('warning-type').value;
                const selectedStatus = document.getElementById('warning-status').value;
                
                // 构建查询参数
                const params = new URLSearchParams();
                if (selectedClass !== 'all') {
                    params.append('classId', selectedClass);
                }
                if (selectedCourse !== 'all') {
                    params.append('courseId', selectedCourse);
                }
                if (selectedType !== 'all') {
                    // 转换前端预警类型为后端预警类型
                    const backendWarningType = selectedType === 'score' ? 'low_score' : 
                                             selectedType === 'attendance' ? 'low_attendance' : 
                                             selectedType === 'homework' ? 'late_submission' : 'progress';
                    params.append('warningType', backendWarningType);
                }
                if (selectedStatus !== 'all') {
                    params.append('status', selectedStatus);
                }
                
                // 调用API导出Excel
                window.location.href = `${API_BASE_URL}/early-warnings/teacher/export?${params.toString()}`;
                showNotification('正在导出Excel文件，请稍候...', 'info');
            } catch (error) {
                console.error('导出Excel失败:', error);
                showNotification('导出Excel失败，请稍后重试', 'error');
            }
        }
        
        // 自动分析学情预警
        async function triggerAutoAnalysis() {
            try {
                // 调用后端自动分析API
                const response = await fetchAPI('/teacher/analysis/warnings/trigger', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.code === 200) {
                    return true;
                } else {
                    console.warn('自动分析返回非200:', response.message);
                    return false;
                }
            } catch (error) {
                console.error('自动分析失败:', error);
                return false;
            }
        }
        
        // 刷新数据功能（先自动分析再刷新）
        async function refreshData() {
            const refreshBtn = document.getElementById('refreshBtn');
            const originalBtnText = refreshBtn ? refreshBtn.innerHTML : '';
            
            try {
                // 显示加载状态
                if (refreshBtn) {
                    refreshBtn.disabled = true;
                    refreshBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 分析中...';
                }
                
                const warningList = document.querySelector('.warning-list');
                showLoading(warningList);
                
                // 先触发自动分析
                const analysisSuccess = await triggerAutoAnalysis();
                
                if (analysisSuccess) {
                    // 等待3秒让后端完成分析
                    await new Promise(resolve => setTimeout(resolve, 3000));
                }
                
                // 获取当前筛选条件
                const currentFilters = getCurrentFilters();
                
                // 重新加载所有数据
                await loadStats(currentFilters);
                await updateCharts(currentFilters);
                await loadWarnings(currentPage, currentFilters);
                
                showNotification('数据已刷新', 'success');
            } catch (error) {
                console.error('刷新数据失败:', error);
                const warningList = document.querySelector('.warning-list');
                showError(warningList, '刷新数据失败，请稍后重试');
            } finally {
                // 恢复按钮状态
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = originalBtnText;
                }
            }
        }
        
        // 检查用户是否已登录
        async function checkLogin() {
            try {
                // 检查localStorage中是否有用户信息
                const user = sessionStorage.getItem('user');
                if (user) {
                    return true;
                } else {
                    // 用户未登录，重定向到登录页面
                    window.location.href = 'teacher-login.html';
                    return false;
                }
            } catch (error) {
                console.error('登录检查失败:', error);
                // 登录检查失败，重定向到登录页面
                window.location.href = 'teacher-login.html';
                return false;
            }
        }
        
        // 保存预警信息
        async function saveWarning() {
            // 获取保存按钮
            const saveBtn = document.getElementById('saveWarningBtn');
            const originalBtnText = saveBtn.innerHTML;
            
            try {
                // 防止重复提交
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 保存中...';
                
                // 获取表单元素
                const studentSelect = document.getElementById('student-select');
                const courseSelect = document.getElementById('course-select-add');
                const warningTypeSelect = document.getElementById('warning-type-add');
                const warningLevelSelect = document.getElementById('warning-level-add');
                const warningMessageTextarea = document.getElementById('warning-message-add');
                const publishTimeInput = document.getElementById('publish-time-add');
                const assessmentTypeSelect = document.getElementById('assessment-type-add');
                const relatedAssessmentIdInput = document.getElementById('related-assessment-id-add');
                
                // 清除之前的验证错误
                clearValidationErrors();
                
                // 验证表单数据
                let isValid = true;
                
                // 验证必填字段
                if (!studentSelect.value) {
                    showValidationError(studentSelect, '请选择学生');
                    isValid = false;
                }
                
                if (!courseSelect.value) {
                    showValidationError(courseSelect, '请选择课程');
                    isValid = false;
                }
                
                if (!warningTypeSelect.value) {
                    showValidationError(warningTypeSelect, '请选择预警类型');
                    isValid = false;
                }
                
                if (!warningLevelSelect.value) {
                    showValidationError(warningLevelSelect, '请选择预警级别');
                    isValid = false;
                }
                
                if (!warningMessageTextarea.value.trim()) {
                    showValidationError(warningMessageTextarea, '请输入预警消息');
                    isValid = false;
                }
                
                if (!publishTimeInput.value) {
                    showValidationError(publishTimeInput, '请选择发布时间');
                    isValid = false;
                }
                
                // 验证关联ID（如果有）
                if (assessmentTypeSelect.value && !relatedAssessmentIdInput.value) {
                    showValidationError(relatedAssessmentIdInput, '请输入关联ID');
                    isValid = false;
                }
                
                if (!isValid) {
                    showNotification('请修正表单中的错误', 'warning');
                    return;
                }
                
                // 构建预警数据
                const warningData = {
                    studentId: parseInt(studentSelect.value),
                    courseId: parseInt(courseSelect.value),
                    warningType: warningTypeSelect.value,
                    warningLevel: warningLevelSelect.value,
                    warningMessage: warningMessageTextarea.value.trim(),
                    triggerDate: new Date(publishTimeInput.value).toISOString(),
                    assessmentType: assessmentTypeSelect.value || null,
                    relatedAssessmentId: relatedAssessmentIdInput.value ? parseInt(relatedAssessmentIdInput.value) : null
                };
                
                console.log('保存预警数据:', warningData);
                
                // 调用API保存预警信息
                const response = await fetchAPI('/early-warnings/teacher', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(warningData)
                });
                
                console.log('保存预警响应:', response);
                
                // 关闭模态框
                const modal = bootstrap.Modal.getInstance(document.getElementById('addWarningModal'));
                modal.hide();
                
                // 重置表单
                document.getElementById('addWarningForm').reset();
                
                // 刷新数据
                await loadStats();
                await loadWarnings();
                await updateCharts(); // 更新图表数据
                
                // 显示成功通知
                showNotification('预警信息添加成功', 'success');
            } catch (error) {
                console.error('保存预警信息失败:', error);
                
                // 显示详细错误信息
                let errorMessage = '保存预警信息失败';
                if (error.message) {
                    errorMessage += ': ' + error.message;
                }
                showNotification(errorMessage, 'error');
            } finally {
                // 恢复按钮状态
                const saveBtn = document.getElementById('saveWarningBtn');
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-save"></i> 保存预警';
            }
        }
        
        // 显示表单验证错误
        function showValidationError(element, message) {
            element.classList.add('is-invalid');
            let errorElement = element.parentElement.querySelector('.invalid-feedback');
            if (!errorElement) {
                errorElement = document.createElement('div');
                errorElement.className = 'invalid-feedback';
                element.parentElement.appendChild(errorElement);
            }
            errorElement.textContent = message;
        }
        
        // 清除表单验证错误
        function clearValidationErrors() {
            const form = document.getElementById('addWarningForm');
            const invalidFields = form.querySelectorAll('.is-invalid');
            invalidFields.forEach(field => {
                field.classList.remove('is-invalid');
                const errorElement = field.querySelector('.invalid-feedback');
                if (errorElement) {
                    errorElement.remove();
                }
            });
        }
        
        // 为添加预警模态框添加事件监听，自动设置当前时间
        document.getElementById('addWarningModal').addEventListener('show.bs.modal', function() {
            // 设置默认发布时间为当前时间
            const now = new Date();
            const isoString = now.toISOString().slice(0, 16); // 只保留到分钟
            document.getElementById('publish-time-add').value = isoString;
            loadStudents(document.getElementById('course-select-add')?.value || null);
        });
        
        // 通用函数：为教师端加载右上角用户下拉菜单，并执行组件内脚本
        async function loadUserDropdownForTeacher(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            try {
            const resp = await fetch('components/user-dropdown.html?v=20260523-1');
                if (!resp.ok) {
                    console.error('加载用户下拉组件失败:', resp.status, resp.statusText);
                    return;
                }

                const html = await resp.text();
                container.innerHTML = html;

                // 手动执行组件中的内联脚本，确保 UserDropdown 类可用
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const script = document.createElement('script');
                    if (oldScript.src) {
                        script.src = oldScript.src;
                    } else {
                        script.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(script);
                    oldScript.remove();
                });

                if (typeof UserDropdown !== 'undefined') {
                    new UserDropdown(containerId, 'teacher');
                } else {
                    console.error('UserDropdown 组件未定义，可能脚本未正确加载');
                }
            } catch (e) {
                console.error('加载用户下拉组件异常:', e);
            }
        }

        // 页面加载完成后初始化数据
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查用户是否已登录
            const isLoggedIn = await checkLogin();
            if (!isLoggedIn) {
                // 如果未登录，重定向到登录页面
                window.location.href = 'teacher-login.html';
                return;
            }

            // 加载右上角用户下拉菜单（教师端紫色主题）
            await loadUserDropdownForTeacher('userDropdownContainer');

            // 加载班级、课程和学生数据
            await loadClasses();
            await loadCourses();
            await loadStudents(document.getElementById('course-select-add')?.value || null);
            
            // 获取初始筛选条件
            const initialFilters = {
                classId: 'all',
                courseId: 'all',
                warningType: 'all',
                status: 'all'
            };
            
            // 先为四个下拉框设置初始值，确保它们不会触发change事件
            ['class-select', 'course-select', 'warning-type', 'warning-status'].forEach(selectId => {
                const selectElement = document.getElementById(selectId);
                selectElement.value = 'all';
            });
            
            // 加载统计数据
            await loadStats(initialFilters);
            
            // 加载预警列表
            await loadWarnings(1, initialFilters);
            
            // 初始化图表
            await initCharts();
            
            // 页面初始化完成后，再为四个下拉框添加change事件监听，实现实时查询
            // 这样可以确保下拉框的初始值不会触发change事件，避免重复加载数据
            setTimeout(() => {
                ['class-select', 'course-select', 'warning-type', 'warning-status'].forEach(selectId => {
                    const selectElement = document.getElementById(selectId);
                    selectElement.addEventListener('change', debouncedSearch);
                });

                const courseSelectAdd = document.getElementById('course-select-add');
                if (courseSelectAdd) {
                    courseSelectAdd.addEventListener('change', () => loadStudents(courseSelectAdd.value));
                }
            }, 100);
            
            // 筛选按钮点击事件（保留原有功能，用于手动触发查询）
            const searchButton = document.querySelector('.filter-actions .btn-primary');
            if (searchButton) {
                searchButton.addEventListener('click', performSearch);
            }
            
            // 重置筛选
            const resetButton = document.querySelector('.filter-actions .btn-secondary');
            if (resetButton) {
                resetButton.addEventListener('click', async function() {
                    const selects = ['class-select', 'course-select', 'warning-type', 'warning-status'];
                    selects.forEach(selectId => {
                        document.getElementById(selectId).value = 'all';
                    });
                    
                    // 重新加载所有预警数据
                    await performSearch();
                });
            }
            
            // 添加预警按钮点击事件
            const addWarningButton = document.querySelector('.table-actions button:nth-child(1)');
            if (addWarningButton) {
                addWarningButton.addEventListener('click', async function() {
                    // 打开添加预警模态框
                    const modal = new bootstrap.Modal(document.getElementById('addWarningModal'));
                    modal.show();
                    
                    // 重新加载学生数据，确保数据最新
                    await loadStudents(document.getElementById('course-select-add')?.value || null);
                });
            }
            
            // 导出Excel
            const exportButton = document.querySelector('.table-actions button:nth-child(2)');
            if (exportButton) {
                exportButton.addEventListener('click', exportToExcel);
            }
            
            // 刷新数据（先自动分析再刷新）
            const refreshButton = document.getElementById('refreshBtn');
            if (refreshButton) {
                refreshButton.addEventListener('click', refreshData);
            }
            
            // 保存预警按钮点击事件
            document.getElementById('saveWarningBtn').addEventListener('click', saveWarning);

            document.getElementById('markAsProcessingBtn').addEventListener('click', async function() {
                if (!currentWarningId) {
                    return;
                }
                await markAsProcessing(currentWarningId);
            });

            document.getElementById('markAsResolvedBtn').addEventListener('click', async function() {
                if (!currentWarningId) {
                    return;
                }
                await resolveWarning(currentWarningId);
            });
        });
    </script>
</body>
</html>
