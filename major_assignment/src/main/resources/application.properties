# 应用配置（基础共享层，非环境特定）
# 敏感字段均以 ${ENV_NAME:default} 形式外置，默认值仅用于本地开发便利启动（满足 R4.1）
# 具体覆盖：
#   - dev   ：沿用本文件中的默认回退值
#   - test  ：由 application-test.properties 覆盖为 ${ENV_NAME}（无默认）
#   - prod  ：由 application-prod.properties 覆盖为 ${ENV_NAME}（无默认）
spring.application.name=major_assignment
server.port=8080
spring.web.resources.add-mappings=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.service=${spring.application.name}

# 数据库配置（敏感字段外置 —— R4.1）
spring.datasource.url=jdbc:mysql://localhost:3306/major_assignment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com._202510007517.major_assignment.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 日志配置（详见 classpath:logback-spring.xml，Design §7.2 JSON 结构化日志 / R3.5）
logging.level.root=INFO
logging.level.com._202510007517.major_assignment=DEBUG
# 日志输出路径由 logback-spring.xml 读取此属性（默认 logs/major-assignment.log）
logging.file.name=logs/major-assignment.log

# Redis配置（敏感字段外置 —— R4.1）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-wait=3000ms
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

# 缓存配置
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=MAJOR_ASSIGNMENT:

# API文档配置 (Swagger/OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
