# dev Profile 覆盖配置（R4.3）
# 允许默认回退值，便于本地启动。敏感字段的实际值仍可通过环境变量覆盖。
# 未覆盖的键沿用 application.properties。

# 数据库凭证（默认回退 —— 仅限本地开发）
spring.datasource.username=${DB_USERNAME:dev_user}
spring.datasource.password=${DB_PASSWORD:dev_only_pwd}

# Redis 凭证（默认回退空字符串：本地 Redis 通常无密码）
spring.data.redis.password=${REDIS_PASSWORD:}
