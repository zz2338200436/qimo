spring:
  datasource:
    url: ${USER_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/sc_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
    username: ${USER_DB_USERNAME:${DB_USERNAME:root}}
    password: ${USER_DB_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${USER_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8082
