server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          enabled: true
          routes:
            - id: auth-route
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/login,/api/auth/refresh,/api/auth/captcha,/api/public/captcha
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    fallbackUri: forward:/_fallback/auth-service
            - id: auth-secured
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/me,/api/auth/logout,/api/auth/switch-role,/api/auth/change-password,/api/auth/notification-settings,/api/student/change-password
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    fallbackUri: forward:/_fallback/auth-service
            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/_fallback/user-service
            - id: student-profile-compatibility-route
              uri: lb://user-service
              predicates:
                - Path=/api/student/profile,/api/student/notification-settings,/api/student/privacy-settings,/api/student/upload-avatar,/api/student/export-data,/api/students/*/class
                - Method=GET,POST,PUT
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service-student-compatibility
                    fallbackUri: forward:/_fallback/user-service
            - id: course-route
              uri: lb://course-service
              predicates:
                - Path=/api/teacher/courses/**,/api/student/courses/**,/api/teacher/classes,/api/teacher/classes/**,/api/teacher/course-assignments,/api/teacher/course-assignments/**,/api/teacher/class-courses/**,/api/teacher/majors,/api/teacher/check-class-name,/api/teacher/students/**,/api/system/semesters,/api/system/student/courses,/api/system/teacher/courses,/api/system/time-ranges,/api/dashboard/student-performance,/api/dashboard/student-performance/*,/api/teacher/knowledge-points,/api/teacher/knowledge-points/*,/api/teacher/knowledge-points/course/*
              filters:
                - name: CircuitBreaker
                  args:
                    name: course-service
                    fallbackUri: forward:/_fallback/course-service
            - id: assignment-read-route
              uri: lb://assignment-service
              predicates:
                - Path=/api/teacher/assignments,/api/teacher/assignments/**
                - Method=GET
              filters:
                - name: CircuitBreaker
                  args:
                    name: assignment-service
                    fallbackUri: forward:/_fallback/assignment-service
            - id: assignment-write-route
              uri: lb://assignment-service
              predicates:
                - Path=/api/teacher/assignments,/api/teacher/assignments/**
                - Method=POST,PUT,DELETE
              filters:
                - name: CircuitBreaker
                  args:
                    name: assignment-service
                    fallbackUri: forward:/_fallback/assignment-service
            - id: teacher-submission-route
              uri: lb://assignment-service
              predicates:
                - Path=/api/teacher/submissions,/api/teacher/submissions/**
                - Method=GET,PUT
              filters:
                - name: CircuitBreaker
                  args:
                    name: assignment-service
                    fallbackUri: forward:/_fallback/assignment-service
            - id: student-assignment-read-route
              uri: lb://assignment-service
              predicates:
                - Path=/api/student/assignments,/api/student/assignments/**,/api/student/assignment-submissions
                - Method=GET
              filters:
                - name: CircuitBreaker
                  args:
                    name: assignment-service
                    fallbackUri: forward:/_fallback/assignment-service
            - id: student-assignment-submit-route
              uri: lb://assignment-service
              predicates:
                - Path=/api/student/assignments/*/submit
                - Method=POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: assignment-service
                    fallbackUri: forward:/_fallback/assignment-service
            - id: assignment-attachment-route
              uri: lb://assignment-service
              predicates:
                - Path=/api/attachments/assignment/**
                - Method=GET
              filters:
                - name: CircuitBreaker
                  args:
                    name: assignment-service-attachments
                    fallbackUri: forward:/_fallback/assignment-service
            - id: assignment-knowledge-route
              uri: lb://assignment-service
              predicates:
                - Path=/api/teacher/knowledge-points/assignment/**
                - Method=GET,POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: assignment-service-knowledge
                    fallbackUri: forward:/_fallback/assignment-service
            - id: student-exam-read-route
              uri: lb://exam-service
              predicates:
                - Path=/api/student/exams,/api/student/exams/**,/api/student/scores
                - Method=GET
              filters:
                - name: CircuitBreaker
                  args:
                    name: exam-service-student-read
                    fallbackUri: forward:/_fallback/exam-service
            - id: student-exam-submit-route
              uri: lb://exam-service
              predicates:
                - Path=/api/student/exams/*/submit
                - Method=POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: exam-service-student-submit
                    fallbackUri: forward:/_fallback/exam-service
            - id: teacher-exam-crud-route
              uri: lb://exam-service
              predicates:
                - Path=/api/teacher/exams,/api/teacher/exams/**
                - Method=GET,POST,PUT,DELETE
              filters:
                - name: CircuitBreaker
                  args:
                    name: exam-service-teacher
                    fallbackUri: forward:/_fallback/exam-service
            - id: exam-attachment-route
              uri: lb://exam-service
              predicates:
                - Path=/api/attachments/exam/**
                - Method=GET
              filters:
                - name: CircuitBreaker
                  args:
                    name: exam-service-attachments
                    fallbackUri: forward:/_fallback/exam-service
            - id: exam-knowledge-route
              uri: lb://exam-service
              predicates:
                - Path=/api/teacher/knowledge-points/exam/**
                - Method=GET,POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: exam-service-knowledge
                    fallbackUri: forward:/_fallback/exam-service
            - id: notification-route
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
                - Method=GET,POST,PUT,DELETE
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/_fallback/notification-service
            - id: analysis-route
              uri: lb://analysis-service
              predicates:
                - Path=/api/teacher/score-trend,/api/teacher/dashboard,/api/teacher/learning-summary,/api/teacher/analysis/**,/api/teacher/knowledge-points/mastery/student/*/course/*,/api/teacher/knowledge-points/stats/course/*,/api/knowledge-points/analysis/teacher/**,/api/early-warnings/**,/api/teacher/early-warnings/**,/api/student/early-warnings,/api/student/study-time-distribution,/api/student/stats,/api/student/knowledge-points,/api/student/knowledge-points/*
                - Method=GET,POST,PUT,DELETE
              filters:
                - name: CircuitBreaker
                  args:
                    name: analysis-service
                    fallbackUri: forward:/_fallback/analysis-service
            - id: knowledge-analysis-trigger-route
              uri: lb://analysis-service
              predicates:
                - Path=/api/teacher/knowledge-points/analyze/student/*/course/*
                - Method=POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: analysis-service-trigger
                    fallbackUri: forward:/_fallback/analysis-service
            - id: ai-route
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
                - Method=POST
              filters:
                - name: CircuitBreaker
                  args:
                    name: ai-service
                    fallbackUri: forward:/_fallback/ai-service
            - id: agent-stream-route
              uri: ${AGENT_SERVICE_URL:lb://agent-service}
              predicates:
                - Path=/api/agent/chat/stream
                - Method=POST
            - id: agent-route
              uri: ${AGENT_SERVICE_URL:lb://agent-service}
              predicates:
                - Path=/api/agent/**
                - Method=GET,POST,PUT,DELETE,PATCH
              filters:
                - name: CircuitBreaker
                  args:
                    name: agent-service
                    fallbackUri: forward:/_fallback/agent-service
            - id: frontend-static-route
              uri: ${LEGACY_FRONTEND_URL:${legacy.frontend-url:http://localhost:8090}}
              predicates:
                - Path=/,/index.html,/*.html,/*.js,/*.css,/*.svg,/lib/**,/components/**,/i18n/**,/fonts/**
                - Method=GET
              filters:
                - name: CircuitBreaker
                  args:
                    name: legacy-monolith-frontend
                    fallbackUri: forward:/_fallback/legacy-monolith

gateway:
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:5500
      - http://127.0.0.1:5500
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - X-Trace-Id
      - X-Captcha-Key
    allow-credentials: true
    max-age-seconds: 1800
  security:
    whitelist-paths:
      - /
      - /index.html
      - /student-
      - /teacher-
      - /styles.css
      - /api.js
      - /common-ui.js
      - /load-menu.js
      - /i18n.js
      - /agent-chat-panel.js
      - /agent-chat-panel.css
      - /agent-history-panel.js
      - /default-avatar.svg
      - /lib/
      - /components/
      - /i18n/
      - /fonts/
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/captcha
      - /api/public/captcha
      - /api/errors/browser
      - /api/errors/browser/batch
    jwt:
      clock-skew-seconds: 30
      jti-blacklist-prefix: "AUTH:JTI_BLACKLIST:"
  rate-limit:
    enabled: true
    replenish-rate: 20
    burst-capacity: 40
    requested-tokens: 1
    retry-after-seconds: 1
    routes:
      student-exam-submit-route:
        replenish-rate: 40
        burst-capacity: 80
        requested-tokens: 1
        retry-after-seconds: 1
      ai-route:
        replenish-rate: 2
        burst-capacity: 4
        requested-tokens: 1
        retry-after-seconds: 3
      agent-route:
        replenish-rate: 10
        burst-capacity: 20
        requested-tokens: 1
        retry-after-seconds: 2

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
    instances:
      agent-service:
        base-config: default
        slow-call-duration-threshold: 65s
      exam-service-student-submit:
        base-config: default
        failure-rate-threshold: 30
        minimum-number-of-calls: 20
  timelimiter:
    configs:
      default:
        timeout-duration: 15s
        cancel-running-future: false
    instances:
      agent-service:
        timeout-duration: 75s
        cancel-running-future: false
      exam-service-teacher:
        timeout-duration: 5s
        cancel-running-future: false
