eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
      application: ${spring.application.name:unknown-service}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

platform:
  outbox:
    relay:
      enabled: ${PLATFORM_OUTBOX_RELAY_ENABLED:false}
      batch-size: ${PLATFORM_OUTBOX_RELAY_BATCH_SIZE:100}
      fixed-delay: ${PLATFORM_OUTBOX_RELAY_FIXED_DELAY:5000}
      max-retries: ${PLATFORM_OUTBOX_RELAY_MAX_RETRIES:5}
      initial-backoff: ${PLATFORM_OUTBOX_RELAY_INITIAL_BACKOFF:5s}
      binding-name: ${PLATFORM_OUTBOX_RELAY_BINDING_NAME:domainEvents-out-0}
