server:
  port: 8085

spring:
  datasource:
    url: ${EXAM_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/sc_exam?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
    username: ${EXAM_DB_USERNAME:${DB_USERNAME:root}}
    password: ${EXAM_DB_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: ${EXAM_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

platform:
  outbox:
    relay:
      binding-name: ${EXAM_OUTBOX_BINDING_NAME:exam.finished}
