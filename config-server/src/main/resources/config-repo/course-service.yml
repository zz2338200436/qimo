spring:
  datasource:
    url: ${COURSE_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/sc_course?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
    username: ${COURSE_DB_USERNAME:${DB_USERNAME:root}}
    password: ${COURSE_DB_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${COURSE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8083
