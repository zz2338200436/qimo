server:
  port: 8084

spring:
  datasource:
    url: ${ASSIGNMENT_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/sc_assignment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
    username: ${ASSIGNMENT_DB_USERNAME:${DB_USERNAME:root}}
    password: ${ASSIGNMENT_DB_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${ASSIGNMENT_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

platform:
  outbox:
    relay:
      binding-name: ${ASSIGNMENT_OUTBOX_BINDING_NAME:assignment.submitted}
