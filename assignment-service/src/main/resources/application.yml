spring:
  application:
    name: assignment-service
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:classpath:application-common.yml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
  datasource:
    url: ${ASSIGNMENT_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/sc_assignment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
    username: ${ASSIGNMENT_DB_USERNAME:${DB_USERNAME:dev_user}}
    password: ${ASSIGNMENT_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${ASSIGNMENT_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8084

platform:
  outbox:
    relay:
      binding-name: ${ASSIGNMENT_OUTBOX_BINDING_NAME:assignment.submitted}

---
spring:
  config:
    activate:
      on-profile: test
    import:
      - optional:classpath:application-common.yml
  cloud:
    config:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: docker | prod
    import:
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:classpath:application-common.yml
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 5000
        multiplier: 1.5
