server:
  port: 8092

spring:
  application:
    name: agent-service
  profiles:
    default: dev

agent:
  llm:
    enabled: true
    provider: openai
    base-url: https://llm-w58gc8w0czrbs1oa.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api-key: ${API-KEY:}
    model-name: glm-5.1
    minimum-confidence: 0.7
    temperature: 0.0
    timeout-seconds: 60
  rag:
    enabled: ${AGENT_RAG_ENABLED:false}
    document-paths:
      - ${AGENT_RAG_DOCUMENT_PATH:docs/rag/system-platform-knowledge.md}
    embedding-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    max-chunks: ${AGENT_RAG_MAX_CHUNKS:4}
    min-score: ${AGENT_RAG_MIN_SCORE:0.0}
  question-bank:
    enabled: ${AGENT_QUESTION_BANK_ENABLED:false}
    document-paths:
      - ${AGENT_QUESTION_BANK_DOCUMENT_PATH:docs/question-bank/seeded}
    embedding-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    max-candidates: ${AGENT_QUESTION_BANK_MAX_CANDIDATES:50}
    min-score: ${AGENT_QUESTION_BANK_MIN_SCORE:0.15}
    allow-reload: ${AGENT_QUESTION_BANK_ALLOW_RELOAD:true}
  internet:
    enabled: ${AGENT_INTERNET_ENABLED:true}
    search-base-url: ${AGENT_INTERNET_SEARCH_BASE_URL:https://cn.bing.com/search}
    timeout-seconds: ${AGENT_INTERNET_TIMEOUT_SECONDS:5}
    max-results: ${AGENT_INTERNET_MAX_RESULTS:5}
    max-page-bytes: ${AGENT_INTERNET_MAX_PAGE_BYTES:200000}
    max-content-chars: ${AGENT_INTERNET_MAX_CONTENT_CHARS:4000}
    block-private-network: ${AGENT_INTERNET_BLOCK_PRIVATE_NETWORK:true}
    user-agent: ${AGENT_INTERNET_USER_AGENT:majorassignment-agent/1.0}
    allowed-domains: ${AGENT_INTERNET_ALLOWED_DOMAINS:}

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
agent:
  rag:
    enabled: ${AGENT_RAG_ENABLED:true}
  question-bank:
    enabled: ${AGENT_QUESTION_BANK_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: test
    import:
      - optional:classpath:application-common.yml
  cloud:
    config:
      enabled: false
agent:
  llm:
    enabled: false
  rag:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: docker | prod
    import:
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 5000
        multiplier: 1.5
