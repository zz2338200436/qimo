spring:
  application:
    name: gateway
  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:classpath:application-common.yml
  cloud:
    gateway:
      server:
        webflux:
          enabled: true
server:
  port: 8080

gateway:
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:5500
      - http://127.0.0.1:5500
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - X-Trace-Id
      - X-Captcha-Key
    allow-credentials: true
    max-age-seconds: 1800
  security:
    whitelist-paths:
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/captcha
      - /api/public/captcha
      - /api/errors/browser
      - /api/errors/browser/batch
    jwt:
      clock-skew-seconds: 30
      jti-blacklist-prefix: "AUTH:JTI_BLACKLIST:"

---
spring:
  config:
    activate:
      on-profile: test
    import:
      - optional:classpath:application-common.yml
  cloud:
    config:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: docker | prod
    import:
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}
      - optional:classpath:application-common.yml
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 5000
        multiplier: 1.5
