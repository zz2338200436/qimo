<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能后台学习辅助系统 - 教师登录</title>
    <link href="lib/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 32px;
            text-align: center;
        }
        .login-header i { font-size: 48px; margin-bottom: 16px; display: block; }
        .login-header h1 { font-size: 24px; font-weight: 700; margin: 0; }
        .login-header p { font-size: 14px; opacity: 0.9; margin-top: 8px; }
        .login-body { padding: 32px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .form-group input::placeholder { color: #94a3b8; }
        .captcha-group { display: flex; gap: 12px; align-items: flex-start; }
        .captcha-input { flex: 1; }
        .captcha-image { width: 120px; height: 58px; border-radius: 12px; overflow: hidden; border: 2px solid #e2e8f0; cursor: pointer; }
        .captcha-image img { width: 100%; height: 100%; object-fit: cover; }
        .remember-me { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
        .remember-me input[type="checkbox"] { width: 18px; height: 18px; accent-color: #3b82f6; }
        .remember-me label { font-size: 14px; color: #64748b; margin: 0; cursor: pointer; }
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4); }
        .login-btn:active { transform: translateY(0); }
        .login-footer { text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid #f1f5f9; }
        .login-footer p { font-size: 14px; color: #64748b; margin: 0; }
        .login-footer a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }
        .toggle-auth { margin-top: 16px; text-align: center; padding-bottom: 16px; }
        .toggle-auth a { color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: 500; }
        .toggle-auth a:hover { text-decoration: underline; }
        .language-switcher { text-align: center; padding: 12px 0 20px; border-top: 1px solid #f1f5f9; }
        .language-switcher .lang-btn { color: #64748b; text-decoration: none; font-size: 13px; padding: 4px 8px; border-radius: 4px; transition: all 0.2s ease; }
        .language-switcher .lang-btn:hover { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .language-switcher .lang-btn.active { color: #3b82f6; font-weight: 600; }
        .language-switcher .lang-divider { color: #cbd5e1; margin: 0 4px; }
        @media (max-width: 576px) {
            .login-container { border-radius: 16px; }
            .login-header, .login-body { padding: 24px; }
            .login-header i { font-size: 36px; }
            .login-header h1 { font-size: 20px; }
            .captcha-group { flex-direction: column; gap: 16px; }
            .captcha-image { width: 100%; height: 64px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fa fa-graduation-cap"></i>
            <h1 data-i18n="login.teacher.title">教师登录</h1>
            <p data-i18n="login.teacher.subtitle">智能后台学习辅助系统</p>
        </div>
        <div class="login-body">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" data-i18n="login.form.username">用户名</label>
                    <input type="text" id="username" data-i18n-placeholder="login.form.username_placeholder" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="login.form.password">密码</label>
                    <input type="password" id="password" data-i18n-placeholder="login.form.password_placeholder" placeholder="请输入密码" required>
                </div>
                <div class="form-group">
                    <label for="captcha" data-i18n="login.form.captcha">验证码</label>
                    <div class="captcha-group">
                        <input type="text" id="captcha" data-i18n-placeholder="login.form.captcha_placeholder" placeholder="请输入验证码" class="captcha-input" required>
                        <div class="captcha-image">
                            <img id="captchaImage" src="http://localhost:8080/api/auth/captcha" alt="验证码">
                        </div>
                    </div>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember" data-i18n="login.form.remember_me">记住我</label>
                </div>
                <button type="submit" class="login-btn" data-i18n="login.form.submit">登录</button>
                <div class="login-footer">
                    <p><span data-i18n="login.links.no_account">还没有账号？</span><a href="#" data-i18n="login.links.contact_admin">联系管理员</a></p>
                </div>
            </form>
        </div>
        <div class="toggle-auth">
            <p><span data-i18n="login.links.switch_to_student">您是学生？</span><a href="student-login.html" data-i18n="login.links.click_to_login">点击登录</a></p>
        </div>
        <div class="language-switcher">
            <a href="#" class="lang-btn active" data-lang="zh-CN">中文</a>
            <span class="lang-divider">|</span>
            <a href="#" class="lang-btn" data-lang="en-US">English</a>
            <span class="lang-divider">|</span>
            <a href="#" class="lang-btn" data-lang="ja-JP">日本語</a>
        </div>
    </div>
<script src="i18n.js?v=20260516-2"></script>
<script src="api.js?v=20260516-2"></script>

    <script>
        var teacherCaptchaKey = '';

        async function refreshTeacherCaptcha() {
            var captchaImage = document.getElementById('captchaImage');
            try {
                var response = await fetch('http://localhost:8080/api/auth/captcha?timestamp=' + Date.now(), {
                    credentials: 'include'
                });
                if (!response.ok) {
                    throw new Error('Failed to load captcha');
                }
                teacherCaptchaKey = response.headers.get('X-Captcha-Key') || '';
                var blob = await response.blob();
                captchaImage.src = URL.createObjectURL(blob);
            } catch (error) {
                console.error('Captcha load error:', error);
                captchaImage.removeAttribute('src');
                alert(I18nManager.t('login.errors.request_failed'));
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            await I18nManager.init();
            I18nManager.bindLanguageSwitcher();
            var captchaImage = document.getElementById('captchaImage');
            captchaImage.addEventListener('click', refreshTeacherCaptcha);
            await refreshTeacherCaptcha();
            
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                var username = document.getElementById('username').value;
                var password = document.getElementById('password').value;
                var captcha = document.getElementById('captcha').value;
                
                var loginBtn = this.querySelector('.login-btn');
                var originalText = loginBtn.innerHTML;
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> ' + I18nManager.t('login.form.submitting');
                
                try {
                    if (window.clearAuthSession) {
                        window.clearAuthSession();
                    }
                    var result = await window.authAPI.login(username, password, captcha, teacherCaptchaKey);
                    if (!result || result.success === false) {
                        alert(result && result.message ? result.message : I18nManager.t('login.errors.request_failed'));
                        await refreshTeacherCaptcha();
                        return;
                    }
                    if (!result.data) {
                        alert(I18nManager.t('login.errors.no_user_info'));
                        await refreshTeacherCaptcha();
                        return;
                    }
                    if (window.persistAuthSession) {
                        window.persistAuthSession(result.data);
                    }
                    if (result.data.user && result.data.user.roles && result.data.user.roles.length) {
                        var hasTeacherRole = result.data.user.roles.some(function(role) {
                            return role === 'TEACHER';
                        });
                        if (hasTeacherRole) {
                            window.location.href = 'teacher-dashboard.html?v=20260516-2';
                        } else {
                            alert(I18nManager.t('login.errors.not_teacher'));
                            await refreshTeacherCaptcha();
                        }
                    } else {
                        alert(I18nManager.t('login.errors.no_role_info'));
                        await refreshTeacherCaptcha();
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    alert(error.message || I18nManager.t('login.errors.invalid_credentials'));
                    await refreshTeacherCaptcha();
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = I18nManager.t('login.form.submit');
                }
            });
        });
    </script>
</body>
</html>
