<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能后台学习辅助系统</title>
    <!-- Bootstrap 5 CDN -->
    <link href="lib/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link href="lib/font-awesome.min.css" rel="stylesheet">
    <!-- Google Fonts -->
        <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .welcome-container {
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        
        .welcome-icon {
            font-size: 80px;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        .welcome-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
        }
        
        .login-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .login-btn {
            flex: 1;
            min-width: 200px;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .student-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
        }
        
        .student-btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        
        .teacher-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .teacher-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }
        
        .login-btn i {
            margin-right: 8px;
        }
        
        @media (max-width: 576px) {
            .login-buttons {
                flex-direction: column;
            }
            
            .welcome-title {
                font-size: 24px;
            }
            
            .welcome-container {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <i class="fa fa-graduation-cap welcome-icon"></i>
        <h1 class="welcome-title">智能后台学习辅助系统</h1>
        <p class="welcome-subtitle">欢迎使用智能后台学习辅助系统，请选择您的身份登录</p>
        
        <div class="login-buttons">
            <a href="student-login.html" class="login-btn student-btn">
                <i class="fa fa-user-circle-o"></i> 学生登录
            </a>
            <a href="teacher-login.html?v=20260523-1" class="login-btn teacher-btn">
                <i class="fa fa-user-md"></i> 教师登录
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="lib/bootstrap.bundle.min.js"></script>
    <script>
        (function redirectLoggedInUser() {
            try {
                const user = JSON.parse(sessionStorage.getItem('user') || 'null');
                if (user?.roles?.includes('TEACHER')) {
                    window.location.href = 'teacher-dashboard.html?v=20260523-1';
                    return;
                }
                if (user?.roles?.includes('STUDENT')) {
                    window.location.href = 'student-dashboard.html';
                }
            } catch (error) {
                console.warn('Auto redirect skipped:', error);
            }
        })();
    </script>
</body>
</html>
