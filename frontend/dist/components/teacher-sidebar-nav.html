<!-- 侧边栏导航组件 -->
<!-- Font Awesome CDN - 使用v5+版本 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

<style>
    /* 侧边栏样式统一 */
    .sidebar {
        width: 280px;
        height: 100vh;
        background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        color: white;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        overflow-y: auto;
        transition: width 0.3s ease;
    }

    .sidebar.collapsed {
        width: 80px;
    }

    .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-logo {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .sidebar-logo i {
        font-size: 28px;
    }

    .sidebar-logo span {
        font-size: 18px;
        font-weight: 700;
    }

    .sidebar-menu {
        padding: 20px 0;
    }

    .menu-item {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        transition: all 0.3s ease;
        border-left: 3px solid transparent;
        font-size: 16px;
        line-height: 1;
        margin: 0;
    }

    .menu-item:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border-left-color: white;
    }

    .menu-item.active {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border-left-color: white;
    }

    .menu-item i {
        width: 30px;
        margin-right: 10px;
        text-align: center;
        font-size: 1.2rem;
    }

    /* 折叠状态样式 */
    .sidebar.collapsed .sidebar-logo span {
        display: none;
    }

    .sidebar.collapsed .menu-item span {
        display: none;
    }

    .sidebar.collapsed .menu-item i {
        margin-right: 0;
    }

    /* 主内容区样式 */
    .main-content {
        margin-left: 280px;
        transition: margin-left 0.3s ease;
    }

    .sidebar.collapsed + .main-content {
        margin-left: 80px;
    }

    /* 响应式布局 - 移动端优化 */
    @media (max-width: 768px) {
        .sidebar {
            transform: translateX(-280px);
        }
        
        .sidebar.collapsed {
            transform: translateX(0);
            width: 100%;
        }
        
        .main-content {
            margin-left: 0;
        }
        
        .sidebar.collapsed + .main-content {
            margin-left: 0;
        }
    }
</style>

<!-- 侧边栏导航HTML结构 -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">
            <i class="fa fa-graduation-cap"></i>
            <span>智能学习系统</span>
        </div>
    </div>
    
    <nav class="sidebar-menu">
        <a href="teacher-dashboard.html" class="menu-item" id="nav-dashboard">
            <i class="fas fa-tachometer-alt"></i>
            <span>仪表盘</span>
        </a>
        <a href="teacher-courses.html" class="menu-item" id="nav-courses">
            <i class="fas fa-book"></i>
            <span>课程管理</span>
        </a>
        <a href="teacher-assignments.html" class="menu-item" id="nav-assignments">
            <i class="fas fa-file-alt"></i>
            <span>教学任务</span>
        </a>
        <a href="teacher-student-dashboard.html" class="menu-item" id="nav-student-dashboard">
            <i class="fas fa-chart-bar"></i>
            <span>学习数据</span>
        </a>
        <a href="teacher-warning.html" class="menu-item" id="nav-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <span>学情预警</span>
        </a>
        <a href="teacher-knowledge.html" class="menu-item" id="nav-knowledge">
            <i class="fas fa-lightbulb"></i>
            <span>知识点分析</span>
        </a>
        <a href="teacher-ai-tools.html" class="menu-item" id="nav-ai-tools">
            <i class="fas fa-robot"></i>
            <span>AI辅助工具</span>
        </a>
        <a href="teacher-settings.html" class="menu-item" id="nav-settings">
            <i class="fas fa-cog"></i>
            <span>系统设置</span>
        </a>
    </nav>
</aside>

<script>
    // 侧边栏折叠/展开功能
    function initSidebar() {
        // 延迟执行，确保DOM已完全加载
        setTimeout(() => {
            const toggleBtn = document.getElementById('toggleBtn') || document.querySelector('.toggle-btn');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            
            if (toggleBtn && sidebar && mainContent) {
                // 先移除可能存在的事件监听器，避免重复绑定
                toggleBtn.removeEventListener('click', toggleSidebar);
                
                // 添加事件监听器
                toggleBtn.addEventListener('click', toggleSidebar);
            } else {
                console.warn('侧边栏相关元素未找到，稍后重试...');
                // 1秒后重试
                setTimeout(initSidebar, 1000);
            }
            
            // 高亮当前活跃的导航项
            highlightActiveNavItem();
        }, 100);
    }
    
    // 侧边栏折叠/展开函数
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        if (sidebar && mainContent) {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('collapsed');
        }
    }
    
    // 高亮当前活跃的导航项
    function highlightActiveNavItem() {
        const currentUrl = window.location.href;
        const menuItems = document.querySelectorAll('.menu-item');
        
        menuItems.forEach(item => {
            item.classList.remove('active');
            const itemUrl = item.getAttribute('href');
            if (currentUrl.endsWith(itemUrl) || currentUrl.includes(itemUrl.replace('.html', ''))) {
                item.classList.add('active');
            }
        });
    }
    
    // 确保函数能在组件动态加载后被调用
    window.initSidebar = initSidebar;
    window.highlightActiveNavItem = highlightActiveNavItem;
    
    // 组件加载完成后自动执行初始化
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSidebar);
    } else {
        initSidebar();
    }
</script>
