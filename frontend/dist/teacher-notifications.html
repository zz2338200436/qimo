<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能学习系统 - 老师通知管理</title>
    <!-- Bootstrap 5 CSS -->
    <link href="lib/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link href="lib/font-awesome.min.css" rel="stylesheet">
    <!-- Google Fonts -->
        <!-- 全局样式文件 -->
    <link href="styles.css?v=20260608-pagination-1" rel="stylesheet">
    <!-- API服务文件 -->
    <script src="api.js?v=20260608-theme-4"></script>
    <script src="common-ui.js?v=20260628-sidebar-shell-1"></script>
</head>
<body class="teacher-shell-body">
<!-- 侧边栏导航组件 -->
<div id="sidebar-container"></div>
<script>
    CommonUI.loadTeacherSidebar('sidebar-container')
        .then(() => CommonUI.bindSidebarToggle('toggleBtn'))
        .catch(error => console.error('加载侧边栏组件失败:', error));
</script>

<!-- 主内容区 -->
<main class="main-content teacher-shell-main" id="mainContent">
    <!-- 顶部导航栏 -->
    <nav class="top-navbar teacher-topbar">
        <div class="navbar-left">
            <button class="toggle-btn" id="toggleBtn">
                <i class="fa fa-bars"></i>
            </button>
            <h1 class="page-title">通知管理</h1>
        </div>
        
        <div class="navbar-right">
            <!-- 用户下拉菜单组件（教师端蓝色主题） -->
            <div id="userDropdownContainer"></div>
        </div>
    </nav>
    
    <!-- 内容容器 -->
    <div class="content-container teacher-content">
        <!-- 通知管理卡片 -->
        <div class="card shadow-sm mb-4 teacher-panel">
            <div class="card-header bg-white py-3">
                <h3 class="card-title mb-0">发送通知</h3>
            </div>
            <div class="card-body">
                <form id="notificationForm" class="needs-validation" novalidate>
                    <div class="row g-4">
                        <!-- 通知类型 -->
                        <div class="col-md-6">
                            <label for="notificationType" class="form-label">通知类型 <span class="text-danger">*</span></label>
                            <select class="form-select" id="notificationType" name="type" required>
                                <option value="">请选择通知类型</option>
                                <option value="system">系统通知</option>
                                <option value="course">课程通知</option>
                                <option value="assignment">作业通知</option>
                                <option value="exam">考试通知</option>
                            </select>
                            <div class="invalid-feedback">请选择通知类型</div>
                        </div>
                        
                        <!-- 通知标题 -->
                        <div class="col-md-6">
                            <label for="notificationTitle" class="form-label">通知标题 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="notificationTitle" name="title" placeholder="请输入通知标题" required>
                            <div class="invalid-feedback">请输入通知标题</div>
                        </div>
                        
                        <!-- 通知内容 -->
                        <div class="col-12">
                            <label for="notificationContent" class="form-label">通知内容 <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="notificationContent" name="content" rows="5" placeholder="请输入通知内容" required></textarea>
                            <div class="invalid-feedback">请输入通知内容</div>
                        </div>
                        
                        <!-- 学生选择 -->
                        <div class="col-12">
                            <label for="studentId" class="form-label">接收学生 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="studentId" name="studentId" placeholder="请输入学生ID" required>
                            <div class="invalid-feedback">请输入学生ID</div>
                        </div>
                        
                        <!-- 操作按钮 -->
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="fa fa-paper-plane"></i> 发送通知
                            </button>
                            <button type="reset" class="btn btn-secondary">
                                <i class="fa fa-refresh"></i> 重置
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- 通知历史 -->
        <div class="card shadow-sm teacher-panel">
            <div class="card-header bg-white py-3">
                <h3 class="card-title mb-0">通知历史</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>类型</th>
                                <th>标题</th>
                                <th>接收学生</th>
                                <th>发送时间</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="notificationHistory">
                            <!-- 通知历史将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap 5 JS -->
<script src="lib/bootstrap.bundle.min.js"></script>
<script>
    const LOCAL_NOTIFICATION_HISTORY_KEY = 'teacherNotificationHistory';

    // 通用函数：为教师端加载右上角用户下拉菜单，并执行组件内脚本
    async function loadUserDropdownForTeacher(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        try {
            const resp = await fetch('components/user-dropdown.html?v=20260608-theme-4');
            if (!resp.ok) {
                console.error('加载用户下拉组件失败:', resp.status, resp.statusText);
                return;
            }

            const html = await resp.text();
            container.innerHTML = html;

            // 手动执行组件中的内联脚本，确保 UserDropdown 类可用
            const scripts = container.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const script = document.createElement('script');
                if (oldScript.src) {
                    script.src = oldScript.src;
                } else {
                    script.textContent = oldScript.textContent;
                }
                document.body.appendChild(script);
                oldScript.remove();
            });

            if (typeof UserDropdown !== 'undefined') {
                new UserDropdown(containerId, 'teacher');
            } else {
                console.error('UserDropdown 组件未定义，可能脚本未正确加载');
            }
        } catch (e) {
            console.error('加载用户下拉组件异常:', e);
        }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', async function() {
        const user = sessionStorage.getItem('user');
        const token = sessionStorage.getItem('token');
        if (!user || !token) {
            window.location.href = 'teacher-login.html?v=20260608-theme-4';
            return;
        }

        // 加载右上角用户下拉菜单（教师端蓝色主题）
        await loadUserDropdownForTeacher('userDropdownContainer');

        // 初始化通知表单
        initNotificationForm();
        await loadNotificationHistory();
    });

    function getLocalNotificationHistory() {
        try {
            const raw = localStorage.getItem(LOCAL_NOTIFICATION_HISTORY_KEY);
            const history = raw ? JSON.parse(raw) : [];
            return Array.isArray(history) ? history : [];
        } catch (error) {
            console.warn('读取本地通知历史失败:', error);
            return [];
        }
    }

    function saveLocalNotificationHistory(history) {
        try {
            localStorage.setItem(LOCAL_NOTIFICATION_HISTORY_KEY, JSON.stringify(history.slice(0, 20)));
        } catch (error) {
            console.warn('保存本地通知历史失败:', error);
        }
    }

    function appendLocalNotificationHistory(record) {
        const history = getLocalNotificationHistory();
        history.unshift(record);
        saveLocalNotificationHistory(history);
    }

    function extractNotificationHistoryList(response) {
        const data = response && response.data ? response.data : response;
        if (Array.isArray(data)) {
            return data;
        }
        if (Array.isArray(data?.notifications)) {
            return data.notifications;
        }
        if (Array.isArray(data?.content)) {
            return data.content;
        }
        if (Array.isArray(data?.items)) {
            return data.items;
        }
        return [];
    }

    function formatNotificationHistoryRecord(record) {
        return {
            id: record.id || `local-${Date.now()}`,
            typeLabel: record.typeLabel || getNotificationTypeLabel(record.type),
            title: record.title || '未命名通知',
            studentId: record.studentId || record.student_id || '-',
            sentAt: new Date(
                record.sentAt ||
                record.createTime ||
                record.createdAt ||
                record.created_at ||
                Date.now()
            ).toLocaleString()
        };
    }

    async function loadNotificationHistory() {
        try {
            const apiService = new APIService();
            const teacherAPI = new TeacherAPI(apiService);
            const response = await teacherAPI.getSentNotifications(1, 20, 'all');
            if (response && response.success) {
                const remoteHistory = extractNotificationHistoryList(response)
                    .map(formatNotificationHistoryRecord);
                if (remoteHistory.length > 0) {
                    saveLocalNotificationHistory(remoteHistory);
                }
            }
        } catch (error) {
            console.warn('加载教师已发送通知失败，使用本地历史:', error);
        }

        renderNotificationHistory();
    }

    function renderNotificationHistory() {
        const historyBody = document.getElementById('notificationHistory');
        if (!historyBody) {
            return;
        }

        const history = getLocalNotificationHistory();
        if (!history.length) {
            historyBody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-muted">暂无已发送通知记录。发送成功后的通知会显示在这里，便于您回看最近操作。</td>
                </tr>
            `;
            return;
        }

        historyBody.innerHTML = history.map(item => `
            <tr>
                <td>${item.id}</td>
                <td>${item.typeLabel}</td>
                <td>${item.title}</td>
                <td>${item.studentId}</td>
                <td>${item.sentAt}</td>
                <td><span class="badge bg-success">已发送</span></td>
            </tr>
        `).join('');
    }

    function getNotificationTypeLabel(type) {
        const typeMap = {
            system: '系统通知',
            course: '课程通知',
            assignment: '作业通知',
            exam: '考试通知'
        };
        return typeMap[type] || type || '未知类型';
    }
    
    // 初始化通知表单
    function initNotificationForm() {
        const form = document.getElementById('notificationForm');
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 验证表单
            if (!form.checkValidity()) {
                e.stopPropagation();
                form.classList.add('was-validated');
                return;
            }
            
            // 获取表单数据
            const formData = new FormData(form);
            const notificationData = {
                type: formData.get('type'),
                title: formData.get('title'),
                content: formData.get('content'),
                studentId: parseInt(formData.get('studentId')),
                relatedId: null,
                isRead: false
            };
            
            const submitBtn = form.querySelector('button[type="submit"]');
            try {
                // 显示加载状态
                submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 发送中...';
                submitBtn.disabled = true;
                
                // 调用API发送通知
                const apiService = new APIService();
                const teacherAPI = new TeacherAPI(apiService);
                const response = await teacherAPI.sendNotification(notificationData);
                
                if (response && response.success) {
                    const responseRecord = (typeof extractTeacherSingleRecord === 'function'
                        ? extractTeacherSingleRecord(response)
                        : null) || {};
                    appendLocalNotificationHistory({
                        id: responseRecord.id || `local-${Date.now()}`,
                        typeLabel: getNotificationTypeLabel(notificationData.type),
                        title: responseRecord.title || notificationData.title,
                        studentId: responseRecord.studentId || notificationData.studentId,
                        sentAt: new Date(
                            responseRecord.sentAt ||
                            responseRecord.createTime ||
                            responseRecord.createdAt ||
                            Date.now()
                        ).toLocaleString()
                    });

                    // 显示成功消息
                    showNotification('通知发送成功', 'success');
                    // 重置表单
                    form.reset();
                    form.classList.remove('was-validated');
                    await loadNotificationHistory();
                } else {
                    throw new Error(response?.message || '发送通知失败');
                }
            } catch (error) {
                console.error('发送通知失败:', error);
                showNotification(error.message || '发送通知失败，请稍后重试', 'danger');
            } finally {
                // 恢复按钮状态
                submitBtn.innerHTML = '<i class="fa fa-paper-plane"></i> 发送通知';
                submitBtn.disabled = false;
            }
        });
    }
    
    // 显示通知
    function showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.className = `notification ${type}-notification`;
        notification.innerHTML = `
            <div class="notification-content">
                <i class="fa fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            </div>
            <button class="notification-close" onclick="this.parentElement.remove()">
                <i class="fa fa-times"></i>
            </button>
        `;
        document.body.appendChild(notification);
        
        // 3秒后自动关闭
        setTimeout(() => {
            if (notification.parentElement) {
                notification.remove();
            }
        }, 3000);
    }
</script>
</body>
</html>
