<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习数据 - 智能学习辅助系统</title>
    <link href="lib/bootstrap.min.css" rel="stylesheet">
    <link href="lib/font-awesome.min.css" rel="stylesheet">
    <!-- jQuery -->
    <script src="lib/jquery-3.6.0.min.js"></script>
    <!-- Chart.js -->
    <script src="lib/chart.umd.min.js"></script>
    <!-- 全局样式文件 -->
    <link href="styles.css?v=20260523-1" rel="stylesheet">
    <link rel="icon" href="data:,">
    <style>
        /* 页面优化样式 */
        .content-container {
            padding: 24px;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%);
            min-height: calc(100vh - 80px);
        }

        /* 筛选区域优化 */
        .filter-section {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
            border: none;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 180px;
            flex: 1;
        }

        .filter-group label {
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .filter-group .form-select {
            border-radius: 10px;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            background: white;
        }

        .filter-group .form-select:focus {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }

        .filter-actions {
            display: flex;
            gap: 12px;
            margin-left: auto;
            align-items: flex-end;
        }

        .filter-actions .btn {
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: none;
        }

        .filter-actions .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .filter-actions .btn-primary {
            background: white;
            color: #3b82f6;
        }

        .filter-actions .btn-outline-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .filter-actions .btn-outline-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        /* 统计卡片优化 */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .stat-title {
            font-size: 15px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .stat-change {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            min-height: 20px;
        }

        .stat-change.positive {
            color: #10b981;
        }

        .stat-change.negative {
            color: #ef4444;
        }

        .stat-change i {
            font-size: 12px;
        }

        /* 图表区域优化 */
        .chart-section {
            background: white;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .chart-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chart-actions {
            display: flex;
            gap: 8px;
        }

        .chart-action-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            background: white;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chart-action-btn:hover {
            border-color: #3b82f6;
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .chart-action-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border-color: transparent;
        }

        .chart-container {
            height: 350px;
            position: relative;
        }

        /* 知识点区域优化 */
        .knowledge-section {
            background: white;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .knowledge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .knowledge-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .knowledge-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .knowledge-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .knowledge-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }

        .knowledge-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .knowledge-item-name {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin: 0;
        }

        .knowledge-item-mastery {
            font-size: 18px;
            font-weight: 700;
            color: #3b82f6;
        }

        .mastery-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .mastery-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .mastery-fill.excellent {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
        }

        .mastery-fill.good {
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
        }

        .mastery-fill.needs-improvement {
            background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
        }

        .mastery-details {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #64748b;
        }

        /* 学习计划区域优化 */
        .plan-section {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
        }

        .plan-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .plan-progress {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .progress-circle {
            position: relative;
            width: 120px;
            height: 120px;
            flex-shrink: 0;
        }

        .progress-circle svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-circle-circle {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 8;
        }

        .progress-circle-progress {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
            stroke-dasharray: 282.743; /* 2 * π * 45 */
            stroke-dashoffset: 282.743; /* 初始状态为0% */
        }

        .progress-circle-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .progress-circle-percentage {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
        }

        .progress-circle-label {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .plan-details {
            flex: 1;
        }

        .plan-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .plan-item:hover {
            background: #f1f5f9;
            transform: translateX(4px);
        }

        .plan-item-name {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
        }

        .plan-item-status {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .plan-item-status.completed {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .plan-item-status.in-progress {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .plan-item-status.pending {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        /* 加载状态 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            z-index: 10;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .content-container {
                padding: 16px;
            }

            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                min-width: 100%;
            }

            .filter-actions {
                margin-left: 0;
                width: 100%;
                margin-top: 12px;
            }

            .filter-actions .btn {
                flex: 1;
            }

            .stats-cards {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .chart-container {
                height: 250px;
            }

            .chart-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .chart-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .knowledge-list {
                grid-template-columns: 1fr;
            }

            .plan-progress {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }

            .progress-circle {
                margin: 0 auto;
            }

            .knowledge-header,
            .plan-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
    
    <!-- 全局函数定义 - 必须在页面加载前定义，以便被onclick属性访问 -->
    <script>
        // 高亮当前导航项
        function highlightActiveNavItem() {
            CommonUI.highlightActiveNavItem({ selector: '.sidebar .menu-item, .menu-item' });
        }
        
        // 侧边栏折叠/展开功能
        window.toggleSidebar = function() {
            return CommonUI.toggleSidebar();
        }
        
        // 初始化侧边栏状态
        function initializeSidebar() {
            CommonUI.initializeSidebar();
        }
    </script>
</head>
<body>
    <!-- 侧边栏组件容器 -->
    <div id="sidebar-container"></div>
    
    <!-- 加载侧边栏组件 -->
    <script>
        $(function() {
        $('#sidebar-container').load('components/sidebar-nav.html?v=20260523-1', function() {
                highlightActiveNavItem();
                // 初始化侧边栏状态
                setTimeout(initializeSidebar, 100); // 延迟执行，确保侧边栏已经加载
                
                // 侧边栏切换按钮事件监听
                const toggleSidebarBtn = document.getElementById('toggleSidebar');
                if (toggleSidebarBtn) {
                    toggleSidebarBtn.addEventListener('click', toggleSidebar);
                }
            });
        });
    </script>
    
    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
        <!-- 顶部导航栏 -->
        <header class="top-navbar">
            <div class="navbar-left">
                <button class="toggle-btn" id="toggleSidebar" aria-label="切换侧边栏" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="student-dashboard.html">首页</a></li>
                        <li class="breadcrumb-item active" aria-current="page">学习数据</li>
                    </ol>
                </nav>
            </div>
            <div class="navbar-right">
                <div id="userDropdownContainer"></div>
            </div>
        </header>
        
        <!-- 内容区域 -->
        <div class="content-container">
            <!-- 筛选区域 -->
            <div class="filter-section">
                <div class="filter-group">
                    <label for="semester">学期</label>
                    <select id="semester" class="form-select">
                        <option value="">全部学期</option>
                        <!-- 学期选项将通过JavaScript动态加载 -->
                    </select>
                </div>
                <div class="filter-group">
                    <label for="course">课程</label>
                    <select id="course" class="form-select">
                        <option value="all">全部课程</option>
                        <!-- 课程选项将通过JavaScript动态加载 -->
                    </select>
                </div>
                <div class="filter-group">
                    <label for="time-range">时间范围</label>
                    <select id="time-range" class="form-select">
                        <option value="week">最近一周</option>
                        <option value="month" selected>最近一个月</option>
                        <option value="quarter">最近三个月</option>
                        <option value="semester">本学期</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-outline-secondary" onclick="resetFilters()" aria-label="重置筛选条件">
                        <i class="fa fa-refresh"></i> 重置
                    </button>
                    <button class="btn btn-primary" onclick="applyFilters()" aria-label="应用筛选条件">
                        <i class="fa fa-filter"></i> 应用筛选
                    </button>
                </div>
            </div>
            
            <!-- 统计卡片 -->
            <div class="stats-cards" id="statsCards">
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">学习时长</span>
                        <div class="stat-icon courses">
                            <i class="fa fa-clock-o"></i>
                        </div>
                    </div>
                    <div class="stat-value" id="studyTime">0h</div>
                    <div class="stat-change" id="studyTimeMeta">
                        <span style="color: #64748b;">当前筛选学习时长</span>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">完成任务数</span>
                        <div class="stat-icon assignments">
                            <i class="fa fa-check-circle-o"></i>
                        </div>
                    </div>
                    <div class="stat-value" id="completedTasks">0</div>
                    <div class="stat-change" id="completedTasksMeta">
                        <span style="color: #64748b;">当前筛选完成任务数</span>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">平均成绩</span>
                        <div class="stat-icon exams">
                            <i class="fa fa-star"></i>
                        </div>
                    </div>
                    <div class="stat-value" id="averageScore">0.0</div>
                    <div class="stat-change" id="averageScoreMeta">
                        <span style="color: #64748b;">当前筛选平均成绩</span>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-header">
                        <span class="stat-title">知识点掌握</span>
                        <div class="stat-icon progress">
                            <i class="fa fa-lightbulb-o"></i>
                        </div>
                    </div>
                    <div class="stat-value" id="knowledgeMastery">0.0%</div>
                    <div class="stat-change" id="knowledgeMasteryMeta">
                        <span style="color: #64748b;">当前筛选知识点掌握</span>
                    </div>
                </div>
            </div>
            
            <!-- 成绩趋势图表 -->
            <div class="chart-section">
                <div class="chart-header">
                    <h3 class="chart-title"><i class="fa fa-line-chart" style="margin-right: 10px; color: #0d6efd;"></i>成绩趋势</h3>
                    <div class="chart-actions">
                        <button class="chart-action-btn active" onclick="changeScoreChartType('line', this)" aria-label="切换到折线图">
                            <i class="fa fa-line-chart"></i> 折线图
                        </button>
                        <button class="chart-action-btn" onclick="changeScoreChartType('bar', this)" aria-label="切换到柱状图">
                            <i class="fa fa-bar-chart"></i> 柱状图
                        </button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>
            
            <!-- 学习时长统计 -->
            <div class="chart-section">
                <div class="chart-header">
                    <h3 class="chart-title"><i class="fa fa-clock-o" style="margin-right: 10px; color: #198754;"></i>学习时长统计</h3>
                    <div class="chart-actions">
                        <button class="chart-action-btn" onclick="changeTimeChartType('daily', this)" aria-label="切换到每日视图">
                            <i class="fa fa-calendar"></i> 每日
                        </button>
                        <button class="chart-action-btn active" onclick="changeTimeChartType('weekly', this)" aria-label="切换到每周视图">
                            <i class="fa fa-calendar-check-o"></i> 每周
                        </button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="studyTimeChart"></canvas>
                </div>
            </div>
            
            <!-- 知识点掌握情况 -->
            <div class="knowledge-section">
                <div class="knowledge-header">
                    <h3 class="knowledge-title"><i class="fa fa-lightbulb-o" style="margin-right: 10px; color: #dc3545;"></i>知识点掌握情况</h3>
                    <button class="btn btn-outline-secondary btn-sm" onclick="refreshKnowledgeData()" aria-label="刷新知识点数据">
                        <i class="fa fa-refresh"></i> 刷新
                    </button>
                </div>
                <div class="knowledge-list" id="knowledgeList">
                    <!-- 知识点列表将通过JavaScript动态生成 -->
                    <div class="text-center py-5">
                        <i class="fa fa-spinner fa-spin" style="font-size: 24px; color: #0d6efd;"></i>
                        <p class="mt-2">加载知识点数据中...</p>
                    </div>
                </div>
            </div>
            
            <!-- 学习计划完成情况 -->
            <div class="plan-section">
                <div class="plan-header">
                    <h3 class="plan-title"><i class="fa fa-list-alt" style="margin-right: 10px; color: #198754;"></i>学习计划完成情况</h3>
                    <button class="btn btn-outline-secondary btn-sm" onclick="viewFullPlan()" aria-label="查看完整学习计划">
                        <i class="fa fa-eye"></i> 查看完整计划
                    </button>
                </div>
                <div class="plan-progress">
                    <div class="progress-circle">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                            <defs>
                                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <circle class="progress-circle-circle" cx="60" cy="60" r="45"></circle>
                            <circle class="progress-circle-progress" cx="60" cy="60" r="45"></circle>
                        </svg>
                        <div class="progress-circle-text">
                            <div class="progress-circle-percentage" id="planCompletion">0%</div>
                            <div class="progress-circle-label">完成率</div>
                        </div>
                    </div>
                    <div class="plan-details" id="planDetails">

                semesterSelect.innerHTML = '<option value="">全部学期</option>';
                const currentYear = new Date().getFullYear();
                const semesters = [];
                for (let year = currentYear - 2; year <= currentYear + 1; year++) {

                    semesters.push(`${year}-秋`);
                }

        // 从API获取成绩趋势数据
        async function fetchScoreTrend(filters = {}) {
            try {
                // 构建查询参数
                const params = {};
                if (filters.semester) params.semester = filters.semester;
                if (filters.course && filters.course !== 'all') params.courseId = filters.course;
                if (filters.timeRange) params.timeRange = filters.timeRange;
                
                // 获取真实成绩数据而不是进度数据
                const scoresResponse = await apiService.get('/api/student/scores', params);
                console.log('获取成绩数据:', scoresResponse);
                
                if (scoresResponse && scoresResponse.success && scoresResponse.data) {
                    // 处理成绩数据，按时间排序并提取分数
                    const scores = Array.isArray(scoresResponse.data) ? scoresResponse.data : [];
                    
                    // 按提交日期分组并计算平均分（按周或按月，根据timeRange）
                    const scoreMap = new Map();
                    scores.forEach(score => {
                        if (score.score && score.submitDate) {
                            try {
                                const date = new Date(score.submitDate);
                                let key;
                                
                                // 根据时间范围选择分组方式
                                if (filters.timeRange === 'week') {
                                    // 按天分组
                                    key = date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
                                } else if (filters.timeRange === 'quarter') {
                                    // 按月分组
                                    key = date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short' });
                                } else {
                                    // 默认按周分组
                                    key = getWeekKey(date);
                                }
                                
                                if (!scoreMap.has(key)) {
                                    scoreMap.set(key, []);
                                }
                                const scoreValue = parseFloat(score.score);
                                if (!isNaN(scoreValue) && scoreValue > 0) {
                                    scoreMap.get(key).push(scoreValue);
                                }
                            } catch (e) {
                                console.warn('解析日期失败:', score.submitDate, e);
                            }
                        }
                    });
                    
                    // 计算平均分并生成标签
                    const labels = [];
                    const scoreData = [];
                    
                    // 如果有数据，按时间排序
                    if (scoreMap.size > 0) {
                        const sortedKeys = Array.from(scoreMap.keys()).sort((a, b) => {
                            // 尝试按时间排序
                            try {
                                // 如果是周格式，提取周数
                                const weekMatchA = a.match(/第(\d+)周/);
                                const weekMatchB = b.match(/第(\d+)周/);
                                if (weekMatchA && weekMatchB) {
                                    return parseInt(weekMatchA[1]) - parseInt(weekMatchB[1]);
                                }
                                // 如果是日期格式，按日期排序
                                const dateA = new Date(a);
                                const dateB = new Date(b);
                                if (!isNaN(dateA.getTime()) && !isNaN(dateB.getTime())) {
                                    return dateA - dateB;
                                }
                            } catch (e) {
                                // 如果排序失败，保持原顺序
                            }
                            return a.localeCompare(b);
                        });
                        
                        sortedKeys.forEach(key => {
                            const weekScores = scoreMap.get(key);
                            if (weekScores.length > 0) {
                                const avgScore = weekScores.reduce((sum, s) => sum + s, 0) / weekScores.length;
                                labels.push(key);
                                scoreData.push(Math.round(avgScore * 10) / 10);
                            }
                        });
                    }
                    
                    // 如果没有数据，使用时间标签并填充0
                    if (labels.length === 0) {
                        const timeLabels = generateTimeLabels(filters.timeRange);
                        labels.push(...timeLabels);
                        scoreData.push(...new Array(timeLabels.length).fill(0));
                    }
                    
                    // 确保数据和标签数量一致
                    while (scoreData.length < labels.length) {
                        scoreData.push(0);
                    }
                    while (labels.length < scoreData.length) {
                        labels.push('');
                    }
                    
                    console.log('处理后的成绩趋势数据 - 标签:', labels, '数据:', scoreData);
                    
                    const chartData = {
                        labels: labels,
                        datasets: [{
                            label: '成绩趋势',
                            data: scoreData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.3,
                            fill: true,
                            pointBackgroundColor: '#3b82f6',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 5,
                            pointHoverRadius: 7
                        }]
                    };
                    console.log('准备初始化成绩图表，数据:', chartData);
                    initScoreChart(chartData);
                } else {
                    throw new Error('API返回数据格式错误');
                }
                } catch (error) {
                console.error('获取成绩趋势数据失败:', error);
                // 接口失败时，使用空数据，仅展示时间轴
                const timeLabels = generateTimeLabels(filters.timeRange);

                console.log('接口失败，使用默认数据:', defaultData);
                initScoreChart(defaultData);
            }
        }

        // 生成时间标签
        function generateTimeLabels(timeRange = 'month') {
            const labels = [];
            const now = new Date();
            
            if (timeRange === 'week') {
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(now);
                    date.setDate(date.getDate() - i);
                    labels.push(date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }));
                }
            } else if (timeRange === 'month') {
                for (let i = 3; i >= 0; i--) {
                    const date = new Date(now);
                    date.setDate(date.getDate() - i * 7);
                    labels.push(`第${4-i}周`);
                }
            } else if (timeRange === 'quarter') {
                for (let i = 2; i >= 0; i--) {
                    const date = new Date(now);
                    date.setMonth(date.getMonth() - i);
                    labels.push(date.toLocaleDateString('zh-CN', { month: 'short' }));
                }
            } else {
                labels.push('第1周', '第2周', '第3周', '第4周', '第5周');
            }
            
            return labels;
        }
        
        // 获取周标识（用于成绩分组）
        function getWeekKey(date) {
            const year = date.getFullYear();
            const week = getWeekNumber(date);
            return `${year}年第${week}周`;
        }
        
        // 获取一年中的第几周
        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        // 从课程数据生成学习计划
        async function generateStudyPlanFromCourses(filters = {}) {
            try {
                // JWT-only 环境下先只依赖已接通的作业能力，避免撞旧课程接口
                const coursesResponse = isJwtStatsOnlyMode()
                    ? null
                    : await apiService.get('/api/student/courses', { page: 1, size: 10 });
                const assignmentsResponse = await apiService.get('/api/student/assignments', { page: 1, size: 20, submitted: false });
                
                const items = [];
                let completedCount = 0;
                let totalCount = 0;
                
                // 从课程生成学习计划项（最多3个）
                if (coursesResponse && coursesResponse.success && coursesResponse.data && coursesResponse.data.content) {
                    const courses = coursesResponse.data.content.slice(0, 3);
                    courses.forEach(course => {
                        totalCount++;
                        items.push({
                            name: `完成课程：${course.courseName || course.course_name || '未知课程'}`,
                            status: 'in-progress'
                        });
                    });
                }
                
                // 从待完成作业生成学习计划项（最多5个）
                if (assignmentsResponse && assignmentsResponse.success && assignmentsResponse.data && assignmentsResponse.data.content) {
                    const assignments = assignmentsResponse.data.content.slice(0, 5);
                    assignments.forEach(assignment => {
                        // 检查是否有提交记录
                        const hasSubmission = assignment.submission && assignment.submission.id;
                        const isGraded = assignment.submission && assignment.submission.graded;
                        
                        totalCount++;
                        if (!hasSubmission || !isGraded) {
                            try {
                                const dueDate = assignment.dueDate ? new Date(assignment.dueDate) : null;
                                const now = new Date();
                                const isOverdue = dueDate && dueDate < now;
                                
                                items.push({
                                    name: `完成作业：${assignment.title || '未命名作业'}`,
                                    status: isOverdue ? 'pending' : 'in-progress'
                                });
                            } catch (e) {
                                items.push({
                                    name: `完成作业：${assignment.title || '未命名作业'}`,
                                    status: 'in-progress'
                                });
                            }
                        } else {
                            completedCount++;
                        }
                    });
                }
                
                // 如果还没有计划项，添加默认项
                if (items.length === 0) {
                    items.push(
                        {
                            name: '完成本周学习任务',
                            status: 'in-progress'
                        },
                        {
                            name: '复习已学知识点',
                            status: 'pending'
                        },
                        {
                            name: '准备下周考试',
                            status: 'pending'
                        }
                    );
                    totalCount = 3;
                    completedCount = 0;
                }
                
                // 计算完成率
                const completionPercentage = totalCount > 0 ? Math.min(100, Math.max(0, Math.round((completedCount / totalCount) * 100))) : 0;
                
                console.log('生成的学习计划:', { completionPercentage, items, totalCount, completedCount });
                
                updateStudyPlan({
                    completionPercentage: completionPercentage,
                    items: items
                });
            } catch (error) {
                console.error('生成学习计划失败:', error);
                // 使用默认学习计划
                updateStudyPlan({
                    completionPercentage: 0,
                    items: [
                        {
                            name: '完成本周学习任务',
                            status: 'in-progress'
                        },
                        {
                            name: '复习已学知识点',
                            status: 'pending'
                        },
                        {
                            name: '准备下周考试',
                            status: 'pending'
                        }
                    ]
                });
            }
        }
        
        // 更新学习计划
        function updateStudyPlan(plan) {
            // 更新完成率
            const completionPercentage = plan.completionPercentage || 0;
            document.getElementById('planCompletion').textContent = `${completionPercentage}%`;
            
            // 更新进度圆环
            const progressCircle = document.querySelector('.progress-circle-progress');
            const circumference = 2 * Math.PI * 45;
            const offset = circumference - (completionPercentage / 100) * circumference;
            progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
            progressCircle.style.strokeDashoffset = offset;
            
            // 更新学习计划项目
            const planDetails = document.getElementById('planDetails');
            
            if (!plan.items || plan.items.length === 0) {
                planDetails.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fa fa-info-circle" style="font-size: 24px; color: #6c757d;"></i>
                        <p class="mt-2">暂无学习计划项目</p>
                    </div>
                `;
                return;
            }
            
            planDetails.innerHTML = plan.items.map(item => {
                // 确定状态图标和类名
                let statusIcon = 'fa-circle-o';
                let statusColor = '#0d6efd';
                let statusClass = 'pending';
                let statusText = '待开始';
                
                switch (item.status) {
                    case 'completed':
                        statusIcon = 'fa-check-circle';
                        statusColor = '#198754';
                        statusClass = 'completed';
                        statusText = '已完成';
                        break;
                    case 'in-progress':
                        statusIcon = 'fa-clock-o';
                        statusColor = '#ffc107';
                        statusClass = 'in-progress';
                        statusText = '进行中';
                        break;
                    default:
                        statusIcon = 'fa-circle-o';
                        statusColor = '#0d6efd';
                        statusClass = 'pending';
                        statusText = '待开始';
                }
                
                return `
                    <div class="plan-item">
                        <div class="plan-item-name">
                            <i class="fa ${statusIcon}" style="color: ${statusColor};"></i>
                            <span>${item.name}</span>
                        </div>
                        <div class="plan-item-status ${statusClass}">${statusText}</div>
                    </div>
                `;
            }).join('');
        }

            });

            // 如果图表存在，销毁并重新创建

            if (existingChart) {
                existingChart.destroy();
                scoreChart = null;
            }

                data: { labels, datasets },

            showNotification('知识点数据已刷新', 'success');
        }
        
        // 查看完整计划
        function viewFullPlan() {
            console.log('查看完整计划');
            
            // 这里可以添加查看完整计划的逻辑
            // 例如打开一个模态框或跳转到新页面
            showNotification('正在加载完整学习计划...', 'info');
        }
        
        // 显示通知
        function showNotification(message, type = 'info') {
            // 映射类型到Bootstrap类
            const typeMap = {
                'success': 'success',
                'error': 'danger',
                'warning': 'warning',
                'info': 'info'
            };
            
            const bootstrapType = typeMap[type] || 'info';
            
            // 创建通知元素
            const notification = document.createElement('div');
            notification.className = `toast align-items-center text-white bg-${bootstrapType} border-0 position-fixed`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            notification.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="fa fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}" style="margin-right: 8px;"></i>
                        ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            
            // 添加到页面
            document.body.appendChild(notification);
            
            // 显示通知
            const toast = new bootstrap.Toast(notification, {
                autohide: true,
                delay: 3000
            });
            toast.show();
            
            // 3秒后自动移除
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 3500);
        }
        
        // 检查登录状态
        function checkLoginStatus() {
            if (!CommonUI.requireStudentSession({ redirectUrl: 'student-login.html' })) {
                return false;
            }
            CommonUI.loadUserDropdown('userDropdownContainer', 'student')
                .catch(error => {
                    console.error('加载用户下拉组件失败:', error);
                });
            return true;
        }

        // 设置导航菜单激活状态
        function setActiveMenu() {
            CommonUI.highlightActiveNavItem({ selector: '.sidebar .menu-item, .menu-item' });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            if (!checkLoginStatus()) {
                return;
            }
            setActiveMenu();
            if (window.loadFrontendCapabilities) {
                window.loadFrontendCapabilities();
            }
            
            // 初始化API服务
            initAPIService();

            if (window.isJwtOnlyStudentSession && window.isJwtOnlyStudentSession()) {
                showNotification('检测到当前为 JWT 微服务登录环境，学习数据页将优先加载已接通的统计接口。', 'info');
            }
            
            // 动态加载下拉选项
            await loadSemesters();
            await loadCourses();
            await loadTimeRanges();
            
            // 初始化空图表，后续从API获取数据后更新
            initScoreChart();
            initStudyTimeChart();
            
            // 获取初始筛选条件并加载数据
            const initialFilters = getCurrentFilters();

            if (isJwtStatsOnlyMode()) {
                await applyJwtStatsOnlyFallback(initialFilters);
                await fetchStudentStats(initialFilters);
                await fetchScoreTrend(initialFilters);
                await fetchStudyTimeData(initialFilters);
                await fetchKnowledgeData(initialFilters);
            } else {
                // 并行加载所有数据
                await Promise.all([
                    fetchStudentStats(initialFilters),
                    fetchScoreTrend(initialFilters),
                    fetchStudyTimeData(initialFilters),
                    fetchKnowledgeData(initialFilters),
                    fetchStudyPlanData(initialFilters)
                ]);
            }
            
            // 为筛选下拉框添加change事件监听（可选：实现自动更新）
            // 当前设计为手动点击"应用筛选"按钮，如需自动更新可取消注释
            /*
            const semesterSelect = document.getElementById('semester');
            const courseSelect = document.getElementById('course');
            const timeRangeSelect = document.getElementById('time-range');
            
            if (semesterSelect) {
                semesterSelect.addEventListener('change', () => {
                    applyFilters();
                });
            }
            
            if (courseSelect) {
                courseSelect.addEventListener('change', () => {
                    applyFilters();
                });
            }
            
            if (timeRangeSelect) {
                timeRangeSelect.addEventListener('change', () => {
                    applyFilters();
                });
            }
            */
            
            // 侧边栏切换按钮事件监听
            const toggleSidebarBtn = document.getElementById('toggleSidebar');
            if (toggleSidebarBtn) {
                toggleSidebarBtn.addEventListener('click', toggleSidebar);
            }
        });
    </script>
