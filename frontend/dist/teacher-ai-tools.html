<body class="teacher-shell-body">

    <script>
        function initializeTeacherAiSidebar() {
            const toggleBtn = document.querySelector('.toggle-btn');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');

            if (!toggleBtn || !sidebar || !mainContent) {
                return;
            }

            toggleBtn.onclick = function() {
                sidebar.classList.toggle('collapsed');
                mainContent.classList.toggle('collapsed');
            };

            const currentPage = window.location.pathname.split('/').pop();
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.toggle('active', item.getAttribute('href') === currentPage);
            });
        }

        // 加载侧边栏组件
        fetch('components/teacher-sidebar-nav.html?v=20260608-theme-4')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                initializeTeacherAiSidebar();
            })
            .catch(error => console.error('加载侧边栏组件失败:', error));

    <script>
        function getTeacherAiCsrfToken() {
            const match = document.cookie.match(/XSRF-TOKEN=([^;]+)/);
            return match ? decodeURIComponent(match[1]) : null;
        }

        async function requestTeacherAi(endpoint, payload) {
            const accessToken = sessionStorage.getItem('token');
            if (!accessToken) {
                throw new Error('当前登录状态已失效，请重新登录后再试。');
            }

            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${accessToken}`
            };
            const csrfToken = getTeacherAiCsrfToken();
            if (csrfToken) {
                headers['X-XSRF-TOKEN'] = csrfToken;
            }

            const response = await fetch(endpoint, {
                method: 'POST',
                credentials: 'include',
                headers,
                body: JSON.stringify(payload)
            });

            const result = await response.json().catch(() => null);
            if (!response.ok || !result?.success) {
                throw new Error(result?.message || `请求失败（${response.status}）`);
            }
            return result.data || {};
        }

        function resolveCorrectAnswerIndexes(answer, options = []) {
            if (!answer || !Array.isArray(options) || options.length === 0) {
                return [];
            }
            const normalizedAnswer = String(answer).trim().toUpperCase();
            const optionIndex = normalizedAnswer.charCodeAt(0) - 65;
            if (optionIndex >= 0 && optionIndex < options.length) {
                return [optionIndex];
            }
            return [];
        }

        function buildQuestionResultFromApi(question = {}, context = {}) {
            const difficulty = question.difficulty || context.difficulty || 'medium';
            return {
                type: 'question',
                questionType: question.type || '题目',
                difficulty,
                content: question.content || '暂无题目内容',
                options: Array.isArray(question.options) ? question.options : [],
                correctAnswers: resolveCorrectAnswerIndexes(question.answer, question.options),
                answer: question.answer || '',
                explanation: question.score != null
                    ? `${question.explanation || ''}${question.explanation ? ' ' : ''}分值：${question.score}分`
                    : (question.explanation || ''),
                knowledgePoints: context.topic ? [context.topic] : []
            };
        }

        function buildQuestionResultsFromApi(payload) {
            const questions = Array.isArray(payload?.questions) ? payload.questions : [];
            return questions.map(question => buildQuestionResultFromApi(question, {
                topic: payload.topic || '',
                difficulty: payload.difficulty || ''
            }));
        }

        function buildExamResultsFromApi(payload) {
            const summary = {
                type: 'exam-section',
                title: payload.title || `${payload.courseName || '未命名课程'}模拟试卷`,
                content: `<p>课程：${payload.courseName || '未命名课程'}</p>`,
                distribution: `总分：${payload.totalScore || '--'} 分；时长：${payload.duration || '--'} 分钟；难度：${payload.difficulty || '未标注'}`
            };
            const questions = Array.isArray(payload?.questions) ? payload.questions : [];
            return [
                summary,
                ...questions.map(question => buildQuestionResultFromApi(question, {
                    topic: payload.courseName || '',
                    difficulty: payload.difficulty || ''
                }))
            ];
        }

        function buildLearningSuggestionResults(payload, context = {}) {
            const suggestions = Array.isArray(payload?.suggestions) ? payload.suggestions : [];
            const items = suggestions.length > 0
                ? `<ul>${suggestions.map(item => `<li>${item}</li>`).join('')}</ul>`
                : '<p>当前没有可展示的学习建议。</p>';
            return [{
                type: 'suggestion',
                title: context.studentLabel ? `学习建议 - ${context.studentLabel}` : '学习建议',
                content: `<p>基于当前学生身份生成学习建议：</p>${items}`,
                studentId: payload.studentId || context.studentId || ''
            }];
        }

        function buildUnavailableAiToolResult(title, message) {
            return {
                type: 'unavailable',
                title,
                content: message
            };
        }

        // 通用函数：为教师端加载右上角用户下拉菜单，并执行组件内脚本
        async function loadUserDropdownForTeacher(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            try {
            const resp = await fetch('components/user-dropdown.html?v=20260608-theme-4');
                if (!resp.ok) {
                    console.error('加载用户下拉组件失败:', resp.status, resp.statusText);
                    return;
                }

                const html = await resp.text();
                container.innerHTML = html;

                // 手动执行组件中的内联脚本，确保 UserDropdown 类可用
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const script = document.createElement('script');
                    if (oldScript.src) {
                        script.src = oldScript.src;
                    } else {
                        script.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(script);
                    oldScript.remove();
                });

                if (typeof UserDropdown !== 'undefined') {
                    new UserDropdown(containerId, 'teacher');
                } else {
                    console.error('UserDropdown 组件未定义，可能脚本未正确加载');
                }
            } catch (e) {
                console.error('加载用户下拉组件异常:', e);
            }
        }

        // 初始化侧边栏切换 & 顶部用户下拉
        document.addEventListener('DOMContentLoaded', async function() {
            // 登录检查：无教师登录信息则跳转
            const user = sessionStorage.getItem('user');
            if (!user) {
                window.location.href = 'teacher-login.html';
                return;
            }

            // 加载右上角用户下拉菜单（教师端蓝色主题）
            await loadUserDropdownForTeacher('userDropdownContainer');
        });
        
        // 显示加载状态
        function showLoading() {
            document.querySelector('.content-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('loading-container').style.display = 'flex';
        }
        
        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loading-container').style.display = 'none';
        }
        
        // 显示结果
        function showResults(results) {
            hideLoading();
            
            // 更新结果计数
            document.getElementById('result-count').textContent = results.length;
            
            // 渲染结果内容
            const resultContent = document.getElementById('result-content');
            resultContent.innerHTML = '';
            
            if (results.length === 0) {
                resultContent.innerHTML = '<p class="text-center text-muted">没有生成任何结果。</p>';
            } else {
                results.forEach((result, index) => {
                    const resultElement = createResultElement(result, index + 1);
                    resultContent.appendChild(resultElement);
                });
            }
            
            // 显示结果容器
            document.getElementById('result-container').style.display = 'block';
        }
        
        // 创建结果元素
        function createResultElement(result, index) {
            const div = document.createElement('div');
            div.className = 'question-card';

            const difficultyLabel = {
                easy: '简单',
                medium: '中等',
                hard: '困难',
                expert: '专家级'
            };

            if (result.type === 'question') {
                const options = result.options || [];
                const correct = result.correctAnswers || [];
                const difficulty = difficultyLabel[result.difficulty] || result.difficulty || '未标注';

                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">${result.questionType || '题目'}</span>
                        </div>
                        <span class="question-difficulty difficulty-${result.difficulty || 'easy'}">${difficulty}</span>
                    </div>
                    <div class="question-content">${result.content}</div>
                `;

                if (options.length > 0) {
                    const optionContainer = document.createElement('div');
                    optionContainer.className = 'question-options';
                    options.forEach((option, optIndex) => {
                        const isCorrect = correct.includes(optIndex);
                        const optionDiv = document.createElement('div');
                        optionDiv.className = `question-option ${isCorrect ? 'text-success' : ''}`;
                        optionDiv.innerHTML = `
                            <input type="radio" name="question-${index}" disabled>
                            ${String.fromCharCode(65 + optIndex)}. ${option}
                            ${isCorrect ? '<i class="fa fa-check text-success"></i>' : ''}
                        `;
                        optionContainer.appendChild(optionDiv);
                    });
                    div.appendChild(optionContainer);
                }

                if (result.knowledgePoints && result.knowledgePoints.length > 0) {
                    const tags = document.createElement('div');
                    tags.className = 'knowledge-tags';
                    result.knowledgePoints.forEach(tag => {
                        const span = document.createElement('span');
                        span.className = 'knowledge-tag';
                        span.textContent = tag;
                        tags.appendChild(span);
                    });
                    div.appendChild(tags);
                }

                if (result.answer || result.explanation) {
                    const answerBlock = document.createElement('div');
                    answerBlock.className = 'mt-3';
                    answerBlock.innerHTML = `
                        ${result.answer ? `<h6><strong>答案：</strong>${result.answer}</h6>` : ''}
                        ${result.explanation ? `<h6><strong>解析：</strong>${result.explanation}</h6>` : ''}
                    `;
                    div.appendChild(answerBlock);
                }
            } else if (result.type === 'knowledge') {
                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">知识点讲解</span>
                        </div>
                        <span class="question-difficulty difficulty-${result.depth || 'medium'}">${result.depth || ''}</span>
                    </div>
                    <div class="question-content">
                        <h5>${result.title}</h5>
                        <p>${result.content}</p>
                    </div>
                `;

                if (result.examples && result.examples.length > 0) {
                    const exampleWrap = document.createElement('div');
                    exampleWrap.className = 'mt-3';
                    exampleWrap.innerHTML = '<h6><strong>示例：</strong></h6>';
                    result.examples.forEach(example => {
                        const exDiv = document.createElement('div');
                        exDiv.className = 'bg-light p-2 mt-2 rounded';
                        exDiv.textContent = example;
                        exampleWrap.appendChild(exDiv);
                    });
                    div.appendChild(exampleWrap);
                }

                if (result.exercises && result.exercises.length > 0) {
                    const practice = document.createElement('div');
                    practice.className = 'mt-3';
                    practice.innerHTML = '<h6><strong>巩固练习：</strong></h6>';
                    const list = document.createElement('ul');
                    list.className = 'mb-0';
                    result.exercises.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = item;
                        list.appendChild(li);
                    });
                    practice.appendChild(list);
                    div.appendChild(practice);
                }
            } else if (result.type === 'exam-section') {
                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">试卷结构</span>
                        </div>
                    </div>
                    <div class="question-content">
                        <h5>${result.title || ''}</h5>
                        <div>${result.content || ''}</div>
                        ${result.distribution ? `<p class="mt-2 text-muted">${result.distribution}</p>` : ''}
                    </div>
                `;
            } else if (result.type === 'evaluation') {
                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">批改报告</span>
                        </div>
                        ${result.score ? `<span class="question-difficulty difficulty-medium">得分：${result.score}</span>` : ''}
                    </div>
                    <div class="question-content">
                        <h5>${result.title || ''}</h5>
                        <div>${result.content || ''}</div>
                        ${result.suggestions ? `<div class="mt-2 text-muted">${result.suggestions}</div>` : ''}
                    </div>
                `;
            } else if (result.type === 'analysis') {
                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">学情分析</span>
                        </div>
                    </div>
                    <div class="question-content">
                        <h5>${result.title || ''}</h5>
                        <div>${result.content || ''}</div>
                        ${result.recommendations ? `<div class="mt-2"><strong>学习建议：</strong>${result.recommendations}</div>` : ''}
                    </div>
                `;
            } else if (result.type === 'plan') {
                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">教学计划</span>
                        </div>
                        ${result.weeks ? `<span class="question-difficulty difficulty-medium">${result.weeks} 周</span>` : ''}
                    </div>
                    <div class="question-content">
                        <h5>${result.title || ''}</h5>
                        <div>${result.content || ''}</div>
                        ${result.keyMilestones ? `<div class="mt-2"><strong>关键里程碑：</strong>${result.keyMilestones}</div>` : ''}
                    </div>
                `;
            } else if (result.type === 'suggestion') {
                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">学习建议</span>
                        </div>
                        ${result.studentId ? `<span class="question-difficulty difficulty-medium">学生 ID：${result.studentId}</span>` : ''}
                    </div>
                    <div class="question-content">
                        <h5>${result.title || ''}</h5>
                        <div>${result.content || ''}</div>
                    </div>
                `;
            } else if (result.type === 'unavailable') {
                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">能力状态</span>
                        </div>
                    </div>
                    <div class="question-content">
                        <h5>${result.title || ''}</h5>
                        <p>${result.content || ''}</p>
                    </div>
                `;
            } else {
                div.innerHTML = `
                    <div class="question-header">
                        <div>
                            <span class="question-number">${index}.</span>
                            <span class="question-type">${result.type}</span>
                        </div>
                    </div>
                    <div class="question-content">${result.content}</div>
                `;
            }

            return div;
        }
        
        // 显示消息提示
        function showMessage(message, type = 'success') {
            const messageContainer = document.getElementById('message-container');
            const messageAlert = document.getElementById('message-alert');
            const messageText = document.getElementById('message-text');
            
            // 设置消息类型
            messageAlert.className = `alert alert-${type} alert-dismissible fade show`;
            messageText.textContent = message;
            
            // 显示消息
            messageContainer.style.display = 'block';
            
            // 3秒后自动隐藏
            setTimeout(() => {
                messageContainer.style.display = 'none';
            }, 3000);
        }
        
        // 生成知识点讲解
        function generateKnowledgeExplain() {
            showLoading();
            showResults([buildUnavailableAiToolResult('知识点讲解', '当前暂未提供知识点讲解能力，请稍后再试。')]);
            showMessage('当前暂未提供知识点讲解能力，请稍后再试。', 'info');
        }
        
        // 作业批改
        function evaluateAssignment() {
            showLoading();
            showResults([buildUnavailableAiToolResult('作业批改', '当前暂未提供作业批改能力，请稍后再试。')]);
            showMessage('当前暂未提供作业批改能力，请稍后再试。', 'info');
        }
        
        // 生成教学计划
        function generateTeachingPlan() {
            showLoading();
            showResults([buildUnavailableAiToolResult('教学计划生成', '当前暂未提供教学计划生成能力，请稍后再试。')]);
            showMessage('当前暂未提供教学计划生成能力，请稍后再试。', 'info');
        }
        
        // 导出结果
        function exportResults() {
            const resultContent = document.getElementById('result-content');
            const resultCount = document.getElementById('result-count');
            if (!resultContent || !resultContent.textContent.trim()) {
                showMessage('当前没有可导出的结果。', 'info');
                return;
            }
            const exportText = [
                '辅助工具导出结果',
                `导出时间：${new Date().toLocaleString('zh-CN')}`,
                `结果数量：${resultCount ? resultCount.textContent : '0'}`,
                '',
                resultContent.innerText.trim()
            ].join('\n');
            const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `teacher-ai-results-${new Date().toISOString().slice(0, 10)}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showMessage('结果已导出到本地文件。', 'success');
        }
        
        // 清空结果
        function clearResults() {
            document.getElementById('result-content').innerHTML = '<p class="text-center text-muted">没有生成任何结果。</p>';
            document.getElementById('result-count').textContent = '0';
            showMessage('结果已清空！', 'success');
        }
        
        // 返回工具列表
        function backToTools() {
            // 隐藏结果容器
            document.getElementById('result-container').style.display = 'none';
            // 显示主内容区
            document.querySelector('.content-container').style.display = 'block';
        }

        function initializeTeacherAiEmptyState() {
            const input = document.querySelector('[data-agent-input]');
            const emptyState = document.querySelector('[data-teacher-ai-empty-state]');
            if (!input || !emptyState) {
                return;
            }

            document.querySelectorAll('[data-teacher-ai-example]').forEach(button => {
                button.addEventListener('click', () => {
                    input.value = button.dataset.teacherAiExample || '';
                    input.focus();
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                });
            });

            const form = document.querySelector('[data-agent-form]');
            if (form) {
                form.addEventListener('submit', () => {
                    emptyState.style.display = 'none';
                });
            }
        }

        initializeTeacherAiEmptyState();
    </script>
