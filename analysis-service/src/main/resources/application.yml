spring:
  application:
    name: analysis-service
  profiles:
    default: dev
  config:
    import:
      - configserver:${CONFIG_SERVER_URL:http://localhost:8888}

---
spring:
  config:
    activate:
      on-profile: test
    import:
      - optional:classpath:application-common.yml
  cloud:
    config:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: docker | prod
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 5000
        multiplier: 1.5
