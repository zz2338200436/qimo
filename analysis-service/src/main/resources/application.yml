spring:
  application:
    name: analysis-service
  config:
    import: optional:classpath:application-common.yml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${ANALYSIS_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/sc_analysis?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
    username: ${ANALYSIS_DB_USERNAME:${DB_USERNAME:dev_user}}
    password: ${ANALYSIS_DB_PASSWORD:${DB_PASSWORD:dev_only_pwd}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${ANALYSIS_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  cloud:
    function:
      definition: assignmentSubmittedAnalysisConsumer;examFinishedAnalysisConsumer
    stream:
      bindings:
        assignmentSubmittedAnalysisConsumer-in-0:
          destination: assignment.submitted
          group: analysis-service
        examFinishedAnalysisConsumer-in-0:
          destination: exam.finished
          group: analysis-service

server:
  port: 8086

platform:
  outbox:
    relay:
      binding-name: ${ANALYSIS_OUTBOX_BINDING_NAME:early.warning.raised}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
