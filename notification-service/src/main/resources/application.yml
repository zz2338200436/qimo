spring:
  application:
    name: notification-service
  config:
    import: optional:classpath:application-common.yml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${NOTIFICATION_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/sc_notification?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
    username: ${NOTIFICATION_DB_USERNAME:${DB_USERNAME:dev_user}}
    password: ${NOTIFICATION_DB_PASSWORD:${DB_PASSWORD:dev_only_pwd}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${NOTIFICATION_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  cloud:
    function:
      definition: assignmentSubmittedConsumer;assignmentGradedConsumer;examFinishedConsumer;earlyWarningRaisedConsumer
    stream:
      bindings:
        assignmentSubmittedConsumer-in-0:
          destination: assignment.submitted
          group: notification-service
        assignmentGradedConsumer-in-0:
          destination: assignment.graded
          group: notification-service
        examFinishedConsumer-in-0:
          destination: exam.finished
          group: notification-service
        earlyWarningRaisedConsumer-in-0:
          destination: early.warning.raised
          group: notification-service

server:
  port: 8087

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    ip-address: ${EUREKA_INSTANCE_IP:127.0.0.1}
